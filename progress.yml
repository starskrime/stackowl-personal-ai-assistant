    detail: "Per-turn context_budget budgeter vs toolsets + progressive disclosure. Budgeter should go."
    items: [D01.3, D05.2, D05.4]
    decided_2026_07_29: >
      D01.3 DECIDED it and handed the implementation to D05.2/D05.4. The budgeter
      goes; toolsets replace it. It is NOT deleted yet because the replacement is
      0/7 and context_budget.tool_budget_tokens carries a real capability
      (sizing the presented set to window minus the turn's fixed cost) that must
      survive. D01.3's doc records the three constraints D05.2 must honour.
      The premise is no longer an assertion: 15 measured change events, the tool
      COUNT itself oscillating in 4 of 5 (lane, owl) pairs.
    resolved_2026_08_02_BUT_NOT_AS_WRITTEN: >
      D05.2 shipped 7/7 and X2 is resolved — but read the detail line above
      before recording this as "done as planned", because THE BUDGETER DID NOT
      GO. It is still there: fit_items, tool_budget_tokens and the window
      measurement all survive untouched.
      What was actually wrong with it turned out to be two things, neither of
      which is the budgeter existing:
        (1) its ORDERING INPUT was the turn's request_text — replaced by measured
            per-owl usage;
        (2) it RAN EVERY TURN against a fixed_cost that includes the growing
            history, so the fit shrank as the session went on — the result is now
            memoized per session.
      So there are no longer two competing tool-selection mechanisms, which is
      what X2 was really about: there is ONE, running once per session, ordered
      by a stable signal. "Budgeter should go" was the right diagnosis of a
      duplication and the wrong prescription for it — deleting it would have
      taken the window-awareness with it, which is exactly the loss D01.3's
      constraint 2 forbade.
