      when: 2026-07-27
      stage: "D01.1 implement (stage 2), confirmed closed in D01.1 cleanup"
      how: >
        assemble calls build_stable_base_prompt(lean=lean) with no
        describe_tool_protocol argument, so it defaults True on every turn.
      why_the_safety_behaviour_did_not_regress: >
        The imitation defence the conditional existed for did not go away — it
        MOVED to the volatile tier. volatile_turn_context(capabilities_offered
        =False) states "No capabilities are available to you this turn. Do not
        attempt to call a function, tool, or capability of any kind" on the turn
        that is actually tool-free. That is strictly better than the old silence:
        omitting the taught ACTION: format only stopped the model imitating OUR
        format, and never stopped a natively tool-trained model attempting its
        own convention (observed live as a namespaced "default_api:search{…}"
