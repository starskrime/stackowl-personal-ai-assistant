    baseline:
      captured: 2026-07-25
      doc: docs/hermes-mapping/designs/D01.6-baseline.md
      session: "72055773 — 5 real Telegram messages, one requesting web research"
      measured:
        llm_calls: 40
        distinct_prompts_per_session: 10
        distinct_prompts_per_trace: 2
        input_tokens: 180712
        cached_input_tokens: 0
        turns_reporting_cache: 0
        avg_ttft_ms: 887
        cost_usd: 2.85
        system_prompt_chars: "0 -> 13001, varying call to call"
      findings:
        - "D01.1 CONFLICT CONFIRMED, and sharper than assumed: the prompt changes MID-TURN, between consecutive calls answering the same message — not merely between turns. The D01.1 invariant must therefore be asserted per TRACE as well as per session."
        - "Control case found unprompted: scheduled goal-owl_lifecycle sessions show 1 distinct prompt across 10 and 6 calls. The machinery CAN produce a stable prompt; the interactive path is what destabilises it."
        - "METRIC 1 IS NOT MEASURABLE ON THIS DEPLOYMENT. NeraAiRaw reports no cache fields in any of the three accepted shapes. Invariant I4 earned its keep: 0-with-0-reporting is a silent gateway, NOT a cold cache. D01.1 must be proven via prompt stability, input tokens and cost instead."
        - "CORRECTION to the first reading: the 40 calls are not tool-loop waste. web_fetch ran 6 times for a genuine research request, and a long tool loop is precisely the workload prefix caching is designed for — this makes D01.1 MORE valuable, not less."
        - "SECOND CORRECTION: the four -fix traces (72% of spend, $2.05 of $2.85) are retry_actuator.py:112 running a CORRECTIVE re-run. Trigger logged verbatim: 'it cited sources/URLs but NO source was actually retrieved this turn — the citations are fabricated.' This is the grounding gate catching hallucinated citations and forcing real retrieval. It is the platform working correctly, and the 20x cost is the price of not shipping fabricated sources."
      lesson_for_the_program: >
        An expensive path is not automatically a wasteful one. A cost-reduction item that had
        blindly suppressed the -fix path would have deleted one of StackOwl's genuine advantages
        over the reference platform — Hermes has no equivalent of the acceptance/grounding veto.
