  THE_LESSON_THAT_COST_THE_MOST_THIS_ARC: >-
    A DELETION IS NOT LIVE UNTIL THE PROCESS HOLDING THE OLD CODE IS GONE. The
    extractor modules were deleted from disk and the platform kept mining for
    another ~18,500 facts (89,031 -> 107,576) because it had been up since the
    previous day. Restart and verify via the JSONL log, every time.

  AND_THE_LESSON_ABOUT_REMOVING_A_LAYER: >-
    staged_facts served TWO masters — the dead fact queue AND the live conversation
    buffer classify reads every turn. Purging it deleted live short-term memory
    (bounded, self-healing). Before removing a store, ask what ELSE reads it, and ask
    what BOUNDED it: removing the writers also removed the only thing pruning it,
    which recreated the unbounded-growth disease one layer down.

  AND_THE_LESSON_ABOUT_TEST_DOUBLES: >-
    SEVEN instances this arc of a double that had stopped resembling the real thing:
    a scripted provider that accepted plain dicts where the real one reads
    message.documents; fixtures carrying a `summary` field removed months earlier;
    two hand-rolled copies of one table's DDL that had already drifted from each
    other. Where possible, GENERATE fixtures from the same constants the code uses.

  AND_THE_PATTERN_UNDERNEATH_NEARLY_EVERY_DEFECT: >-
    A write that happens and an effect that does not. A reader with no writer; an FTS
    leg that was never wired so archived skills still ranked; 12,200 promotions a day
    into a store nothing retrieved; a retry_at that added a trigger instead of a
    delay; a budget enforcer measuring a table that is always zero. Measure the
    EFFECT, never trust the call.

  PROVIDER_OUTAGE_ROOT_CAUSE_2026_08_14: >-
    The "ALL providers unreachable" errors were THE VPN BEING DOWN, not anything in the
    code. gp-vpn.service had been in `failed` state for ~19h (since 2026-08-13T03:07:59,
    HTTP 512 from gp.risk.az at getconfig.esp), so llm-gateway.dev.nera.gov — an internal
    host — had no DNS entry at all. Restarted the unit: tunnel up, "Configured as
    10.10.100.15", ESP established, session auth valid to 2026-08-16T22:16. The gateway
    then resolved to 172.30.104.100 and answered HTTP 401 (alive, just unauthenticated
    from curl).
    THE PLATFORM DID NOT SELF-HEAL FROM IT. It had booted in degraded mode and cached
    that verdict — 0 successful calls and 20 unreachable events in the three minutes AFTER
    the tunnel came up. Only a restart re-probed. Worth an item: a provider marked
    unreachable at boot stays unreachable for the life of the process, however healthy the
    network becomes. That is a self-healing gap of exactly the kind the guide-star rule
    names, and nothing notices it.
    After restart: 263 INFO / 22 WARNING / 0 ERROR, 2 successful provider calls, 0
    unreachable in a clean 90-second window.
    NOTE for later: openconnect warned the server asked for a HIP report and none is
    submitted ("VPN connectivity may be disabled or limited"). The gateway route works
    regardless, so HIP is not being enforced on it today — but that is the documented
    failure mode if internal traffic starts being blocked.

