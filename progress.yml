          appended but BEFORE advancing to the next LLM round", and folds
          returned steering messages "so the next LLM round observes them". That
          is a pre-API drain; the steer lands on the next call, not a turn later.
          It also names serialize_prior as current, which clarify_pump.py:77
          records as GONE ("the gate that this map once backed is GONE").
        what_we_actually_have:
          steer: "TurnRegistry.try_steer — ATOMIC fold-or-convert under the per-turn lock, so a steer can never land in a dead turn's mailbox (the §9 lost-steer guard). If the turn finished during the slow LLM route, it returns NEW and enqueues a fresh turn instead."
          backpressure: "_put_steer_superseding — bounded asyncio.Queue with SUPERSEDE-OLDEST: under steer-spam the newest instruction always lands, the mailbox stays bounded, and the drain coalesces ALL pending into ONE [steering] message so the context window is never blown by N separate ones."
          stop: "request_stop — cooperative flag; the iteration callback raises TurnStopped. Covered by test_enforce_exit_safety's no-nudge-on-stop hazard."
          classification: "route_inflight_message resolves a mid-turn message to STEER/STOP/NEW via an LLM router that SHORT-CIRCUITS explicit /steer and /new tokens at zero cost and fail-safes to NEW on any classifier error."
          wiring: "orchestrator.py:2522 calls it from _intake, for every channel. Checked because 'registered but not reachable' is this codebase's recurring bug — here it IS reachable."
        the_only_genuine_gap: "No one-step `redirect` verb (abandon the current goal, adopt a new one). STOP + NEW already achieves it in two steps."
        why_not_built: >
          MEASURED: steer has fired TWICE, EVER — one log line on 2026-07-19 and
          one on 2026-08-02, zero on every other day examined. Adding a third verb
          to a mechanism whose first two are essentially unexercised is the same
          trap as D02.2's per-objective budget (objectives = 0 rows) and D05.1's
          skills exec path (0 of 420 skills use it). Build it when the first two
          verbs are in use and the two-step redirect proves annoying.
        the_alternative_I_offered_and_Bakir_declined: >
          That the problem might be DISCOVERABILITY rather than capability — it is
          built, wired and unused, which could mean nobody knows it is there.
          Recorded because if steer usage is ever wanted, surfacing /steer and
          /stop where a running turn is visible is the cheaper first move, not a
          new verb.
