      overrides only the fields it owns, and only when it actually has one — so a
      real outer value is never replaced by None. Byte-equivalent in production,
      where slash-command dispatch is reached with empty services (the comment
      above that call says exactly that); it only ever helped a caller that had
      wiring to lose. The harness also now passes the deps production passes.
