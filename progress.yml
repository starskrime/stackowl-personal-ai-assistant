  - id: DEBT-32
    found: 2026-07-28
    what: "The `dream-50fd10ab` scheduled job has failure_count=17 while still enabled and scheduled."
    evidence: >
      Surfaced during D01.2 validate while querying the jobs table for an
      unrelated reason: `SELECT job_id,status,enabled,failure_count FROM jobs`
      returns dream-50fd10ab status=pending enabled=1 failure_count=17,
      last_run 2026-07-28T02:20:56, next_run 2026-07-28T03:58:03. It is still
      being scheduled and still failing.
    why_it_matters: >
      Seventeen consecutive failures on an ENABLED job is a capability that has
      been dead for some time with nobody told — the Silent Fail-Open
      antipattern this program has fixed twice before. It is also exactly what
      the scheduler self-heal arc was built to catch, so either the breaker is
      not engaging for this handler or the failures are not being classified.
    decision: >
      TRACKED, NOT INVESTIGATED. Bakir chose "track it, finish D01.2 first"
      (2026-07-28) — one item in flight at a time, and this is not a regression
      from anything in D01.2. Pick it up after D01.2 closes: read jobs.last_error
      and the recent job_runs/job_results rows for this job_id first.
    root_cause_2026_07_29: >
      NOT a hang — a RATCHET, and a live money leak. Measured on the live
      database: 928 sessions staged for mining, one LLM call each at 15-35s
      observed, so a full pass was 5 to 9 HOURS against the scheduler's 1200s
      handler timeout. Every run was killed. The vicious part: _mine() runs
      BEFORE _run_phases, and the PRUNING phase is what DELETEs from
      staged_facts. Mining never finished, so the phases never ran, so the
      backlog never drained, so mining could never finish. Each run burned ~$1.50
      re-mining the same first ~60 sessions and produced nothing — roughly
      $24/day for weeks. scheduler.py even documents the stale assumption it grew
      out of: "20 minutes comfortably clears the slowest observed legitimate run
      (dream_worker: ~16 min)".
    fix: >
      A TIME BUDGET, not a session cap. mine_all(budget_s=...) stops STARTING new
      sessions once the budget is spent (the in-flight one always finishes, so a
      fact is never half extracted) and logs how many were deferred. The budget is
      DERIVED from the scheduler's own _HANDLER_TIMEOUT_SEC rather than invented,
      so retuning the timeout carries it automatically instead of letting the same
      assumption rot again. A "mine N per run" cap would have been exactly the
      arbitrary numeric limit the numeric-limits arc removed, and wrong the moment
      a session got slower.
    also_fixed: "A test spy's mine_all signature had drifted from the interface it stands in for — widened the spy, not the assertion."
    verified: "3 new tests + 23 passed across the memory suites; 179 passed across the full affected surface; ruff 46 / mypy 78 at baseline."
    the_fix_took_THREE_attempts_and_the_first_two_were_wrong:
      attempt_1_time_budget: >
        CORRECT AND NECESSARY. mine_all(budget_s=) derived from the scheduler's
        own _HANDLER_TIMEOUT_SEC. Broke the ratchet — verified live: the run
        completes, all four phases execute for the first time in 30 runs, no more
        timeouts. But it did NOT make the job progress.
      attempt_2_order_by_outcome: >
        DID NOT WORK, and the live platform said so. Ordering the queue by the
        newest fact each session had PRODUCED fails for BARREN sessions — most
        conversations yield nothing durable, so they never acquire a timestamp,
        sort first forever, and are re-mined every run at full LLM cost for
        nothing. Measured after it shipped: 4 of the 5 sessions in one run had
        ZERO staged and ZERO committed facts. The unit test passed only because
        its stub extractor always returned a fact — the barren case was exactly
        what it failed to model. A test that models only the happy path is how a
        broken fix looks fixed.
      attempt_3_mark_the_attempt: >
        STRUCTURAL. A mined session is MARKED and the queue takes only unmarked
        rows, so a session leaves because it was ATTEMPTED, not because it
        yielded something. A FAILED mine is deliberately left unmarked so a
        transient error retries rather than being dropped forever.
    migration_0105:
      what: "Rebuilt staged_facts to allow status='mined'."
      my_error: >
        I offered the marking approach as needing NO migration. Wrong — the CHECK
        forbids 'mined' — and it was the SECOND unchecked schema claim of the
        session (the first was asserting messages.role was constrained to
        user/assistant when it also permits system/tool). Bakir chose the rebuild
        over a separate state table with the real cost visible: 113,335 rows on a
        live database.
      mitigations_PERFORMED_not_assumed:
        - "543MB hot backup taken first (~/.stackowl/backups/pre-0105-20260728-213814.db)."
        - "Full rehearsal against a COPY of the real database — rows, status distribution and all three indexes verified identical before touching the live one."
        - "The runner wraps every migration in BEGIN EXCLUSIVE with ROLLBACK, so the rebuild is atomic."
      live_result: "113,335 rows preserved, status distribution unchanged, all three indexes intact, idempotent on re-run. Schema version 0105."
    THE_TEST_THAT_SAVED_IT: >
      models.py mirrored the OLD CHECK as Literal["staged","committed",
      "rejected"]. The database would have accepted 'mined' and the model would
      have RAISED on every read back — silently breaking context recall for every
      mined conversation, which is WORSE than the bug being fixed.
      test_marking_mined_does_not_hide_turns_from_context caught it before it
      shipped. THE LESSON THAT GENERALISES: widening a database constraint
      without widening its READER is a trap, and the test that catches it is the
      one asserting the data is still readable, not the one asserting it was
      written.
    PROVEN_IN_PRODUCTION:
      date: 2026-07-29
      evidence: >
        Deployed and observed. At deploy: queue(staged)=920, marked(mined)=23,
        total 943 — the arithmetic holding exactly, with 950 conversation rows
        marked and STILL PRESENT, so mined turns remain readable for context
        rather than deleted. After the first post-deploy run (04:34:54): marked
        rose 23 -> 29. Sessions now leave the queue permanently, which is the
        mechanism the whole fix rests on.
      the_queue_still_barely_moves_and_that_is_DEBT_35: >
        Net queue movement was 920 -> 919 while 6 sessions drained, because new
        conversations arrived in the same window. That is NOT a failure of this
        fix — it is the arrival-vs-drain arithmetic recorded as DEBT-35 (25
        arrivals/hour against ~13.6 drained, and 92% of the queue being machine
        lanes that can never yield a user fact). DEBT-32 made the job correct;
        DEBT-35 is about whether the work is worth doing at all.
    status: resolved

