  - id: D05.7
    title: "Tool-loop guardrails"
    domain: D05
    verdict: PARTIAL
    track: close_gap
    priority: P2
    wave: 2
    order: 14
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d057"
    gap: "(no gap line — see Ask)"
    depends_on: []
    blocks: []
    dedup_target: X5
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: "docs/reference-mapping/designs/D05.7.md"
    doc_last_verified: "2026-08-04"
    decisions:
      - date: 2026-08-04
        stage: brainstorm
        by: Bakir
        round: "4 questions over 2 rounds. Bakir asked a direct question back — 'why not replace ours with Hermes?' — which turned out to expose an error in MY framing, not his."
        THE_PREMISE_INVERTED_WHILE_MEASURING_IT: >
          DEBT-37 (filed by me yesterday) assumed long tool chains were thrash
          loops. THEY ARE NOT, at least not the headline case. The 46-call chain
          was `headhunter` running 46 web_searches and returning a real
          synthesized list of live job postings in Plano TX — productive fan-out.
          Across 365 turns with >=15 calls: 72% succeeded, median response 7,303
          chars. A naive "same tool N times -> halt" rule would have BROKEN A
          WORKING FEATURE.
        BUT_QUALITY_FALLS_OFF_A_CLIFF_with_the_baseline_measured: >
          Measured per call-count band (median quality_score, n, success%):
            0 calls  n=3822  q=0.85  99%   1007 chars
            1-2      n=432   q=0.75  99%    981
            3-4      n=238   q=0.70  97%    995
            5-14     n=476   q=0.40  94%   2261
            15+      n=273   q=0.10  96%   8000
          Monotonic collapse 0.85 -> 0.10 while success% stays ~96%: the turns
          SUCCEED and produce long answers the critic rates near zero.
          STATED AS CORRELATION, NOT CAUSATION: hard tasks may need more tools AND
          be harder to answer well, and the critic may penalise verbosity. That is
          why it is NOT the thing being guarded on — see the scope answer.
        the_dedup_answer_the_map_asked_for: >
          "Is our TurnProgressSupervisor the same thing?" NO, and it is provable.
          Ours counts consecutive ZERO-PROGRESS dispatches per TOOL NAME
          (threshold 3, or 2 on a lean window) and bounces the tool for the turn.
          Hermes has THREE detectors: exact-failure (tool + ARGS), same-tool-
          failure, and idempotent-no-progress (same RESULT).
          The gap is not theoretical: execute.py:1737 calls
          is_trustworthy_success(r.success, r.verified) -> record_progress, so a
          SUCCESSFUL repeat RESETS our streak. That is exactly why 46 successful
          web_searches never touched the breaker. Ours catches FAILURE loops;
          it is blind to productive-looking loops that go nowhere.
        I_WAS_WRONG_ABOUT_THE_COST_OF_REPLACING: >
          I framed "replace ours wholesale" as regressing failure detection to
          string-matching, because classify_tool_failure does
          '"error"' in result[:500].lower() with hardcoded `terminal`/`memory`
          cases. Bakir pushed back with "why not replace ours with Hermes" and
          checking the call path proved MY FRAMING WRONG:
            after_call(..., failed: bool | None = None) and
            `if failed is None: failed, _ = classify_tool_failure(...)`
            run_agent.py:6495 production ALWAYS passes failed= explicitly.
          Their own docstring: "safety-fallback classifier used only when callers
          don't pass failed... Production callers always pass an explicit failed=".
          So the string-matcher is NOT their production path. Porting the
          controller faithfully means feeding it OUR structured verdict, and no
          failure-detection regression occurs. His instinct was right and my
          option text overstated the cost.
        answers:
          scope: "CATCH REPETITION, NOT LENGTH. A 46-call fan-out with 46 different queries is legitimate and must not be halted; what is worth catching is the SAME call repeated — same tool AND same args — which a name-only counter cannot distinguish from fan-out."
          dedup: "REPLACE OURS WITH THEIR CONTROLLER WHOLESALE — Bakir's call, taken against my 'take the detector, not the controller' recommendation, and cheaper than I represented once the failed= contract was checked."
          warn_vs_halt: "WARN ONLY, NEVER HARD-STOP ON REPETITION. Repetition is a smell, not proof — the headhunter case shows a high count can be correct. A genuine loop then runs to the iteration cap rather than risking a truncated valid fan-out."
        what_must_survive_the_replacement:
          - "is_trustworthy_success(success, verified) as the failure signal — B4a, a SHIPPED FIX: a claimed-but-unobserved effect must not disarm the breaker. Fed in via failed=, which is their production contract anyway."
          - "reset() on tier escalation, so a stronger tier is not pre-bounced by the weak tier's open breaker. Hermes has no tiers and no equivalent."
          - "deterministic_dead / _is_transient_failure classification, which routes an open breaker into StackOwl's recovery ladder."
          - "NO hardcoded tool names. Their classify_tool_failure special-cases `terminal` and `memory` by name; that fallback path must not be ported — standing rule."
        DEBT_37_IS_RESOLVED_BY_THIS_MEASUREMENT: >
          Its open question was "fan-out or thrash?". ANSWERED: fan-out, for the
          headline case, with a real synthesized answer. The residual concern is
          the quality cliff, which is a DIFFERENT question (critic scoring vs task
          difficulty vs loop pathology) and deliberately not folded in here.
      - date: 2026-08-04
        stage: architect+implement+cleanup+test+validate+document
        by: Claude
        what_shipped:
          module: "NEW pipeline/tool_guardrails.py — ToolCallGuardrailController, ported DESIGN (side-effect-free: it returns decisions, the runtime acts). Three detectors: exact-repeat (tool+args), same-tool-failure, idempotent-no-progress."
          wiring: "execute.py _dispatch — after_call() placed where BOTH the result and the value returned to the model are in scope, so guidance actually reaches the model. A warn appends '[loop-guard] ...' to the tool output."
          alongside_not_instead: "guardrails DECIDE; TurnProgressTracker SIGNALS (turn_made_progress/no_progress_tools -> delivery_gate). Only one component makes decisions, so this is not two competing breakers."
        two_divergences_from_the_reference:
          idempotence: "Read from manifest.action_severity == 'read', NOT their hardcoded IDEMPOTENT_TOOL_NAMES / MUTATING_TOOL_NAMES frozensets. A new read-only tool is covered the day it is written. Hardcoded tool-name lists are against a standing rule here."
          failure_signal: "`failed` is REQUIRED — no result-text sniffing. Theirs falls back to substring-matching '\"error\"' in the blob with hardcoded `terminal`/`memory` cases, but their own docstring says production ALWAYS passes failed= explicitly. So requiring it is the faithful port AND keeps B4a (an unverified effect counts as failure, not progress)."
        args_are_hashed_never_stored: "ToolCallSignature keeps a sha256 prefix, not the args. A tool call can carry a token or a file's contents and this object is logged. Pinned by a test asserting a secret does not appear in the signature or its repr."
        A_TEST_I_WROTE_WAS_WRONG_AND_THE_CODE_WAS_RIGHT: >
          test_success_clears_the_failure_counters assumed a success with
          DIFFERENT args should clear another signature's failure count. It should
          NOT: if t{a:1} has failed identically three times that IS a loop, whether
          or not t{a:2} worked in between. The reference implementation behaves
          the same way. Replaced with two tests pinning the real semantics — same
          args clear that signature, different args do not.
        mutations:
          M10: "drop `+ _guard_note` from the return -> kills ONLY the wiring test. The 15 unit tests stay green, which is exactly the D05.2 hole this test exists to close."
          M11: "key the signature on tool NAME only -> kills test_a_fan_out_with_distinct_args_never_warns. Proves args-awareness is what protects the measured headhunter case."
        tests: "tests/pipeline/test_tool_guardrails.py — 16, including the fan-out case built from the real 46-query measurement and an end-to-end wiring test through execute.run."
        suites_green: "246 across guardrails, progress_tracker, progress liveness, dispatch, the D05.2/D05.3/D05.6 suites, the progress-supervisor journey, discovery and infra. ruff src 46 / mypy 78 unchanged."
        DEBT_37_RESOLVED_BY_MEASUREMENT: >
          Its open question was "legitimate fan-out or thrash loop?" ANSWERED:
          fan-out. The 46-call turn produced a real synthesized answer. The
          residual finding — median quality falls 0.85 -> 0.10 as call count rises
          while success% stays ~96% — is a DIFFERENT question (critic scoring vs
          task difficulty vs loop pathology) and is deliberately NOT what this
          item guards on. Stated as correlation, not causation.
    changes: []
    notes: null

