  - id: D02.1
    title: "One agent class, all surfaces"
    domain: D02
    verdict: DIVERGENT
    track: decide
    priority: P1
    wave: 3
    order: 16
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d021"
    gap: "Not a gap — a genuine fork in the road. StackOwl's pipeline is more inspectable; Hermes'"
    depends_on: []
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  no_change_needed
      cleanup:    no_change_needed
      test:       no_change_needed
      validate:   no_change_needed
      document:   done
    decided_2026_08_05: "KEEP THE REGISTRY. Bakir asked for the merge to be investigated rather than dismissed; it was costed in designs/D02.1.md and he then chose to keep the pipeline. implement..validate are no_change_needed — a legitimate outcome under PROCESS.md and the honest one here."
    doc: "docs/reference-mapping/designs/D02.1.md"
    doc_last_verified: "2026-08-05"
    decisions:
      - date: 2026-08-05
        stage: brainstorm+architect
        by: Bakir
        round: "1 question, measured first. Bakir chose 'investigate merging' over my recommendation to close it — a fair correction: I had presented a conclusion, not a costed alternative."
        THE_MAPS_TRADE_OFF_IS_HALF_FALSE: >
          It says "StackOwl's pipeline is more inspectable; Hermes' class is more
          portable and FAR EASIER TO FORK for subagents/background review."
          The second half is measurably false. StackOwl forks a subagent in ONE
          line — owls/a2a_delegation.py:215, `return await backend.run(sub_state)`.
          Build a PipelineState, call backend.run. Forking a class with ~60
          constructor params is not easier than that.
          And the registry buys something a class cannot: PIPELINE_STEPS feeds TWO
          interchangeable backends chosen by config
          (OrchestratorSettings.backend: Literal["langgraph","asyncio"]). asyncio
          runs production; langgraph is real and provides StateGraph, Send fan-out
          and CHECKPOINTING via AsyncSqliteSaver.
        the_merge_costed:
          lines_across_steps: "5,597 (execute.py alone 3,045) — a merged class would be ~5,600 lines"
          test_files_touching_steps: 115
          per_step_test_files: 9
          backends_consuming_the_registry: 2
          cross_step_imports: "ZERO. Every step is `async def run(state) -> state` and they communicate ONLY through an immutable PipelineState. There is no coupling to unpick because there is none."
        strongest_case_FOR_merging_stated_properly: >
          Recorded rather than strawmanned, because dismissing it is what I was
          told not to do: (1) one object to hand around; (2) one class reads as one
          turn; (3) portability into another process/harness; (4) fewer
          indirections than backend -> registry -> step -> services.
          Each collapses on measurement: (1) StepServices already is that object;
          (2) execute.py at 3,045 lines is where reading difficulty actually
          lives, and merging makes it bigger; (3) measured false, one line;
          (4) the indirection IS the two-backend seam and the per-step tests.
        middle_path_recorded_not_taken: "A thin Agent facade over backend.run would deliver the ergonomic half without touching the registry. Rejected as CURRENTLY unnecessary rather than wrong — it wraps a one-line call. Worth doing the day a third caller assembles PipelineState by hand."
        what_would_change_the_conclusion: >
          Stated so the answer is not treated as permanent: remove the langgraph
          backend and the strongest structural argument goes with it; decompose
          execute.py and "one class is unreadable" weakens a lot (2,552 lines
          across 8 steps is a different object from 5,597); add a third caller
          assembling state by hand and the facade stops being redundant.
        status: "CLOSED 7/7 with no code. The investigation was the deliverable."
      - date: 2026-08-05
        stage: decision
        by: Bakir
        decision: "KEEP THE REGISTRY — close as no_change_needed."
        why_this_is_not_just_my_recommendation_restated: >
          I recommended keeping it, was told to investigate the merge properly
          instead, costed it (5,597 lines across the steps, 115 test files, 2
          config-selectable backends, ZERO cross-step imports), stated the four
          strongest arguments FOR merging in full, and showed each collapsing on
          measurement. Bakir then chose with those numbers in front of him. The
          conclusion is the same; the basis is not.
        the_maps_trade_off_is_corrected: "Its claim that a class is 'far easier to fork for subagents' is measurably false — a2a_delegation.py:215 forks in ONE line. StackOwl is both more inspectable AND easier to fork. The verdict DIVERGENT stands; the stated cost of our design does not exist."
        recorded_so_it_is_not_permanent: "Drop the langgraph backend, or decompose execute.py (3,045 lines of the 5,597), or add a third caller assembling PipelineState by hand, and the arithmetic shifts. See the doc's 'what would change this conclusion'."
    changes: []
    notes: null

  - id: D02.2
    title: "Iteration budget"
    domain: D02
    verdict: MISSING
    track: adopt
    priority: P1
    wave: 3
    order: 17
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d022"
    gap: "No bound on a runaway loop other than the tool-call breaker."
    depends_on: []
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: null
    doc_last_verified: null
    NOTE: "No design doc — the item is a 130-line module plus two loop swaps, fully documented in the module docstring and this record. DOC_STANDARD's design doc earns its place on items with a design to explain; here the decision record IS the explanation."
    decisions:
      - date: 2026-08-05
        stage: brainstorm+architect+implement+test
        by: Bakir
        THE_MAP_IS_WRONG_AGAIN_the_sixth_time: >
          It rates D02.2 MISSING: "No iteration cap found in the pipeline or the
          ReAct runner. No bound on a runaway loop other than the tool-call
          breaker." MEASURED, we were ahead on every axis BEFORE this item:
            * anthropic_provider.py:639 / openai_provider.py:662 — an ENFORCED
              `for _iter_idx in range(resolved_iterations)`.
            * Context-differentiated caps: DEFAULT_TURN_MAX_STEPS=20 interactive,
              DEFAULT_SCHEDULED_TURN_MAX_STEPS=45 background — the latter sized
              from live incident evidence ("production saw a real recurring
              goal_execution job max out at 20, then 23"), not guessed.
            * DEFAULT_TURN_MAX_TIME_S=600.0 — a TIME ceiling the reference has no
              equivalent for.
            * Per-owl ResourceCaps (max_cost_usd / max_time_s / max_steps /
              max_concurrency) on the bounds axis.
            * "Phase F — graceful max-out": one final model call WITHOUT tools
              after a wrap-up directive. That IS the "grace call" the map says we
              lack.
          Production: the cap fired ONCE in five days — a correctly sized backstop.
        the_maps_own_question_answered_empirically: >
          "Does the budget belong per-turn or per-objective?" PER-TURN, because
          objectives have never run: objectives=0 rows, objective_subgoals=0,
          objective_events=0, and the objective tool has been called 0 times in
          task_outcomes. A cumulative per-objective ceiling is a real gap in code
          and entirely theoretical in practice. NOT built — that would be
          speculative work on a feature with no usage.
        I_RECOMMENDED_no_change_needed_AND_BAKIR_OVERRODE_ME_CORRECTLY: >
          I proposed closing it, arguing consume/refund had "no measured benefit".
          Bakir chose to adopt it anyway. I then went looking for where a refund
          would earn its keep INSTEAD of implementing it for symmetry, and found
          it — so the override was right and my dismissal was under-researched.
          THREE SITES `continue` after CORRECTING the model rather than advancing
          the answer, each consuming an iteration:
            * a user steer folded at the give-up boundary,
            * the leak guard rejecting a "final answer" that was an unparsed tool
              call,
            * the persistence judge injecting a give-up directive.
          MEASURED over four days of production logs: 10-16 leak/loop-guard events
          and 18-42 give-up directives PER DAY. Against a 20-iteration interactive
          budget, a turn corrected three times loses 15% of the budget it needs to
          finish — and the correction fires precisely because that turn is already
          struggling. Charging a give-up nudge makes give-up MORE likely.
        what_shipped:
          module: "NEW providers/iteration_budget.py — consume/refund, thread-safe, refund clamped at zero so it can NEVER exceed max_total."
          loops: "Both providers: `for _iter_idx in range(...)` -> `while iter_budget.consume():`. _iter_idx preserved as budget.used so existing telemetry still reports ROUNDS ATTEMPTED — a refunded round still appears in a trace."
          refunds: "3 per provider: steer_folded, format_fix, give_up_directive."
          unchanged: "The ceilings themselves (20/45/600s), ResourceCaps, and the graceful max-out. Only what COUNTS against the budget changed."
        A_REAL_BUG_THIS_CAUGHT: >
          My first version named the object `budget` — which is ALREADY the token
          budget passed to trim_messages_to_budget in that same scope. It silently
          fed an IterationBudget into the trimmer. Caught by mypy (78 -> 84), NOT
          by any test, so a test now pins the naming in both providers.
        not_adopted: "A separate subagent cap (delegation.max_iterations=50). Unnecessary: a delegated child runs its own turn via backend.run with its own cap, and E8-S0 already bounds delegation depth. Refunds for PTC are also unnecessary — our PTC calls happen INSIDE one tool call, so they never consume an iteration."
        tests: "tests/providers/test_iteration_budget.py — 10, including one asserting all three refunds exist in BOTH providers (a budget object without refunds is just a slower range) and one pinning the token-budget shadowing bug."
        mutation_M14: "Strip the refunds from anthropic -> fails exactly the both-providers refund test."
        gates: "ruff src 46 / mypy 78 — restored after the shadowing fix took them to 48/84."
      - date: 2026-08-05
        stage: validate+document
        by: Claude
        I_SHIPPED_AN_INFINITE_LOOP_AND_CAUGHT_IT_IN_VALIDATE: >
          The refunds made the ReAct loop UNBOUNDED. A path that refunds every
          round never advances `used`, so consume() returns True forever — an
          infinite loop in production, not a slow test.
          Found by test_enforce_exit_safety HANGING: its steer stub folds a steer
          at the give-up boundary on EVERY round, which is exactly the shape of a
          model stuck being corrected. Confirmed mine by bisect — 6.35s at
          d2551102^, hangs at d2551102.
          WHY MY OWN TESTING MISSED IT: I ran the budget unit tests and three
          loop-guard suites before committing and all passed. The unit tests
          could not have caught it — THEY NEVER LOOP. Only an integration test
          that drives the real provider loop exposes an unbounded one. A property
          I could reason about (refund gives a round back) needed a test that
          actually spins the loop, and I did not write one until after it hung.
        the_fix: >
          Refunds are bounded at max_total, so the worst case is exactly 2x the
          cap and the loop always terminates. Past the cap the round is CHARGED
          with a loud WARNING: a turn corrected as many times as it had
          iterations is not converging, and draining the budget is what lets the
          graceful max-out produce an answer instead of spinning.
        tests_added: "3 regression tests including a property test across cap sizes (1/5/20/45) asserting the 2x bound. They fail FAST rather than hanging, so the suite stays usable. M15 (remove the cap) kills all three."
        suites_green: >
          ~129 provider tests across the affected paths: iteration_budget 13,
          resume_messages + resume_validation 34, leak_guard + enforce_veto +
          loop_guard 23, iteration_callback 7, auto_escalate 4,
          escalation_signal 3, enforce_exit_safety 6, anthropic_provider +
          llm_gateway 39.
        NOT_run_and_why: >
          `pytest tests/providers/` as a whole directory times out on this box —
          the standing "never a full pytest run" rule, and the reason the hang
          was only found by running a slice. Stated rather than implied:
          directory-wide green was NOT demonstrated.
        live_validation: "NOT restarted for this item. The change is inside the provider tool loop, which needs a real turn to exercise, and no interactive traffic has arrived. Same blocker as D05.2/D05.3/D05.8."
    changes: []
    notes: null

