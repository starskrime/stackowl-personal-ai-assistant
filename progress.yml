      - date: 2026-07-27
        commit: f2d811e3
        stage: implement
        slice: "6 — budget reallocation, learned by READING Hermes rather than our summary of it"
        why_this_slice_exists: >
          Bakir, mid-session: "always use Hermes as a parent golden project and
          learn from the experience and be creative how we can implement to the
          platform ... I see you asking so many questions, which some of them can
          be found in Hermes project." Acting on that immediately, I opened
          agent/prompt_caching.py (165 lines) for the first time this session —
          I had been working from the D01.2 design doc's SUMMARY of it. Two real
          improvements were sitting in it. Saved as a standing rule in
          feedback_read_hermes_before_asking.
        what_hermes_taught:
          reallocation: >
            apply_anthropic_cache_control computes `remaining = 4 -
            breakpoints_used` and hands the leftovers to messages, so a layout
            that cannot use a prefix marker still spends all four (their fallback
            is literally "one system breakpoint plus the last 3 messages"). OUR
            DESIGN SAID THE OPPOSITE — "if a span fails the minimum guard its
            breakpoint is NOT reallocated ... a simpler, assertable layout was
            chosen over a self-optimising one." That reasoning does not survive
            contact: reallocation is no less assertable (the property is "spend
            every breakpoint that has somewhere legal to go", pinned by 4 tests),
            and the old rule wasted a breakpoint on exactly the deployments the
            minimum guard exists to protect. A tools array below the floor used
            to cost us a marker; now it costs nothing.
          carrier_prefiltering: >
            Their _can_carry_marker exists so a marker is never spent on a
            message that cannot hold one. Ours skipped such a message but did NOT
            try an earlier one, so an empty tool/assistant turn in the tail
            silently cost a breakpoint. Candidates are now filtered FIRST and the
            newest `remaining` of them marked.
        what_we_did_NOT_take_and_why:
