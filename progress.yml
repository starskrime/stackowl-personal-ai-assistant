    doc_last_verified: "2026-08-11, commit 263d64f3"
    decisions:
    - 'LANCEDB ARC COMPLETE, PASS B (2026-08-14) — the dependency, the adapter, the health contributor, the semantic path and the on-disk directory are all gone. 53 files, 2,379 deletions. MEASURED OUTCOME rather than claimed: `uv sync` uninstalled lancedb, pyarrow and their chain and the venv went 5,899MB to 5,659MB — 240MB freed, against the 236MB predicted from the package sizes. The platform was restarted with them physically absent and booted with ZERO ERROR/CRITICAL and the memory subsystem wired.'
    - 'AND I INTRODUCED A BUG THAT LINT COULD NOT SEE, then caught it by reading the call site. _build_health_aggregator is invoked POSITIONALLY; deleting the lancedb argument from the CALL silently shifted memory_components.graph_health into the lancedb_adapter slot. Ruff and mypy were both clean on it. Fixed by removing the parameter from the signature too, so both sides are seven arguments again. Removing an argument from a positional call is a silent-shift hazard, not a deletion.'
    - 'ESC-5 IMPLEMENTED — `db reindex-memory` stays user-facing and re-embeds the LESSONS corpus with the active model, via a new SqliteLessonsStore.reembed_all that batches the embed and writes in ONE transaction (a half-reindexed corpus, some rows comparable and some not with no record of which, is the worst state available). With its last caller repointed, dream_worker_helpers.py had no production caller and went too — the half ESC-5 was blocking. Its test file went with it; the guarantee those dim-swap tests protected is covered in the new store by test_it_cures_a_dimension_change and test_both_dimensions_stay_reachable.'
    - 'TWO ESCALATIONS RAISED RATHER THAN DECIDED, both found by tests rather than by reading. ESC-7: memory.semantic_search_enabled is now read by NOTHING, and removing it is user-facing because MemorySettings is extra="forbid" — deleting a key a deployment has set turns a no-op toggle into a boot failure. ESC-8: /memory forget LOST ITS CONFIRMATION GATE in D08.1''s rewrite. The old tests asserted it prompts and leaves the entry until YES; the handler now calls CuratedMemory.remove() directly, matches by SUBSTRING, and reports "Removed 1 entry/entries" — so `/memory forget deploy` can take every entry mentioning deploy, and the curated files ARE the system prompt now.'
    - 'THE SANDBOX DENY-LIST TAUGHT ME SOMETHING BY FAILING. Removing lancedb from confine.py''s protected paths, I substituted "kuzu" into the workspace-relative parametrize to keep the shape covered — and it failed immediately, because kuzu lives at home()/kuzu, not under the workspace. A comment directly above says exactly that, added when the same mistake was found on 2026-08-05. The note earned its keep; the parametrize is now stackowl.db alone, with kuzu and skills asserted ABSOLUTELY below as that note already prescribed.'
    - 'LANCEDB ARC PASS A DONE (2026-08-14) — learning/lessons_lance.py DELETED (296 lines) with its dedup test, now that the corpus reads from SQLite. The dedup test''s INVARIANT was ported rather than dropped, and the provenance is worth keeping: it existed because merge_insert raised "Ambiguous merge inserts are prohibited" when one batch carried the same lesson_id twice, observed in production as skill:learned/reks-research-specialist — the very id found FOUR times in the live corpus during the move. In the new store the guarantee falls out of the PRIMARY KEY plus an upsert instead of every writer remembering to dedupe, so the bug cannot recur. build_lessons_index in the reflect-recall helper now takes the DbPool the tests already use instead of a temp-dir LanceDB, which is closer to production where both live in one database.'
    - 'PASS B SCOPED, NOT STARTED, and it is FAR smaller than the raw grep suggested: 32 test files mention lancedb, but only SEVEN have real code use (import or construct) — test_lancedb_adapter_healable, test_lancedb_dim_swap, test_recall_fts_fallback, test_recall_model_mismatch_journey, test_memory_fix_guards, _story_6_4_helpers and test_story_6_4. The other twenty-five are prose. Source side: memory/lancedb_adapter.py (395) + lancedb_helpers.py (334), plus a bounded change to sqlite_bridge — one constructor parameter, one property, and the semantic branch in recall(). Two files need care beyond the obvious: tests/paths/test_stackowl_home.py and tests/sandbox/ptc/test_confine.py reference the lancedb DIRECTORY, so the sandbox allowlist and path map have to lose it too.'
    - 'AND PASS B IS THE ONE REAL CAPABILITY LINE IN THIS ARC, flagged to Bakir rather than slipped in. Removing the dependency also removes sqlite_bridge''s SEMANTIC RECALL path. That path is provably dead — it hydrates from committed_facts, which has 0 rows, whose last writer (fact_promoter) was deleted in seam 3 pass 4 — so no behaviour changes today and keeping LanceDB purely to serve a query that can never return a row would contradict the instruction. Recorded for whoever wants facts back: the replacement pattern already EXISTS and is proven, in learning/lessons_store.py — embeddings as BLOBs plus a cached numpy scan, exact rather than approximate. So this is a deletion with a known, cheaper way back, not a capability burned.'
    - 'DELIBERATELY NOT STARTED AT THE TAIL OF A LONG ITERATION, which is this programme''s own recorded lesson about seam 3: starting a capability removal late either breaks the tree or forces a rushed mass-deletion of tests, and that is precisely the failure the seam-by-seam method exists to avoid. The scope above is complete enough that the next pass executes rather than re-derives.'
    - 'LANCEDB ARC, PART 1 (2026-08-14) — the lessons corpus MOVED to SQLite and the 3,679 live lessons came with it. New: migration 0115 (the table), 0116 (updated_at), 0117 (its index), learning/lessons_store.py, 21 tests, and a one-time move script. LessonsIndex and memory/assembly now construct SqliteLessonsStore; the LanceDB adapter is orphaned but not yet deleted. Backups first, as always: lancedb.pre-sqlite-move-20260814-205054 (120MB) and pre-lessons-move-20260814-205054.db (880MB).'
    - 'THE CONTRACT THAT HAD TO SURVIVE WAS NUMERIC, NOT STRUCTURAL, and finding that is what made this safe. heuristic_ranking scores hits as similarity + c*quality*sqrt(ln N/evidence), so the SCALE of similarity is coupled to a tuned constant — swap the metric and ranking silently re-balances while every test still passes. So the old metric was MEASURED on the live LanceDB table rather than assumed: _distance is L2 SQUARED (0.510582 against an L2 of 0.714550) and the vectors are unit-norm. The new store reproduces 1/(1+||q-e||^2) EXACTLY, and a test pins the number rather than the ordering. Squared distance is computed in full rather than via the cosine shortcut, because unit-norm is a property of today''s embedder and not of the schema.'
    - 'AND MY OWN PERFORMANCE CLAIM WAS WRONG, caught by measuring instead of shipping the docstring. I wrote that ranking would be sub-millisecond; the first live search took 111.6ms. Profiled: the numpy work is ~7ms and LOADING 3,679 rows out of SQLite is 35-70ms — the load is five to ten times the arithmetic it feeds. Two fixes were tried and REJECTED on measurement: selecting only the vector columns barely helps (35.6 vs 39.1ms, the cost is constructing rows at all) and a two-phase rank-then-hydrate is WORSE at 59ms. So the corpus is cached in-process: 69.5ms for the first search in a process, 7.9-12.1ms after.'
    - 'THEN THE FRESHNESS GUARD TURNED OUT TO COST MORE THAN WHAT IT GUARDED. The cache is invalidated by a COUNT(*)+MAX(updated_at) probe — one mechanism rather than also invalidating on local writes, because two could disagree and because only a DB probe works across the gateway/core PROCESS split. Measured: MAX(updated_at) was scanning every row at 11.6ms against 0.21ms for COUNT(*). Migration 0117 indexes it; the probe is now 0.56ms. The tempting fix — probe the already-fast MAX(rowid) — would have been WRONG: rowid does not move on an UPDATE, and lesson_id is <source>:<source_ref>, so a re-mined lesson upserts the same row and a cached reader would serve superseded text forever. Make the correct probe fast, do not swap in a fast probe that is wrong.'
    - 'THE MOVE ALSO FIXED A SILENT DEFECT AND MY VERIFICATION IS WHAT CAUGHT IT. The script wrote 3,682 rows and the table held 3,679, which it reported as a MISMATCH rather than passing. Cause: LanceDB has no primary key, and one lesson_id — skill:learned/reks-research-specialist — existed FOUR times, legacy residue from before publish() adopted merge_insert. That skill was 4x over-weighted in recall and could occupy most of the top-5 on any nearby query. In SQLite uniqueness is a PRIMARY KEY, so it is a schema guarantee rather than something every writer must remember. No data lost: 3,679 distinct lessons, 3,431 reflection / 195 skill / 53 tool_heuristic.'
    - 'PASS 4 VALIDATED LIVE 2026-08-14, not just green in tests. The running core was from 15:54 and the commits from 20:37, so it still held the OLD code — a deletion is not live until the process holding it is gone. Restarted via ./start.sh (the canonical entry point, which does its own cleanup); new core up at 20:38:48, after the commit. Evidence from ~/.stackowl/logs/stackowl.jsonl rather than a PID: ZERO ERROR/CRITICAL lines since the restart, "[memory] assembly.build: exit — all components wired" and "[scheduler] dream_worker handler registered" both present. The memory subsystem builds and the seat still registers with the promoter, its field and its clock gone.'
    - 'AND A RESTART LESSON, since it cost a command: `pkill -f "stackowl start"` KILLED MY OWN SHELL (exit 144) because the pattern matched the killing command''s own line — the same self-match already recorded for `pgrep -f` loops. start.sh is the right tool and was written for exactly this: its own pgrep is anchored to `python3? -m stackowl (start|__core__)`, which cannot match a bash wrapper. Use ./start.sh, never a hand-rolled pkill.'
    - 'ONE CHRONIC WARNING OBSERVED AND DELIBERATELY NOT CHASED: "[scheduler] assembly: telegram healer setup failed — health detection via ChannelLivenessContributor only" fires on EVERY boot (4 occurrences in the current log, including boots before this restart), so it is pre-existing and unrelated to pass 4. Recorded rather than fixed in passing, because it is a self-healing gap in the telegram channel and deserves its own look, not a drive-by.'
    - 'SEAM 3 PASS 4 DONE (2026-08-14) — FactPromoter REMOVED and with it the last of the fact pipeline. 1,154 lines out, 102 in: fact_promoter.py (366), remember_fact, five pure promotion test files, the assembly field/construction, and the WallClock that existed only to give the promoter a settle window (removing a writer orphans what fed it — ruff caught the clock). The source side was SMALLER than scoped: MemoryComponents.promoter had zero consumers outside assembly.py, the same assigned-and-never-read shape as seam 3 part 1''s MemoryCommand. 84 tests pass across the affected surface; ruff 39; mypy clean.'
    - 'AND IT SURFACED THREE PRE-EXISTING REDS IN tests/memory/test_assembly.py, every one of them this programme''s own doing and none noticed until the file was run. test_build_wires_all_ten_components asserted .promoter, .pruner AND .detector — pruner went in pass 2 and detector in pass 3, so it had been failing since PASS 2. Rewritten to ask dataclasses.fields(components) rather than a hand-listed set: a hand-maintained field list is a second copy of the dataclass, which is exactly what went stale. The other two asserted build() SEEDS an every-30m dream_worker schedule; D08.1 unscheduled that handler and pass 1 stripped it to an empty seat, so seeding would now dispatch a no-op pass every thirty minutes. INVERTED to assert REGISTERED-but-UNSCHEDULED. Causation was established by restoring the pre-change file and re-running, not assumed — they fail identically without the pass-4 diff.'
    - 'THE TENANCY ALLOWLIST HAD SIX STALE ENTRIES SPANNING FOUR PASSES, and two had been stale since passes 2 and 3. test_allowlist_has_no_stale_entries caught every one — a guard that flags a CLOSED gap, not just a new one, and it earned its upkeep here. Worth recording how I nearly mis-read it: I ran its output through `head -6`, saw five entries, and started reasoning about a blind spot in the guard. There were six; I had truncated the last line. Third instance of the same mistake in this programme — A TRUNCATED GREP IS A WRONG ANSWER, NOT A PARTIAL ONE.'
    - 'AND THE SEAT''S PROMISE IS NOW HONEST ON A FRESH INSTALL. dream_worker.py''s docstring tells an N01 implementer that the scheduler wiring, the job row and the name are already in place. On the live database that is true (migration 0113 left the row at enabled=0); on a fresh build no row is seeded at all, which the inverted test now states explicitly rather than leaving as a surprise. seed_dream_worker_schedule deliberately survives with NO production caller — it is how N01 schedules itself once it has phases — and keeps its own coverage in tests/scheduler/test_dream_worker_seed.py, so it is a documented seat rather than rot.'
    - 'PASS 4 IS NOW STAGED, NOT SCOPED — 2026-08-14. The surface went 19 test files to 15 by repointing survivors while fact_promoter still EXISTS, so the tree stayed green at every commit instead of one atomic 19-file change. Out of the surface entirely: test_memory_command_registration (a red this programme caused in seam 3 part 1 and missed), test_memory_governance_journey (repointed onto the live tool path per ESC-6), test_trust_stamping (2 remember_fact cases dropped, invariant re-verified as covered three other ways FIRST), test_persona_evolution_journey (2 promoter cases dropped, exactly as a scratch-copy run predicted).'
    - 'AND THE SOURCE SIDE IS SMALLER THAN THE RECORD ASSUMED, measured: MemoryComponents.promoter has ZERO consumers outside memory/assembly.py — constructed, stored in a dataclass field, never read. Same assigned-and-never-read shape found in seam 3 part 1 with MemoryCommand. So pass 4 source work is: delete fact_promoter.py (366 lines), drop remember_fact from commands/memory_helpers.py (NO production caller, verified by a COMPLETE search after a truncated one caused the earlier revert), and remove one field plus two imports and a construction from assembly.py.'
    - 'PASS 4 WAS ALSO NEVER BLOCKED BY ESC-5, which the record got wrong. The claim was that ESC-5 blocks the dream_worker_helpers half; measured, dream_worker_helpers imports only pack_embedding from sqlite_helpers and does NOT import fact_promoter at all. ESC-5 blocks removing HELPERS ENTIRELY, which the promoter removal does not require. So pass 4 could start immediately, and ESC-5''s implementation belongs with the LanceDB arc where its new target store lands.'
    - 'WHAT REMAINS OF PASS 4, triaged file by file so the next pass executes rather than re-derives. DELETE WHOLE (pure promotion pipeline): test_plan_b_promotion (5 tests), test_force_promote_semantic (2), test_promoter_embed (2), test_authored_once_promotion (5), test_promotion_cap (4). SURGERY, because each is MIXED and the non-promoter half covers LIVE code — this is the part a bulk delete would get wrong: test_fts_base_atomic (the promote-atomicity half travels, the DELETE-atomicity half guards bridge.delete(), which is live), test_scope_key (the filter_by_scope post-filter is live — recall calls it), test_recall_fts_fallback + test_recall_model_mismatch_journey (recall()''s fallback ladder is live and the memory TOOL calls it, so repoint the fixture to a direct INSERT rather than delete the guard), test_evolution_promotion_off_turn_path (the evolution half is live), test_no_owner_scope_bypass (2 entries in a static (file, table) audit list, which must go WITH the file, not before it). PROSE ONLY, no code dependency: test_no_orphan_agent_self_stage, the e4_s1 smoke, and tools/knowledge/test_memory''s docstring — each mentions the promoter in a comment that will be stale once it goes.'
    - 'ESC-6 IMPLEMENTED 2026-08-14 — the fence RELOCATED, not kept and not dropped. The rendering rule now lives in memory/trust.py as render_at_trust(), the module that already declares itself the single source of truth for trust tiers, and every path that shows stored content to a model asks it: the memory tool''s _get, _format_hits and _forget — which rendered RAW before — and sqlite_bridge.retrieve(), which was refactored to call it rather than keep a second copy. Two invariants are carried over verbatim from the original because they are what make a fence a boundary: EVERY tier is neutralized regardless of trust (so a mis-tagged item still cannot break out), and the fence attributes come from arguments, never from content. trust=None fails safe to fenced, matching trust_for_source''s SAFE_DEFAULT. 11 new tests; the existing governance journey passes UNCHANGED, which is the evidence the refactor preserved the original behaviour exactly rather than merely producing something that also passes.'
    - 'AND THE MOTIVATING HOLE WAS LIVE, not hypothetical: memory(action="get") rendered resolved.content raw at memory.py:439 and list_staged filters on status ONLY, never source_type, so the 10 webpage rows in staged_facts were reachable unfenced through an id-prefix lookup. Narrow, but it is exactly the stored-injection threat the fence was written for — and it sat on the live path while the protection sat on the dead one.'
    - 'THREE MORE PRE-EXISTING REDS FIXED IN tests/journeys/test_j2_research_and_remember.py, all the same D08.1 drift as the test_memory_fix_guards four: durability now required, "Remembered" now "Saved.", and persistence moved from committed_facts to curated memory. The interesting one is the RECALL TURN. The journey asserted classify folded the finding into turn-2 system_text; curated memory enters the prompt from a per-incarnation FROZEN snapshot, so within one conversation it deliberately does not. Rather than invert that and lose the journey, the scripted owl now RECALLS VIA THE MEMORY TOOL — which is what assemble.py says replaced per-turn prompt recall ("the registered memory tool is how the model reaches for it"). The headline guard is untouched and still passes: ZERO new web-backend calls on the recall turn. So the business outcome — research once, recall later without re-searching — is proven on the path production actually takes, instead of on one D08.1 retired.'
    - 'AND I INTRODUCED A CROSS-TEST COUPLING AND CAUGHT IT BY RUNNING THE BATCH, not the file. Both repaired journeys assert the write is not stranded by taking a snapshot under a fresh session_id — and I used the SAME literal in both. shared_memory() is a PROCESS singleton whose snapshot cache is keyed on session_id, so whichever test ran second was served the first''s cached snapshot from a different temp home. Each passed alone and they failed together. Fixed by constructing a FRESH CuratedMemory() in each rather than the singleton, which is also the more honest reader. A green file is not a green suite.'
    - 'R1Q1 - THE AGENT WRITES USER.md, in-turn, via a tool. D01.1 shipped the READER without a writer: load_user_profile() runs on every prompt build, ~/.stackowl/USER.md does not exist, and nothing in src/ writes it. The prompt has carried zero curated memory since D01.1 landed.'
    - 'R1Q2 - ADOPT BOTH FILES, separately gated: USER.md (who the user is) and MEMORY.md (the agent''s own notes). They rot at different rates and must not evict each other.'
    - 'R1Q3 - HARD CHAR BUDGET, and the AGENT consolidates. Hermes'' model: when full, add REFUSES and tells the model to merge or remove and retry in the same turn, bounded so it cannot loop. Forgetting becomes the agent''s in-turn problem against a visible limit.'
    - R1Q4 - keep the pipeline, measure recall first. SUPERSEDED by R5Q18 once the content was actually measured.
    - R2Q5 - SAME TOOL, add a target argument. We already ship `memory` with add/search/get/forget; a second memory tool is the fork X4 forbids.
    - R2Q6 - the prompt snapshot is bound to session_id (the conversation incarnation), refreshed by /new.
    - 'R2Q7 - ADOPT HERMES'' NUMBERS AS-IS: 2200 chars for MEMORY.md, 1375 for USER.md. Same precedent as D10.2''s 60-char description cap.'
    - R2Q8 - USER.md is GLOBAL, MEMORY.md is PER-OWL. The user is the same person to every owl; what an owl learned doing its job is its own. Session lanes are already per-owl (owl:secretary:telegram:dm:...), so this matches the existing shape.
    - 'R3Q9 - ACCEPT THE STALENESS. Measured and put back to Bakir: the main Telegram lane has had 2 incarnations in its entire life, so a fact written today may not reach the prompt for weeks. Accepted anyway; /new is the refresh and the write confirmation must say so.'
    - R3Q10 - search spans both files and store; forget requires an explicit target. Retrieval is one question; deletion must say where.
    - 'R3Q11 - SCAN ON WRITE, reusing the skill security scanner. Built in this item, not deferred to D08.4: this item CREATES the agent-writable prompt-injection surface, so shipping it unscanned would be filing a ticket about a hole we just made.'
    - 'R3Q12 - Bakir rejected the premise that the 88k facts are a good bootstrap source: ''i do not think 86431 facts is good. i think it is also duplicate and trash there''. MEASURED AND CONFIRMED - see findings.'
    - 'R4Q13 - the extractor is badly designed. Bakir''s sense of the right rate: ''maybe 2-3 fact per day'', against a measured 14,400/day.'
    - R4Q14 - STRUCTURAL DURABILITY, not a prose rule. Every entry states permanent / until_changed / transient, and transient is not an accepted value, so a stale date has nowhere to go.
    - R4Q15 - USER.md STARTS EMPTY. Distilling from the existing store would import the noise this item exists to escape.
    - R4Q16 - WIDEN D08.1. The curated layer only earns its place if what it replaces stops growing, so the extractor is part of this item, not a follow-up.
    - 'R5Q17 - ROOT CAUSE, AS FIRST STATED AND SINCE CORRECTED. I wrote that fact_extractor.extract() takes session_key and never consults it, so every incident-recovery conversation was mined as if a human had said it. WRONG about the mechanism, right about the effect. A lane filter DID exist (DEBT-35, landed 2026-08-04, using the same is_machine_lane the brief uses). The true shape, found on 2026-08-09 while deleting the tests that recorded it: `mine_all` filtered machine lanes; `mine_session` did NOT; and the conversation-boundary handler called mine_session on every rolled lane. So machine lanes kept being mined through the other door - incident-prefixed facts were still staged on 2026-08-09, five days after the filter shipped. A guard on one path and not its sibling: the same half-wired shape as the archived-skill FTS leg. Also checked and settled: `retry-` does NOT belong in MACHINE_LANE_PREFIXES - it appears only as a staged_facts source_ref, never as a session_key (0 of 11,734 outcomes), so the brief''s interactive-vs-machine lane split is sound.'
    - 'R5Q18 - *** RETIRE THE EXTRACTOR ENTIRELY. *** There is no extraction pipeline in Hermes: the agent notices something worth keeping and writes it. Supersedes R1Q4.'
    - 'R5Q19 - PURGE ALL 88,631+ FACTS. Bakir: ''delete it''. A routine pre-change DB backup is taken, as before every migration; no separate JSONL archive was wanted.'
    - R5Q20 - durability is REQUIRED and RECORDED IN THE ENTRY, so consolidation can evict until_changed before permanent rather than evicting by age.
    - R6Q21 - RETIRE OUTRIGHT, SKIP THE INTERIM LANE FILTER. A filter on code being deleted is wasted work. Asked because R5Q17 and R5Q18 contradicted each other.
    - R6Q22 - 'delete it'. No soft-delete, no cooling-off period.
    - 'R6Q23 - REMOVE THE WRITE PATH, KEEP SEARCH. Extraction, promotion, reinforcement, contradiction detection and trust scoring go; the store and its hybrid recall stay so `memory` can still look things up. NOTE: retrieval was never the weak link - all 89,031 facts carry real embeddings in SQLite AND a 229MB LanceDB mirror, plus FTS5. Semantic search over a corpus that is 37% telemetry returns telemetry; better vectors cannot fix a bad corpus.'
    - R6Q24 - PULL D08.3 (memory-write nudges) INTO THIS ITEM. With extraction retired the nudge is the ONLY thing prompting a write, so shipping without it means 0/day rather than a handful. Same call as pulling D10.2 forward for D09.3.
    - 'R7Q25 - ACCEPTANCE, corrected by Bakir: ''my numbers was n ot a rule it was a guess. agent may write more or less but definelt not a 1400k perday''. Acceptance must NOT hardcode a rate. It is: both files exist with agent-written content, the assembled prompt demonstrably carries them, and the write rate is bounded by the BUDGET rather than by a number - with the order-of-magnitude collapse from 14,400/day as the evidence the old path is gone.'
    - 'R7Q27 - RE-EXAMINED MID-BRAINSTORM at Bakir''s challenge (''why are we not using semantic store for memories in sqlite?'' / ''but now we are talking about user.md and owl.md''). A fourth design was surfaced that rounds 1-7 had not offered: keep ONE storage engine by marking ~30 facts curated in SQLite, giving that subset the budget, and injecting it - which would preserve semantic search over the curated set too. REJECTED in favour of flat files. The deciding argument is this item''s own gap statement: legible and EDITABLE BY THE USER IN A TEXT EDITOR. Recorded so it is not re-litigated: the store is look-up (model must know to ask, costs a tool call, results vary per query and so cannot live in a cache-stable prompt); the file is always-known.'
    - 'R7Q26 - PLACEMENT (voted, per the standing rule): ~/.stackowl/memory/USER.md and ~/.stackowl/memory/<owl>.md. One directory to look in and to back up; costs changing user_profile.py''s default path, which nothing currently satisfies anyway.'
    - 'R8Q28 - USER-FACING SURFACES GO TOO. Retiring the write path removes /staged entirely (list/review/approve/reject) and the channel approve-reject buttons (telegram 185 lines, slack 145, discord 114). Asked explicitly because the never-disable-a-feature rule applies: ''delete it'' had been about the 88k facts, not about commands Bakir uses. Answer: all of it - nothing stages any more, so nothing reviews.'
    - R8Q29 - /memory remember RETARGETS TO USER.md, under the SAME budget as the agent, so it can refuse the user too. One curated surface, one budget, one thing to read.
    - 'R9Q30 - *** SEARCH MEANS THE CURATED FILES ONLY; THE TRI-STORE GOES. *** Surfaced as a contradiction before executing: with extraction retired (R5Q18), the facts purged (R5Q19) and /memory remember writing to USER.md (R8Q29), NOTHING would ever write committed_facts again - so ''keep search'' (R6Q23) meant keeping MemoryBridge, a LanceDB mirror, FTS5, recall_ranker and the re-embed phase reading a permanently empty table. That is the dead code this work exists to remove. memory(action=''search'') stays and searches USER.md + <owl>.md, which slice 2 already implemented. Cost accepted: no semantic search over memory - a few dozen short lines match fine on substring.'
    findings:
    - MEASURED 2026-08-08 on the live database. This reframed the item from 'add a curated layer' to 'the write path is broken'.
    - 88,631 committed facts, 9.75M chars. Hermes' entire memory budget is 3,575 chars - we are 2,700x larger.
    - '37.1% (32,880) mention a trace id or failure_class: internal telemetry stored as durable user memory. 21.0% are about the platform''s own subsystems. 49.1% never reinforced.'
    - 'The MOST-REINFORCED fact in the whole store is "Today''s date is 2026-07-15" at x157 - three weeks stale, with at least six variants. reinforcement_count measures how often a topic came up, not importance: the rest of the top 12 is news headlines at 115-130 each, including the same story stored twice under two phrasings.'
    - 'Rate exploded on 2026-08-05 from ~300-600/day to 9,000-14,400/day, exactly tracking ADR-19''s autonomous loops shipping. Cause: no lane filter in the extractor.'
    - scope_key is NULL on all rows - a column nothing populates.
    - 'memory_facts, pellets and fact_rejections tables are all EMPTY: the contradiction detector has never rejected anything, and trust has one real value (86,329 ''self'' vs 102 ''untrusted'').'
    - entity_extractor logged 1,398 'no provider available' failures in a single day, degrading silently.
    - 1,319 facts were embedded with hash-v1-384d, the degraded hash FALLBACK rather than a real model - they are not semantically searchable in any meaningful sense.
    - 'SLICE 5 INVENTORY, measured 2026-08-09, NOT YET EXECUTED. Attempted and reverted to green in the same session once the true scope was known: deleting the fact subsystem produced 140 mypy errors across 45 files against a baseline of 78 across 15 - it reaches the TUI, parliament, channels, orchestrator, scheduler and CLI. That is a focused refactor, not a tail-end-of-session job, and leaving 45 files broken would have been worse than not starting. The inventory below is the value that came out of the attempt.'
    - 'DELETE, memory/ (4,430 lines): fact_extractor 306, fact_promoter 366, fact_reinforcer 169, contradiction_detector 256, conversation_miner 413, entity_extractor 201, recall_ranker 119, trust 25, pruner 129, sqlite_bridge 556, bridge 177, dream_worker 611, dream_worker_helpers 722, kuzu_sync_handler 380, lancedb_helpers 334, models 76. Plus scheduler/handlers/dream_worker.py (162).'
