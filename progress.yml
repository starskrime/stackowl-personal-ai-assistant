  - id: D09.3
    title: "Skill curator"
    domain: D09
    verdict: MISSING
    track: adopt
    priority: P1
    wave: 4
    order: 29
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d093"
    gap: "Skills accumulate and rot with no pressure to consolidate."
    depends_on: [D10.2]
    blocks: []
    dedup_target: X11
    stages:
      brainstorm: done             # 25 questions, 7 rounds, 2026-08-07 (retroactive)
      architect:  done             # designs/D09.3.md — covers D09.3 + D10.2
      # DOWNGRADED from done, deliberately. The curator itself shipped and was
      # validated; the X11 resolution plus the D10.2 standard it depends on is a
      # SECOND pass over the same item, delivered in seven slices. Slices 1-3 are
      # green and live. Leaving these at done would make progress.yml claim
      # coverage the catalog does not have.
      implement:  done             # all 7 slices shipped
      cleanup:    done             # ruff 39 / mypy 78 baselines held exactly
      test:       done             # +13 curator, +17 consolidation, +13 migration,
                                   # +6 brief, +4 manifest, +8 standard regressions
      validate:   done             # catalog 437->168 live; migration complete
                                   # 154/154; conformance numbered:0/166
      document:   partial          # docs/adr-19-closed-loop-autonomy.md, not the item doc
    doc: docs/reference-mapping/designs/D09.3.md
    doc_last_verified: null
    decisions:
      - "R1Q1 — PULL D10.2 (Authoring standard) FORWARD INTO WAVE 4. The dependency binds: consolidation rewrites skill bodies, and without a standard the agent writes inconsistent ones — plausibly the root cause of the 265 duplicates. Decay shipped without it because decay never reads or writes content; consolidation will not."
      - "R1Q2 — the existing 265 numbered duplicates are left to DECAY. Unused by construction (only one of 21 can rank first), so stale->archive reaches them with no LLM, no new code, no risk. Cost accepted: they pollute ranking until archival."
      - "R1Q3 — PRUNE BUILT-INS TOO. Reverses the exclusion that shipped. 9 of 14 builtins have never run and still occupy tool-search ranking and prompt space; archival is recoverable, so being wrong costs one un-archive. This is the explicit consent the never-disable-a-feature-without-asking rule requires."
      - "R1Q4 — stale stays 30 days; ARCHIVE SHORTENS 90 -> 60. Same reversible warning period, consequential step sooner, given 92% of the catalog is dead weight."
      - "R2Q5 — the authoring standard (D10.2) constrains NAMING + FRONTMATTER *and* BODY TEMPLATE (Steps / Verification / When not to use). Enforced at write in gated_skill_write, so a non-conforming skill cannot be authored at all rather than being detected afterwards. The template also gives consolidation a predictable shape to merge section-wise."
      - "R2Q6 — built-ins decay on the SAME 30/60 windows as learned skills, with pinning as the protection. Not a slower clock: 9 of 14 have never run, and archival is recoverable so being wrong costs one un-archive."
      - "R2Q7 — revival-on-use is sufficient; nothing further to build. Executing or pinning an archived skill returns it to active, and archived skills stay searchable so the agent can still rediscover one."
      - "R2Q8 — CONSOLIDATION IS BUILT, after D10.2, opt-in and off by default (Hermes' shape). Not run against the existing 265 immediately — decay reaches those anyway, and the first consolidation run should be a deliberate act, not a migration side effect."
      - "R3Q9 — a write that violates the standard is REJECTED with the violated rule named, and the agent retries. Not auto-fixed: the platform silently editing the agent's work hides the drift instead of correcting it, and the agent already handles a structured tool failure by retrying."
      - "R3Q10 — VERBATIM: 'Lets remove dublicates and migrate rest'. CONTRADICTS R1Q2 (which chose to let decay handle the 265). Raised back in R4 rather than silently resolved; PROCESS.md requires contradiction-hunting. Also needs 'remove' pinned to archive-vs-delete, since never-delete is a standing invariant."
      - "R3Q11 — ADOPT PACKAGE-OR-NOTHING. Consolidation keeps a skill standalone, re-homes its support files and rewrites the paths, or archives the package whole. It never merges a SKILL.md away from files it references, which would leave a broken relative link and a silently dead skill."
      - "R3Q12 — the curator must show the catalog SHRINKING while the ever-used RATIO RISES. Tracked together on purpose: shrinking with a flat ratio means the wrong skills were archived, and would otherwise read as success."
      - "R4Q13 — CONTRADICTION RESOLVED: R3 supersedes R1. The 265 duplicates are dealt with NOW rather than aged out over 30/60 days. Accepted cost: the observation window that would have shown whether the thresholds are right is skipped for this population."
      - "R4Q14 — *** OVERRIDES A STANDING INVARIANT ***. Bakir chose DELETED FROM DISK over archived-recoverable, with the option stating plainly that it is not recoverable and breaks the never-delete rule held everywhere else (ADR-19 I3, Hermes' curator, migration 0107's design). This is his informed call and it stands. Mitigation that does NOT reverse it: a full backup is taken before the delete, and the operation is dry-run-first and explicitly invoked — never automatic at startup. skill_audit retains the record that each skill existed, not its content."
      - "R4Q15 — migration is the FULL TEMPLATE: bodies are restructured into Steps / Verification / When not to use, not just names and frontmatter. ~142 LLM calls. Requires D10.2 to exist first, since the template IS the standard."
      - "R4Q16 — order is: remove duplicates -> migrate survivors to the standard -> consolidate. Consolidation compares skills, and comparing them after they share a naming and frontmatter convention makes near-duplicates far easier to detect correctly."
      - "R5Q17 — in a duplicate family the MOST-USED member survives and is RENAMED to the base name. Usage is the evidence of which body actually worked; keeping the base's body by convention can discard the only version that ever ran."
      - "R5Q18 — no exemption for the 3 numbered duplicates that have been used. The survivor rule already saves them: a used member wins its family and becomes the base, so no special case is needed."
      - "R5Q19 — the delete removes the directory AND the skills row in one operation. Leaving rows behind would let recall and tool_search surface a skill whose body no longer exists."
      - "R5Q20 — invoked as a CLI command, DRY-RUN BY DEFAULT, with --apply to perform it and a backup taken automatically first. Never part of the curator's unattended pass: an irreversible bulk delete must be a deliberate act with a human in the loop."
      - "R6Q21 — ACCEPTED that the -N rule misses the worst cases. Measured: the five most-used learned skills are semantic near-duplicates with DISTINCT names (structure-incident-evidence 45, -brief 43, structure-evidence-brief 23, evidence-brief-structuring 13, dual-memory-evidence-gathering 11 — 135 executions between them) and none is a numbered variant. The -N pass is the cheap deterministic half; semantic families need meaning-comparison, which is the opt-in consolidation scheduled after D10.2."
      - "R6Q22 — the survivor INHERITS THE SUMMED n_executions of its family. The family is one lesson learned repeatedly; without summing, the merged skill looks less proven than it is and decay may target it next."
      - "R6Q23 — before deleting, every affected skill is copied to a timestamped archive OUTSIDE the catalog (~/.stackowl/backups/skills-<ts>/). Honours 'deleted from the catalog' while keeping a mistake recoverable by hand."
      - "R6Q24 — D10.2 FORBIDS the -N suffix outright; a colliding write is rejected and the writer must reinforce the existing skill or choose a genuinely different name. The suffix only ever existed because the synthesizer needed a free directory."
      - "R7Q25 — ONE RETIREMENT MECHANISM, TWO TRIGGERS. A duplication the map never flagged (D09.3 carries no dedup_target): the synthesizer already retires on QUALITY (success_rate < 0.4 with >=5 runs -> learned/_deprecated/) and has retired ZERO skills in the platform's lifetime, while the catalog rotted to 92% dead. The curator becomes the single retirement path and gains the quality trigger — retire when unused OR when demonstrably failing — so there is one lifecycle_state, one place to look, and one set of safety rules (pinning, never-auto-delete-unattended, revival-on-use)."
    changes:
      - "slice 1 (2026-08-08) — skills/standard.py: the standard as ONE machine-readable source, prompt text generated from the constants."
      - "slice 2 (2026-08-08) — taught in the authoring prompt, then enforced in gated_skill_write BEFORE the security scan and consent, so a malformed skill never reaches a human for approval."
      - "slice 3 (2026-08-08) — X11 RESOLVED. SkillCurator is the single retirement path and carries both triggers (unused OR failing). synthesizer.deprecate_low_performers + _deprecate_one + the run_all phase removed. The AD-7 owl-drive advisory relocated intact to owls.skill_ownership.owl_drive_thresholds and is injected as a per-pass PROVIDER, not a captured map — evolution mutates completion_drive while the curator lives on. ARCHIVE_AFTER_DAYS 90->60. Built-ins now decay (R1Q3/R2Q6); pinning replaces the blanket exemption. 7 tests migrated to tests/skills/test_curator_quality_trigger.py."
      - "slice 3 found TWO defects the brainstorm did not predict. (a) The removed path called store.delete(), so a skill retired for FAILING was unrecoverable while one retired for DISUSE was fully reversible — ADR-19 I3 violated outright, and the strongest argument for one mechanism that the brainstorm never reached. (b) _fts_search, the BM25 leg of hybrid recall, carried no not-archived predicate, so archival applied to two of three read paths and archived skills went on competing for ranking; with 297 already marked stale on the live catalog this was costing real prompt space silently. Both fixed; (b) pinned by a test proven to fail without the fix."
      - "slice 4 (2026-08-08) — SkillConsolidator + /skill dedupe. Dry-run by default; a timestamped archive OUTSIDE the catalog is taken before any delete, and a member that could not be archived is not deleted. Most-used member survives under the base name and inherits the family's SUMMED executions (without which the curator would archive the survivor for looking unused days after the merge). Pinned wins outright; two pinned members make the family untouchable and the refusal is reported. Third copy of the -N regex removed — standard.base_name() is now the one copy."
      - "slice 4 APPLIED TO THE LIVE CATALOG (2026-08-08 17:29 UTC). DB backed up to ~/.stackowl/backups/pre-dedupe-20260808-172829.db first. 43 families, 269 rows removed, 0 skipped. Catalog 437 -> 168 (builtin 14, learned 154); zero -N names remain in the DB or on disk; all 168 surviving rows have their SKILL.md present; 269 directories recoverable from ~/.stackowl/consolidated/20260808-172931. Restarted: 0 errors, loader reports 168. This reverses R1Q2 (leave them to decay) per the operator's later R3 answer."
      - "OUT OF SCOPE and stated rather than implied: semantic near-duplicates with DIFFERENT base names (structure-incident-evidence vs structure-evidence-brief vs evidence-brief-structuring) survive consolidation untouched. Collapsing those is a content decision and belongs to the LLM migration pass, not to a regex."
      - "slice 5 (2026-08-08) — summary dropped: 3 columns + the FTS entry (migration 0110), store.set_summary, SkillsAssembly._summarize_missing, SkillManifest.summary. Measured first: 169/170 skills had a generated summary averaging 324 chars vs 301 for description+when_to_use, so what went is a per-skill LLM call at boot, not information. NEAR-MISS: SkillManifest is extra=forbid and 142 of 169 SKILL.md files still carry summary: — the naive removal would have failed 84% of the catalog to load. Fixed with a _RETIRED_KEYS seam that drops the key on read while a typo is still a named error. Applied live after backup; 168 skills load, 0 errors."
      - "slice 6 (2026-08-08) — conformance line in the autonomic_health brief: skill_standard v1 numbered:N/T over_60_chars:N/T. The name rule is applied via standard.validate_name, not a SQL GLOB, because a GLOB cannot express 'one or more digits' and would miss foo-123."
      - "slice 6 CAUGHT A REAL DEFECT on its first live run: numbered:2/170, hours after consolidation removed every numbered name. Root cause in slice 4 — a skill name lives in THREE places (index row, directory, SKILL.md frontmatter) and _rename_survivor rewrote two. The next boot re-scanned, read the stale -N name from the frontmatter, and upserted a SECOND row for the same directory; consolidation partially undid itself overnight on the 2 of 43 families that needed a rename. Fixed at the root, 2 regression tests, live catalog repaired, verified across a reboot: 168 rows, zero numbered names."
      - "slice 7 (2026-08-08) — SkillStandardMigrator + /skill migrate + migration 0111 (standard_version). LLM rewrite per skill, dry-run by default, bounded batches, most-used first, original archived before the rewrite, and the rewrite VALIDATED through gated_skill_write so a non-conforming result is refused and the original survives untouched. standard_version is written only on success, so a re-run retries failures instead of skipping them."
      - "slice 7 first live batch found TWO defects, both mine: (a) the dry-run report printed \"failed 5\" for skills nothing had been attempted on — MigrationOutcome is now tri-state via planned; (b) the migrator passed plain dicts where the provider expects Message objects (it reads message.documents), so all three skills failed inside the provider. Every test had passed because _ScriptedProvider accepted anything — test-double drift, SEVENTH instance in this codebase. The double now asserts the contract."
      - "slice 7 verified live: descriptions 94->56, 113->50, 116->55 chars, seven sections present, version bumped 0.1.0->0.1.1, index-owned fields stripped from files, usage history preserved exactly (45/43/23 executions)."
      - "progress.yml itself had 7 items carrying a DUPLICATE empty `changes:` key. YAML keeps the LAST occurrence, so a write to the earlier copy is discarded with no error, no warning and no sign anything was dropped — which is exactly what happened to D10.2's slice records before it was noticed. All 14 were empty so nothing had been lost yet. Collapsed, and scripts/progress_lint.py now fails on duplicate keys and on unknown stage values so it cannot recur silently. Same shape as every other defect this programme keeps finding: the write happens, the effect does not, nothing says so."
      - "NOTE on ProviderRegistry: construct with ProviderRegistry.from_settings(settings). The bare constructor takes no settings and a standalone script that gets this wrong hangs rather than erroring — cost two 10-minute timeouts."
      - "CORRECTION + FIX (2026-08-09) to the scheduler finding below: the CAUSE I named was wrong. It was not the circuit breaker being ignored. next_run_at is advanced on COMPLETION or on terminal re-arm, never when a retry is scheduled, so a failed job still had next_run_at IN THE PAST and the due-select's `OR (retry_at ...)` matched on the very next 30s tick. _RETRY_DELAY_MIN = 5 was dead code. Measured: owl_lifecycle-Brain, a job that runs every TWO HOURS, failed at 16:00:19 / 16:00:49 / 16:01:19 and spent its entire retry budget in 90 seconds while the provider was down for 25 minutes. Fixed: a pending retry_at now DEFERS the job instead of adding a second trigger, so three retries span 15 minutes rather than 90 seconds. 6 tests + 349 green across tests/scheduler/."
      - "UNRELATED finding, investigated and NOT acted on: the brief reported jobs_24h ran:147 failed:93. All 93 were AllProvidersUnavailableError inside a ~25-minute window (15:38-16:01 UTC 2026-08-08) that has since resolved — the most recent run completed. Worth a separate look: jobs retried every 30s throughout the outage rather than backing off behind the breaker."
    notes: null

