  - id: DEBT-6
    scheduled: "2026-07-26 — Bakir chose to pick this up now, after D01.7 part 7b."
    found: 2026-07-25
    what: "Empty completions from NeraAiRaw — the model emits reasoning but no visible content."
    evidence: "Log, repeatedly: '[openai] complete: empty after think-strip — retrying once with a varied prompt' then 'still empty after varied retry — returning empty for the downstream floor'."
    impact: "Every occurrence costs a full paid call and yields nothing. Seen 3+ times in a 5-message conversation."
    decision: "Tracked. Needs its own root-cause pass — likely a reasoning model spending max_tokens on reasoning_content."
    status: resolved
    root_cause:
      date: 2026-07-26
      what: >
        ModelProvider.health_check() (providers/base.py) sent "ping" with
        max_tokens=1 and NO disable_thinking. The deployed model emits its
        chain-of-thought into a SEPARATE reasoning_content field and reaches an
        answer only after finishing, so content came back empty every single
        time. The 2026-07-25 hypothesis in this file was correct: a token-budget
        bug, not a provider fault.
      measured_against_the_live_gateway: >
        max_tokens 1 / 16 / 64 all returned finish_reason="length" with empty
        content and reasoning_content of 4 / 55 / 239 chars. 256 was the first
        budget that produced any content ('\n\nOK.'). With
        chat_template_kwargs={"enable_thinking": False} the SAME 1-token budget
        returned 'pong' with reasoning_len=0 — so the hint is honored by this
        gateway and was simply never passed on this path.
      the_misleading_narrative: >
        The log said "empty after think-strip", which reads as though
        strip_think() ate the answer. It did not — content arrived empty at the
        wire and strip_think was a no-op. That misdirection is part of why this
        survived; the message now says "empty content" and carries
        finish_reason, reasoning_len, max_tokens_sent and completion_tokens.
      why_the_retry_could_never_help: >
        The empty-retry backstop appended a wording nudge ("answer directly,
        without a reasoning preamble") but kept the SAME tiny budget with
        thinking still on, so it deterministically failed again. It was the
        second paid call of every occurrence and recovered none of them.
      scale: >
        193 events on 2026-07-26 against 221 health sweeps — essentially 1:1,
        two paid calls each (~386 calls/day returning nothing). session_key was
        NULL on all 193: ZERO user turns.
      the_original_framing_was_wrong_and_is_corrected_here: >
        DEBT-6 was written on 2026-07-25 as "seen 3+ times in a 5-message
        conversation", which read as though user turns were failing. They were
        not. On that same day the rotated log shows 262 health_sweep runs and
        261 empty-completion events — 1:1 — and session_key was NULL on ALL 261.
        The sweep fires every ~5.5 minutes, so any 5-message conversation window
        naturally contains about three of them. They were observed DURING the
        conversation, not produced BY it.
      therefore_this_fix_closes_it_entirely: >
        There is no second, user-facing surface left to chase. That matters
        because the hand-off notes flagged DEBT-6 as the highest real-money item
        open and implied a conversational failure mode that does not exist.
      caller_chain: "health_sweep -> HealthAggregator.collect() -> ProviderRegistry.health_check() (a contributor) -> each provider's health_check() -> complete(ping, max_tokens=1)."
      not_affected: >
        The classifiers are SAFE. interaction/classifier_base.py's
        safe_complete() defaults disable_thinking=True, so the three
        intent_classifier sites at max_tokens=4 already route the hint —
        verified live (max_tokens=4 + no-think returns 'NO'). health_check() was
        the ONE site calling complete() directly and bypassing that discipline.
    resolution:
      date: 2026-07-26
      decided_by: Bakir
      fix_1_root_cause: >
        health_check() now passes disable_thinking=True and _PROBE_MAX_TOKENS
        (16 — a technical floor for a one-word acknowledgement, same class as
        _MIN_OUTPUT_TOKENS, NOT a shaping cap; measured, because max_tokens=1
        still truncates even with reasoning off, making a truncated probe
        indistinguishable from a broken one).
      fix_2_architecture: >
        complete()'s empty branch now dispatches on the response SHAPE.
        Reasoning-starved (finish_reason=="length" AND a non-empty reasoning
        field AND empty content AND thinking not already off) retries with
        thinking DISABLED and the IDENTICAL prompt — addressing the cause rather
        than the wording, and keeping the prefix stable for Law 1. Genuinely
        empty (no reasoning field, not truncated) keeps the F-22 varied-prompt
        nudge unchanged. New _reasoning_text() helper walks reasoning_content /
        reasoning on the message and in the SDK's model_extra bag, so it names
        no vendor — same pattern as _cached_input_tokens.
      fix_3_honesty: >
        An empty completion is now `degraded` with reason "empty completion from
        the model", not `ok` (Bakir's call). Reaching the socket proves
        connectivity; a backend that generates nothing is not healthy, and
        reporting it green is how this stayed invisible for a day. The bare
        `except` that returned degraded WITHOUT logging now logs with exc_info,
        per the no-silent-catch rule.
      verified:
        tests: "9 new in tests/providers/test_health_check_probe.py + 3 extending tests/providers/test_complete_think_strip.py, all RED first. 457 passed across tests/providers + tests/health."
        lint_types: "ruff src/ 46 = DEBT-1 baseline; mypy src/ 78 = DEBT-8 baseline. ZERO added."
        live: >
          Restarted 2026-07-26 21:25 UTC on the fixed code — 0 ERROR/CRITICAL,
          provider NeraAiRaw ok on both processes. The 21:27:40 health_sweep is
          the same job that produced the burn, and its window now reads:
          'provider NeraAiRaw [openai]: ok (661ms)' -> '[cost] $0.000225
          (13in/2out tokens)' -> 'aggregator.collect: exit — ok=12 total=12'.
          ZERO empty-completion warnings, ONE paid call instead of two, and
          13in/2out matches the enable_thinking:False measurement exactly
          (prompt=13, completion=2, content 'pong'). Compare the 20:16:23 window
          before the fix: two warnings and '$0.000525 (34in/1out)'.
        cost_per_sweep: "$0.000525 -> $0.000225 at the fallback rate. Both figures are fallback-derived (DEBT-15), so treat the RATIO as the result, not the dollars."
        one_test_legitimately_broken: >
          test_provider_registry_health.py's _StubProvider returned content="",
          which the new rule correctly reads as degraded. Brought to Bakir
          rather than autonomously rewritten; he chose to fix the STUB and keep
          the assertion, since 'registry reports ok when no breakers are open'
          is still the test's subject and the empty string was incidental.
  - id: DEBT-15
    found: 2026-07-26
    what: >
      The live model is not in pricing.yaml, so EVERY cost figure on this
      deployment is a conservative fallback rate presented as a real price —
      including the D01.6 baseline that was captured and closed on it.
    evidence: >
      `grep -n neraai src/stackowl/providers/pricing/pricing.yaml` returns
      nothing. 1531 occurrences of '[pricing] estimate: UNKNOWN CLOUD MODEL —
      conservative fallback pricing applied' on 2026-07-26 alone. The cost line
      it produces reads like a measurement:
      '[cost] NeraAiRaw/neraai-v1-raw: $0.000525 (34in/1out tokens, 774.1ms)'.
    found_how: "Noticed in the log window while root-causing DEBT-6 — the fallback warning sits two lines above the cost line it produced."
    why_it_matters: >
      D01.6 exists to make prompt economics MEASURABLE, and wave 1's whole
      justification is cost per turn. A number derived from a placeholder rate
      but rendered as '$0.000525' is exactly the "confident lie" the doc standard
      forbids, and it is currently the number every D01 decision would be judged
      against.
    decision:
      date: 2026-07-26
      by: Bakir
      answer: >
        Make the FALLBACK honest rather than inventing prices. Leave pricing
        absent (the real per-token rates are not known here and must not be
        guessed) and stop the cost path from emitting a confident dollar figure
        derived from a placeholder rate — report it as unpriced/estimated so the
        numbers cannot look more precise than they are.
      explicitly_rejected: "Adding invented prices to pricing.yaml. The rates are not known and a made-up number is worse than a labelled unknown."
    scope_note: >
      NOT implemented in the DEBT-6 pass — Bakir scoped that pass to DEBT-6
      only. The change needs a `priced` (or `estimated`) signal threaded from
      PricingTable.estimate() through the cost path to wherever the figure is
      logged/stored/displayed, since estimate() returns a bare float today and
      every caller treats it as a real price. That is its own change with its
      own tests, not a rider.
    affects: "D01.6 (its captured baseline), DEBT-7 (the budget alert would report fallback-derived costs)."
    status: resolved
    resolution:
      date: 2026-07-27
      the_fourth_surface_found_while_implementing: >
        The scope note listed the log line, the stored rows and the DEBT-7
        report. A fourth was found by tracing consumers: turn_cost_usd feeds
        pipeline/budget/governor.py's BudgetBreach, so the SOFT per-turn pause
        can INTERRUPT the user and ask them to continue or stop — on placeholder
        dollars. That makes this a behavioural defect, not only a cosmetic one.
      how: >
        PricingLoader.is_priced(model, is_local=) answers whether the figure
        estimate() returned is a real price or a guess. The estimate itself is
        UNCHANGED — honesty is a label on the number, not a change to it, and a
        test pins that the conservative fallback still bills high so an unpriced
        paid model can never silently read $0 (F128).
      the_distinction_that_matters: >
        A LOCAL model absent from the table is priced TRUE: self-hosted really is
        free, so $0 is a real answer. Only the unknown-CLOUD path is a guess.
        Marking local calls "estimated" would cry wolf on every one of them and
        train everybody to ignore the marker.
      migration_0101: >
        cost_records.priced INTEGER, NULLABLE. NULL for pre-existing rows because
        their provenance is genuinely unknown — backfilling 1 would claim history
        was priced (false on this deployment) and 0 would claim it was estimated
        (false for any real model). Either invents a fact, which is the exact
        mistake this debt is about. Persisted rather than logged only because
        these rows are AGGREGATED: D01.6's metric 3 sums them, and a SUM over
        mixed real and guessed dollars cannot be made honest afterwards.
      surfaces_now_honest:
        log_line: "'~$0.039840 (... , est)' for a fallback figure; a priced call is byte-identical to before."
        stored_rows: "priced=0/1 per row; NULL only for history."
        conversation_report: >
          Says "approximately $X ... (This model has no published price, so the
          figure is a conservative estimate.)" and carries estimated=true in the
          payload. The hedge is EARNED — a fully priced conversation states its
          cost plainly, pinned by its own test, so the caveat never becomes
          noise.
      not_done_deliberately: >
        No prices were invented for neraai-v1-raw. Bakir's instruction was that
        the real per-token rates are not known here and must not be guessed, so
        the platform now says so instead of pretending.
      verified:
        tests: "9 new in tests/providers/test_pricing_honesty.py, red first. 466 passed across tests/providers."
        migration: "0101 applied; second run reports already-applied; schema at 0101."
        gates: "ruff src/ 46 = DEBT-1 baseline; mypy src/ 78 = DEBT-8 baseline. Zero added."
        commands: "349 passed in tests/commands; the single failure is DEBT-3, pre-existing."
  - id: DEBT-14
    found: 2026-07-26
    what: "tests/scheduler/test_scheduler_assembly.py HANGS — 25 tests collect in 0.10s, then execution never completes."
    evidence: >
      `timeout 300 uv run pytest tests/scheduler/test_scheduler_assembly.py -q
