  - id: D08.2
    title: "Memory providers as plugins"
    domain: D08
    verdict: MISSING
    track: adopt
    priority: P1
    wave: 4
    order: 23
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d082"
    gap: "(no gap line — see Ask)"
    depends_on: [D08.1]
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done             # 12 decision-changing questions, 3 rounds, 2026-08-11
      architect:  done             # designs/D08.2.md — ladder rung named (1 for the split,
                                   # 4 for providers, explicitly NOT 6), every file listed
                                   # per slice, Laws 1 and 2 stated with their mechanism,
                                   # I1-I7 numbered. ESC-1 blocks slice B only.
      implement:  not_started
      cleanup:    not_started
      test:       not_started
      validate:   not_started
      document:   not_started
    doc: docs/reference-mapping/designs/D08.2.md
    doc_last_verified: "2026-08-11, commit 8673301a — status: design, deliberately NOT closed"
    decisions:
    - 'SURVIVOR PRE-CHECK FOR PASS 4, test_persona_evolution_journey.py (2026-08-14): it needs NO repointing at all, MEASURED rather than assumed. The record flagged it as one of three files carrying live-capability assertions among the promoter tests, so the question was how much surgery it needs. Answer: none. Its 4 tests split cleanly — test_cross_session_fact_recall and test_negative_control_no_registry_means_no_vector are FactPromoter tests that travel with the leaf; test_dna_evolves_live_and_survives_restart and test_slow_poison_floor_holds_over_many_batches use only DNA machinery (_manifest, _seed_messages, _persisted_dna, _run_batch, DNAPromptInjector, OwlRegistry) and touch no fact at all. Proved by running pass 4''s ACTUAL cut against a scratch copy — delete both promoter tests and the FactPromoter import — which gave 2 passed. Residue is exactly two now-unused imports, StagedFact and SqliteMemoryBridge. Also checked the thing ruff cannot see, an orphaned fixture: both survive with consumers (db has 27 refs, _no_test_mode_guard is autouse). The file is green today (4 passed), so nothing is owed before pass 4 — just a two-test deletion and two import lines. The scratch copy was deleted; the repo file is untouched, because those two tests still cover a module that still exists and removing them early would drop live coverage.'
    - 'AND THE INVERSION GOT A SECOND HALF, because on its own it would have been satisfied by the worst outcome. Asserting only that the write does not reach THIS prompt passes just as well if the write reaches NO prompt ever — the write-with-no-reader shape, failure mode 1. So guard B now also takes a snapshot under a fresh session_id and asserts the fact IS there: frozen for this conversation, present for the next, which is the whole contract D08.1 made the tool promise when it says "next /new".'
    - 'TWO OF THOSE GUARDS WERE INVERTED, NOT REPOINTED, because D08.1 deliberately reversed the behaviour they asserted — and an assertion left pointing the old way would now pass only if a bug existed. (i) The actions guard asserted "What You Did Recently" reached the prompt; classify.py:724 states the query-scoped half deliberately does not, so it now asserts absence. (ii) Guard B asserted a fact written in turn 1 reached turn 2''s system_text. curated.py:290 keys the prompt snapshot on session_id, so turn 2 re-reads the snapshot taken BEFORE the write — that is Law 1, nothing mutates past context mid-conversation, because doing so voids the prompt cache for every turn already in the window. It now asserts the region is ABSENT from turn-2 system_text. MEASURED, not assumed: the caching was read at curated.py:282-305 before inverting.'
    - 'R1Q1 SCOPE — providers AND the split in ONE item (Bakir chose this over my recommendation to defer providers). Blast radius then confirmed separately in R2Q3: one item, but STRICTLY SEQUENCED SLICES with a commit each, keeping D08.1''s proven method — seam-by-seam touched 5 files where the bulk module-list attempt produced 140 errors across 45.'
    - 'R1Q2 EMPTY RECALL — repoint. MEASURED FIRST: recall() has three live readers over a permanently empty committed_facts — tools/knowledge/memory.py:365 (the memory tool''s search), tools/browser/tools.py:1057 and brief/assemblers.py:158. A reader with no writer, which is failure mode 1 inverted. The memory tool''s search is REPOINTED at the curated files; the brief and browser call sites are removed because they read a source that returns nothing.'
    - 'R1Q3 CALLBACKS — DELETE all three (telegram 185 / slack 145 / discord 114 lines). They approve or reject STAGED FACTS awaiting promotion, and that queue is permanently empty now extraction is retired. A button that can only report ''nothing here'' is worse than no button. This is what frees fact_promoter, whose only remaining live consumers they are.'
    - 'R1Q4 + R2Q1 THE CAP, and the contradiction that had to be put back. Bakir first chose SEVERAL providers with a capped total rather than the reference platform''s one-active rule. Surfaced rather than reconciled: a cap must drop something when it binds, and Law 1 forbids the toolset changing mid-conversation. RESOLVED — several providers are allowed, but the active set and its schemas are resolved ONCE at session start and FROZEN for the incarnation; surplus providers are REFUSED at activation and logged at INFO. Never a silent drop, which would be the exact degradation the guide-star rule bans.'
    - 'R3Q1 CAP SCOPE — provider-contributed schemas only, ceiling 6. MEASURED: 77 tools are already registered. Capping the TOTAL would let an unrelated new core tool break memory activation, and would need re-tuning every time the core grows. The 77 are already governed by the footprint ladder; what needs a ceiling is what plugins ADD.'
    - 'R3Q2 BUILTIN — D08.1''s curated memory is EXEMPT from the cap and NON-REMOVABLE. It is expressed through the provider interface, so the interface is exercised by a real implementation rather than only by hypothetical ones, but it can never be deactivated: D08.1 shipped the two files as a guarantee, not an option.'
    - 'R3Q3 DECLARATION — extend PluginManifest.type''s Literal with ''memory_provider''. MEASURED: it is already Literal[mcp_server, skill_pack, local_plugin], frozen, extra=forbid — so ONE added value makes the existing loader, verifier, index and remote-install path apply unchanged. Footprint ladder rung 1/4, never rung 6. A separate memory-provider registry was explicitly rejected as the parallel-mechanism duplication PROCESS.md forbids.'
    - 'R3Q4 GATE — the two red consent smokes are a HARD GATE on the removal slice. That suite is the only thing that would catch collateral damage to consent and clarify, which share the orchestrator try-block being edited. Diagnose the skill_manage auto-allow branch to green BEFORE the block is opened.'
    - 'R2Q2 UNBOUNDED SOURCE TYPES, found by measurement during the brainstorm and pulled INTO scope: _trim_turns deletes WHERE source_type = ''conversation'' only, so the D08.1 bound covers one of four types living in staged_facts. conversation_summary (6 rows, written 09:03-09:05 on 2026-08-11) and agent_self (4 rows) are actively appending with nothing pruning them. Small today and genuinely unbounded — the same no-decay disease as the 88k store, one layer along from the fix that created it. The bound widens to every source type.'
    - 'SLICE B OPENED 2026-08-14, and the evidence for it is now COMPLETE rather than assumed. R1Q3 said the three channel approve/reject callbacks can never be populated; that is measured end to end. (1) The `memory_nudge` event that would produce the keyboards has NEVER been emitted — 0 occurrences across every retained log — and NO SOURCE FILE EMITS IT AT ALL; the only references are formatters that would render it and handlers that would handle it. (2) No memory approve/reject callback has ever fired, in any retained log. (3) Telegram''s MemoryCallbackHandler (185 lines) had NO CONSTRUCTOR ANYWHERE — it was never registered, so it could not have fired even if a keyboard had appeared. Slack and Discord ARE wired, at orchestrator.py 3260-3287 and 3455-3488.'
    - 'ESC-2 VALIDATED ON LIVE TRAFFIC 2026-08-14. The morning_brief job ran at 13:00:26Z with the fix deployed: section_count=3 and "staged_count" now appears ZERO times in the log. The misleading number is gone from a real run, not merely from the code path — which is the standard D08.1 taught this programme to insist on. (The third section is the integration one, present when a registry is wired; the log gives the count, not the names, so that part is inference and is labelled as such.)'
    - 'I OVERCLAIMED LAST ITERATION AND IT IS WORTH RECORDING WHY. After removing the TUI panel I wrote that "every surviving FactPromoter reference is inside memory/". FALSE. The grep behind it matched the CLASS NAME (FactPromoter/force_promote/.promoter) and missed MODULE-PATH imports of the form `from stackowl.memory.fact_promoter import ...`. The real count was 7 importers, three of them the /memory command surface. This is the SECOND time in two days a reference count was wrong, and both times the cause was the same: the grep''s shape did not match the thing being counted. The 31-files figure counted mentions where uses were meant; this one counted a symbol where a module was meant. When a number sizes a decision, check what the pattern actually matches before trusting it.'
    - 'I7 VALIDATED ON THE LIVE DATABASE 2026-08-14 — and the read-only prediction matched the outcome EXACTLY, which is the point of having made it first. agent_self 2,971 -> 50; conversation 2,741 -> 2,741 untouched; webpage 10 and conversation_summary 6 untouched, both under the cap. Total staged_facts 5,728 -> 2,807. schema_migrations confirms 0114 applied. Restart clean: 1,199 INFO / 43 WARNING / 0 ERROR.'
    - 'ALL FOUR ESCALATIONS ARE NOW CLOSED — ESC-2 (brief sections, validated on a real 13:00Z run), ESC-3 (browser_recall_url repointed), ESC-4 (TUI panel removed), I7 (bound + backlog). D08.2 slice A is complete to its limit, slice B seams 1-3-part-1 are done, and the ONLY remaining work on the item is seam 3 part 2, which is scoped at 38 test files / 6,710 lines and explicitly budgeted as its own session.'
    - 'I7 IMPLEMENTED 2026-08-14, as Bakir chose: bound it AND delete the backlog. THE OBVIOUS FIX WOULD HAVE DONE NOTHING, which is why it was measured first — the existing trim is scoped `source_type = ''conversation'' AND source_ref = ?`, and every OTHER type carries a unique source_ref (agent_self uses the turn''s trace_id: 2,971 rows, 2,971 distinct refs, one row each). Widening that predicate would have matched nothing, forever — a write with no effect. So non-conversation types get a per-TYPE cap via a new _trim_source_type, trimming in the SAME PATH as the insert for the same reason the conversation bound does: an actuator watching from elsewhere can stop working unnoticed.'
    - 'THE CAP IS ONE NUMBER IN TWO PLACES, and that is pinned rather than hoped. SQL cannot import _TURN_HISTORY_FLOOR, so migration 0114 hardcodes 50 — and a test reads the .sql and asserts it equals the constant, failing if either side drifts. That is the "one source, have the other ask it" remedy in the only form a SQL file allows.'
    - 'MEASURED READ-ONLY BEFORE APPLYING, on the live database: the migration deletes 2,921 agent_self rows and keeps the newest 50; webpage (10) and conversation_summary (6) are under the cap and untouched; conversation (2,741) is not touched at all, staying bounded per session. Backup first as always: ~/.stackowl/backups/pre-i7-staged-bound-20260814-090118.db, 922MB, taken with sqlite3''s online backup API so the running platform was safe. NO VACUUM in the migration — 0112 failed on exactly that.'
    - 'ESC-3 IMPLEMENTED 2026-08-14 — browser_recall_url KEPT and repointed at curated memory, as Bakir chose over the loop''s recommendation to remove it. The substring search MOVED from a private _curated_matches on the memory tool to CuratedMemory.search(), its actual home: copying it into the browser tool would have been two copies of one rule. Both tools now ask one implementation. THE PROMISE NARROWS HONESTLY WITH THE SOURCE: curated memory is two small budgeted text files, not a page cache, so the tool''s description now says it answers "have I noted anything about this URL" and explicitly NOT "here is the page". 7 new tests.'
    - 'AND I BROKE THE TREE MID-ITERATION, BY THE SAME MISTAKE I HAD JUST WRITTEN UP. Part 1 removed remember_fact after checking its callers with a grep piped through `head -6` — which TRUNCATED before showing three more test files that used it. The removal collection-errored tests/memory/test_force_promote_semantic.py and would have needed surgery on test_trust_stamping.py and test_memory_governance_journey.py too. REVERTED rather than pushed through: remember_fact is harmless dead code, reverting un-broke the tree immediately, and its removal belongs in seam 3 part 2''s dedicated pass where all 38 test files are handled together anyway. The lesson is the same one recorded that morning about the 31-files figure and the FactPromoter symbol grep, now with a third instance: A TRUNCATED GREP IS A WRONG ANSWER, not a partial one. Never size a removal from a `head`-limited list.'
    - 'ANOTHER PRE-EXISTING RED FIXED: tests/memory/test_trust_stamping.py::test_web_fetch_stages_untrusted called WebFetchTool._stage_in_memory, removed by D08.1''s 247d74a5. That commit says its test was "INVERTED rather than deleted"; the sibling copy in the trust suite was missed and had been failing with AttributeError ever since. Inverted the same way — it now asserts the method is GONE, so staging cannot quietly come back.'
    - 'SEAM 3 PART 2 SCOPED AND DELIBERATELY NOT STARTED (2026-08-14). MEASURED: ~2,200 lines of source (fact_promoter 366, contradiction_detector 256, pruner 129, dream_worker 554, dream_worker_helpers 722, scheduler/handlers/dream_worker 159) against a test surface of 38 FILES AND 6,710 LINES. That is a dedicated multi-pass job, not a tick — and D08.1''s own bulk attempt on this subsystem produced 140 errors across 45 files. Starting it at the tail of a self-paced iteration would either break the tree or force a rushed mass-deletion of tests, which is precisely the failure the seam-by-seam method exists to avoid.'
    - 'THE PHASE CLAIM WAS CHALLENGED AND HELD, which is worth recording because two inherited claims had already failed this week. progress.yml says "all five DreamWorker phases were fact work". _phase_kuzu_sync looked like a counterexample — it dispatches a kuzu_sync JOB rather than touching facts, and D08.1 explicitly KEPT the Kuzu adapter because owls/evolution.py and pipeline/steps/classify.py query the graph. Checked: kuzu_sync_handler.py:86 joins ON committed_facts, so it syncs FACTS into the graph and has had nothing to sync since migration 0112. _phase_reembed_on_model_drift likewise re-embeds committed facts. So all five ARE fact work; the original claim stands. Also verified there is NO independent kuzu_sync job row — the DreamWorker was its only trigger, and that job is enabled=0.'
    - 'PLAN CORRECTED 2026-08-14 — THE PREVIOUS VERSION OF THIS PLAN WAS WRONG AGAINST THE RECORD, and following it would have deleted a feature Bakir explicitly asked to keep. It said "delete the CONSUMERS first — dream_worker.py, dream_worker_helpers.py, scheduler/handlers/dream_worker.py". But progress.yml says in TWO places (current.ALSO_WAITING and D08.1 changes) that the DreamWorker handler is REGISTERED AND UNSCHEDULED AS THE SEAT FOR N01 DREAMING, which is Bakir''s own idea. D08.1 unscheduled it rather than deleting it precisely so N01 would have somewhere to land. Caught by re-reading the record before acting, which is the third time this week a claim needed checking and the first time checking prevented deleting a wanted feature.'
    - 'AND dream_worker_helpers.py CANNOT SIMPLY GO EITHER: cli/app.py:508 imports reembed_committed_facts from it for the `db reindex-memory` COMMAND. That is user-facing, and it re-embeds committed_facts — empty since migration 0112, no writers — so it is another always-no-op surface, the same shape as /staged and browser_recall_url. D08.1 removed the SLASH version (/memory reindex, in abb08e09) on exactly this reasoning and missed the CLI door. Raised as ESC-5 rather than decided by a tick.'
    - 'PASS 4 CLASSIFICATION, done so the next pass does not rediscover it. The 19 files are NOT uniformly fact-pipeline tests, and at least three carry assertions over LIVE capabilities that must be repointed rather than deleted: test_memory_fix_guards.py has test_guard_memory_command_registered_via_orchestrator (the /memory command being registered — live); test_persona_evolution_journey.py has test_dna_evolves_live_and_survives_restart (owl DNA evolution — live, and unrelated to facts except as fixture); test_memory_governance_journey.py is entirely the trust-fencing guard, which is ESC-6. The rest — test_plan_b_promotion, test_promoter_embed, test_promotion_cap, test_scope_key, test_fts_base_atomic, test_recall_fts_fallback, test_recall_model_mismatch_journey, test_authored_once_promotion, test_force_promote_semantic, test_j2_research_and_remember — are promotion-pipeline tests and travel with it.'
    - 'AND THE PASS IS STAGEABLE AFTER ALL, which the earlier note got wrong. It is atomic only if the survivors are removed at the same time as the leaf. Repointing them FIRST — while fact_promoter still exists, so they stay green — makes it two steps with a green tree throughout, exactly like passes 1-3. That is the plan regardless of how ESC-6 resolves.'
    - 'PASS 4 SCOPED, NOT STARTED, AND IT IS BIGGER THAN ESTIMATED: fact_promoter has 19 test files and ~75 tests, not the 14 recorded earlier. Removing the leaf breaks them all at once, so unlike passes 1-3 it cannot be staged — it is one atomic commit. Several are JOURNEYS and a SMOKE covering user-facing paths (j2_research_and_remember, memory_governance_journey, e4_s1_memory_telegram_smoke), which need reading rather than deleting.'
    - 'AND SCOPING IT FOUND A RED SMOKE ON A LIVE USER-FACING PATH, which is why the tick spent itself there instead. tests/smoke/test_e4_s1_memory_telegram_smoke.py — the ONLY end-to-end proof that the `memory` tool is reachable from a real Telegram message — monkeypatched stackowl.tools.knowledge.memory.FactPromoter. D08.1''s abb08e09 removed the promoter from that tool when it was retargeted at curated memory, so the patch had been raising AttributeError and the smoke had been failing ever since, unnoticed.'
    - 'REPAIRING IT SURFACED THE SAME ISOLATION BUG AS THE SKILL_MANAGE SMOKE. memory(action="add") now writes ~/.stackowl/memory/USER.md, and this test had NO isolation at all — no STACKOWL_HOME, no tmp_path — so a naive repair would have written its fact into Bakir''s REAL profile, exactly as the skill_manage smoke was found doing (it left a real greet-politely skill behind on 2026-08-07). Now sets STACKOWL_HOME; verified afterwards that the real profile contains 0 occurrences of the test string. The provenance assertion moved from a staged fact''s source_type to the CURATED FILE''s contents — where the system prompt actually reads it — and the success assertion was tightened from a fuzzy substring to the real contract: "Saved." AND "next /new", because D08.1 made telling the user WHEN a write reaches the prompt mandatory.'
    - 'SEAM 3 PART 2, PASS 3 DONE (2026-08-14) — dream_worker_helpers STRIPPED 722 -> ~180 lines, and ContradictionDetector REMOVED (256 lines) with its assembly wiring. The strip is what unlocked the detector: helpers was the only thing besides assembly still importing it, and reembed_committed_facts turned out to use NONE of the module''s other nineteen definitions, so keeping the CLI''s one live function cost nothing. That freed the detector WITHOUT touching ESC-5''s CLI question at all.'
    - 'TWO INCOMPLETE CHECKS CAUGHT BY THE GATE RATHER THAN BY ME, both the same shape as the grep lessons. First: I verified reembed used no local FUNCTION or CLASS defs and stripped on that basis — it also used a module-level SQL CONSTANT, which ruff caught as F821. Second: I kept only reembed, but tests/memory/test_lancedb_dim_swap.py also needs count_committed_facts and count_committed_with_vectors to assert the rebuild''s vectorless-legacy healing path — those are COVERAGE of the surviving function, not residue, so they were restored. An AST query is only as complete as the node types you ask it about.'
    - 'THE TEST SURGERY STAYED SURGICAL. Four contradiction test files deleted whole. test_story_6_6.py lost its 7 detector tests but KEPT 2 unrelated migration assertions, which is why it was trimmed rather than deleted. test_c7_f130b_multi_writer_chain.py checks the audit hash chain across THREE writers; only the dream-worker contradiction writer went, so 1 of 3 tests was removed and the empty class shell it left behind was cleaned up. test_authored_once_promotion.py lost only the one test whose helper function had been removed; its other five cover the promoter and go with it in pass 4.'
    - 'PASS 3 GATE: 15 passed on the reworked files, 51 passed across the wider affected set. ruff baseline 39, mypy clean, src/ 803 -> 802 files. WHAT REMAINS: fact_promoter alone, still imported by assembly.py and by commands/memory_helpers.py''s remember_fact — the function restored earlier precisely because removing it broke four test files. Pass 4 is the promoter plus that restore, with ~14 test files, and it is the last of seam 3 apart from ESC-5''s CLI decision.'
    - 'SEAM 3 PART 2, PASS 2 DONE (2026-08-14) — MemoryPruner REMOVED (129 lines) with its assembly wiring and its MemoryComponents field. It was the only one of the three leaves genuinely isolated: complete module-path search showed assembly.py as its sole importer in src, and knowledge_prune.py''s remaining mention is a history docstring from when that handler wrapped it. Two dead test doubles went with it — FakePruner in _story_6_6_helpers and _FakePruner in test_story_7_1 — both uncalled after the earlier knowledge_prune repoint, and both standing in for a class that no longer exists, which is failure mode 2 waiting to happen.'
    - 'AND THE OTHER TWO LEAVES ARE NOT YET ISOLATED, measured rather than assumed: fact_promoter is still imported by assembly.py, dream_worker_helpers.py AND commands/memory_helpers.py; contradiction_detector by assembly.py and dream_worker_helpers.py. The route through helpers is the interesting one — that module is now ONE live function (reembed_committed_facts, for the CLI) plus a large body of checkpoint and contradiction machinery that nothing calls. Stripping helpers to its live function would free BOTH leaves without touching ESC-5''s CLI question at all. That is pass 3, together with the 6 test files that import the dead helper functions and the 7 ContradictionDetector tests deliberately kept in test_story_6_6.py during pass 1.'
    - 'SEAM 3 PART 2, PASS 1 DONE (2026-08-14) — dream_worker.py STRIPPED TO ITS SEAT, not deleted. Gone: the five _phase_* methods and the phase machinery (_run_phases, _run_one_phase, _begin_new_run), and with them the constructor''s bridge/promoter/pruner/kuzu_handler/detector arguments — register_dream_worker_handler() now takes NOTHING. Kept: the class, _handler_name = "dream_worker", defer_under_load, execute, and the registration, because that is N01 Dreaming''s seat. execute reports honestly (effect_class="read_only", phases_run=0, "no phases configured") rather than returning a silent success indistinguishable from a working pass. 554 lines -> 101.'
    - 'THE TEST SURGERY WAS MIXED, NOT WHOLESALE, and checking each file is what made the difference. test_story_6_6.py looked like a DreamWorker file: 7 of its 10 tests actually cover ContradictionDetector, a LEAF that survives until pass 3, so only the checkpoint test went. test_kuzu_sync_deadline.py: 5 of 8 cover kuzu_sync_handler itself, which survives — only the 3 testing the dream worker''s budget handoff went, and one of those (test_a_standalone_call_falls_back_to_the_safe_default) had to be READ before removing because its name suggested the opposite. test_story_6_6b.py was rewritten as the SEAT''s test file, carrying over the handler_name assertion verbatim because that string is what the job row keys on. test_dream_worker_reliability.py (12 checkpoint/resume tests) deleted whole. Also removed a DEAD AND BROKEN make_handler in _story_6_6_helpers.py — uncalled, and it still built the handler with the old signature, so it would have failed the moment anyone used it.'
    - 'PASS 1 GATE: 53 passed across story_6_6/6_6b/double_conformance/kuzu_deadline/dream_worker_seed/story_7_1, plus 53 more across targeted scheduler files including defer_under_load. ruff baseline 39; mypy clean on all three touched source files. NOTE: `pytest tests/scheduler/` hung past 4 minutes — the broad-directory landmine again, third confirmation this week; targeted files only.'
    - 'CORRECTED PLAN, in dependency order so the tree is green at every commit: (1) STRIP dream_worker.py to its seat — remove the five _phase_* methods and the phase machinery (_run_phases, _run_one_phase, _begin_new_run, the checkpoint), KEEP __init__/handler_name/defer_under_load/execute and the registration, since the seat is the point; note the handler is enabled=0 so its execute cannot run in production today, which makes this near-zero risk; (2) rewire memory/assembly.py, which constructs the DreamWorker with promoter/detector/pruner; (3) the leaves then have no importers: fact_promoter, contradiction_detector, pruner; (4) dream_worker_helpers LAST, and only once ESC-5 settles the CLI command. Each of the 38 test files gets the D08.1 treatment — read what it covers BEFORE removing it, keep anything testing a surviving capability, repoint anything whose invariant outlives its vehicle. Budget it as its own session.'
    - 'SLICE B SEAM 3 PART 1 (2026-08-14) — fact_promoter freed from commands/ and startup/ entirely. Two dead things, each verified before removal: remember_fact in memory_helpers had NO production caller (only tests; /memory stopped routing to it when D08.1 retargeted it at curated memory) and was the promoter''s only real use in commands/; and MemoryCommand''s `promoter` parameter was ASSIGNED TO self._promoter AND NEVER READ, wired all the way from orchestrator:1664 through CommandDeps for nothing. forget_fact is genuinely live (tools/knowledge/memory.py:492) and untouched. The provenance test''s audit-failure case was repointed at its forget half rather than deleted — it already had one, so the invariant is unchanged. Gate: 360 passed across tests/commands/ and the provenance suite; ruff baseline 39; mypy unchanged (the 3 orchestrator errors are the pre-existing ones already checked against the 78 baseline).'
    - 'ESC-4 IMPLEMENTED 2026-08-14 — the TUI MemoryReviewPanel (236 lines) and its stylesheet REMOVED, and with them the last consumer of fact_promoter outside memory/. Its four test files were handled by what each actually needed rather than by deleting them: test_story_8_5.py had 6 panel-SPECIFIC cases, removed; test_overlay_keyboard.py and test_keyboard_reachability.py only needed A concrete OverlayPanel as a sample, so they now use EvolutionInspectionPanel and keep their coverage; test_story_8_5b.py just listed the panel''s .tcss in a parametrised stylesheet check. One test NAME that still said memory_review was renamed — a name that lies is as bad as a comment that lies.'
    - 'AND SEAM 3 IS NOW SELF-CONTAINED, which is the point of having done ESC-4 first. Every surviving FactPromoter reference is INSIDE memory/ — assembly.py constructs it and dream_worker.py drives its phases. The removal that was going to reach across channels, the orchestrator and the TUI is now one package.'
    - 'ANOTHER PRE-EXISTING RED FIXED IN PASSING: tests/tui/test_banner.py::test_banner_art_matches_legacy_header compared the wordmark against /ssd/projects/src/cli/v2/io/header.ts — a TypeScript file that went with the TS codebase in the v2-to-root migration, at a path OUTSIDE the repo. It had been failing with FileNotFoundError ever since. The comparison can never be restored, so the invariant it protected (the wordmark does not change by accident) is now pinned against the art itself. tests/tui/ goes 340 passed / 1 failed to 341 passed.'
    - 'ESC-2 IMPLEMENTED 2026-08-14 — both brief memory sections REMOVED: MemoryHighlightsAssembler (read the empty committed_facts, so it rendered its F-79 "nothing notable" item every morning, structurally, forever) and PendingStagedFactsAssembler (rendered staged_count:5719 — not empty but WRONG, counting conversation-buffer rows nobody can act on since /staged was deleted). Removed with their registrations in morning_brief and check_in, their exports, their two per-section config toggles, and 6 tests. The morning_brief job fires at 13:00Z daily, so this was the most time-sensitive of the four escalations.'
    - 'AND FIXING IT SURFACED A PRE-EXISTING RED nobody had noticed: tests/test_story_7_1.py had TWO failures from D08.1''s own b4c69b8f, which made knowledge_prune skill-curator-only and dropped its `pruner` parameter without updating the tests that passed it — a TypeError on every run since. REPOINTED rather than deleted: the proxies-to-pruner case became one asserting the curator pass and one asserting the no-curator case reports zero, so the behaviour keeps coverage. A stale comment in the handler claiming "the fact prune above already succeeded" was corrected too; there is no fact prune any more.'
    - 'THREE BRITTLE TESTS WERE DE-BRITTLED while passing through, rather than just renumbered: two asserted absolute assembler counts (== 4, == 5) that this change turned into change detectors, and one asserted a failing SECTION by relying on MemoryHighlights'' recall raising. They now assert against handler._assemblers, against the presence of IntegrationSectionAssembler, and against an injected exploding stub — each pinning the relationship the test is named for instead of a literal that any future section would break.'
    - 'ESC-2 gate: 56 passed across story_7_3, 7_3b, 7_1, story_11_4 and the morning-brief journey. ruff baseline holds at 39; mypy clean on all 8 touched source files.'
    - 'SLICE B SEAM 2 (2026-08-14) — the wired Slack and Discord memory callbacks REMOVED, with _SlackMemoryBridgeComposite which existed only to feed them. This is the orchestrator try-block D08.1 refused to open in a session tail, so it was opened with the gate measured either side. Both blocks turned out to excise cleanly: consent and clarify register as separate statements BEFORE the memory lines, so nothing shared was touched. 3,350 chars from orchestrator.py, plus both handler files. Five memory test cases were removed by AST boundary from two files that ALSO cover consent and clarify — 4 from test_slack_callbacks.py, 1 from test_slack_interactivity_wiring.py — leaving every consent/clarify case intact, along with ~60 lines of orphaned fixtures that only served them. Four stale docstrings corrected rather than left pointing at deleted modules.'
    - 'GATE HELD, MEASURED BOTH SIDES: the consent suite passed 95 before seam 1, 95 after seam 1, and 104 after seam 2 (the extra 9 are telegram callback tests folded into the run). ruff baseline holds at 39. mypy is 78 in 15 files — EXACTLY the recorded baseline, which also proves the 3 errors mypy reports in orchestrator.py are pre-existing and not from this edit. src/ went 807 -> 805 files. Zero dangling references anywhere in src/ or tests/.'
    - 'SLICE B SEAM 1 (2026-08-14) — telegram/memory_callbacks.py DELETED with its 110-line trust test, plus the 3 memory-specific cases trimmed out of test_telegram_callbacks.py. The other 9 cases in that file cover CallbackRouter and CallbackIdempotencyStore, which are live infrastructure, and were kept: they use AsyncMock with ''mem:approve:'' as an ARBITRARY prefix string, so they never depended on the handler. Two stale docstrings that pointed at the deleted module were corrected rather than left lying. Zero risk by construction — nothing constructed this handler. src/ is now 807 .py files; ruff baseline holds at 39.'
    - 'SLICE A LIVE HALF COMPLETE (2026-08-14). commands/reset was the third and last live-half consumer — it takes the bridge by constructor injection and only calls clear_session, so narrowing its annotation to ConversationStore was the whole change. Pinned by a test that drives /reset against an object implementing ONLY the five live methods, which would not satisfy MemoryBridge at all: the seam paying for itself rather than being asserted.'
    - 'AND THE ITEM''S HEADLINE FIGURE WAS WRONG, corrected in both the design doc and the test that repeated it. Measured across every file outside memory/ that names the bridge: 3 use only the live half, 11 use only the dead half, 16 merely mention it in annotations, and ZERO use both. The halves were ALREADY DISJOINT at file level. "31 files, so the split cannot be done casually" counted files that MENTION MemoryBridge, which is a different question, and overstated the work by an order of magnitude. Seam-by-seam was still right — it is how the disjointness was discovered rather than assumed — but the caution it bought turned out to be unnecessary here. Worth remembering the next time a file-count is used to size a refactor.'
    - 'WHAT REMAINS OF SLICE A IS ENTIRELY ESCALATED, so the item is done to the limit of what is unblocked: the sqlite_bridge trim widen is I7 (now a destructive migration), brief/assemblers is ESC-2, browser/tools is ESC-3. The memory tool''s search needed NO repoint at all — D08.1 R3Q10 already had it spanning both surfaces via _curated_matches. SLICE B IS NOW UNBLOCKED: ESC-1 is resolved and the consent smoke suite is green (95 passed), which was its stated gate.'
    - 'SLICE A SEAM 2 (2026-08-14) — the first real consumers moved onto ConversationStore. StepServices gained a `conversation_store` PROPERTY over the existing memory_bridge field, deliberately not a second field: two fields holding one object is two copies of one fact and they drift. turn_persist and classify now take the live half from it and can no longer reach stage/recall/delete/list_staged. 3 call sites, 3 source files. mypy clean on all four touched files.'
    - 'AND IT SURFACED THE COST OF THE REST OF THE SLICE, which is worth knowing before committing to it: the change broke 5 tests in test_turn_persist_retry_queue.py, all for one reason — each test hand-rolls a `class FakeServices` with just the attributes it happens to need, so a new property on the real StepServices is invisible to it. Failure mode 2, and EIGHT test files define such a double. Fixed at root rather than by patching the double: the five ad-hoc classes were replaced with real StepServices(...) instances, which construct cleanly because every field is defaulted, and are immune to the next field or property by construction. Expect the same fix on other files as more consumers move; that is the cost of the seam, and it is worth paying once per file rather than adding an attribute to a fake each time.'
    - 'I7 DECIDED 2026-08-14 — Bakir chose to BOUND IT AND LET THE TRIM DELETE THE BACKLOG, over the loop''s recommendation to bound forward-only. So this is a destructive migration over ~2,971 rows written before the rules changed, and it takes a DB BACKUP FIRST — the same discipline every prior data step in this programme used (D08.1''s purge backed up 922MB to ~/.stackowl/backups/pre-fact-purge-20260810-205135.db before migration 0112).'
    - 'I7 CHANGED CHARACTER, 2026-08-14, and the change is worth recording. When the bound was agreed it was a fix for ACTIVE unbounded growth: agent_self was climbing ~1,400/day. Removing that orphaned writer (a4d89954) stopped the growth at source — agent_self has not gained a row since 02:53Z, and conversation is already bounded at 60/scope. So widening the trim would now mostly DELETE ~2,971 historical rows rather than prevent anything, which makes it a destructive migration and its own hard stop. The invariant still stands; what changed is that it is no longer urgent and is no longer free. Decide it deliberately rather than shipping it as a bound.'
    - 'R2Q4 SEARCH — substring over the curated files, matching what /memory already does. The corpus is ~3.5KB; a vector index over two small text files is machinery without a problem, and D08.1 deleted one of those already.'
    - 'NOT ASKED, DELIBERATELY: the remaining questions of the nominal 25 were answered by MEASUREMENT instead of by Bakir, which the grill rule itself prefers — recall''s real readers, the trim predicate''s scope, the 77-tool count, PluginManifest''s shape, and whether parliament pellets pollute the conversation buffer (they do not: recent_conversation_turns filters source_type=''conversation'').'
    changes:
    - 'SCOPE ADDED 2026-08-10 by D08.1''s grilling session, and priority raised P2 -> P1: this item now carries the MemoryBridge SPLIT (a live conversation half - store/retrieve/recent_conversation_turns, load-bearing in turn_persist and classify - versus a dead fact half; 32 files outside memory/), the three channel approve/reject callbacks (telegram 185, slack 145, discord 114 lines), and with them fact_promoter, contradiction_detector, pruner and the DreamWorker''s five phases. They travel together because the promoter''s last consumers ARE the callbacks, and the callbacks are wired inside the same orchestrator try-blocks as consent and clarify - that block should be opened ONCE, carefully, with a consent smoke test after.'
