# ============================================================================
# progress.yml — StackOwl re-architecture against the Hermes Agent reference
# ============================================================================
# THIS FILE IS THE SOURCE OF TRUTH FOR *STATE*.
# docs/hermes-mapping/HERMES_STACKOWL_MAP.md is the source of truth for *CONTENT*.
# Never duplicate map prose into this file — reference it by `map_ref`.
#
# EVERY agent working this program MUST:
#   1. Read `workflow` and `rules` below before touching anything.
#   2. Work the item named in `current`. Do not jump ahead.
#   3. Advance one stage at a time. Update this file after EVERY stage.
#   4. Never mark a stage `done` without the evidence named in the stage gate.
#   5. Append to `decisions` and `changes` — never rewrite history.
# ============================================================================

schema_version: 1
updated: 2026-07-25
updated_by: "claude-opus-5 (session 0682205b)"

program:
  name: "StackOwl ← Hermes"
  goal: >
    Rebuild StackOwl toward the architecture of Hermes Agent — the teacher platform —
    while keeping the 16 areas where StackOwl is already ahead. Outcome: a personal
    assistant that is cheap per turn, narrow at the core, broad at the edges, and
    learns from every conversation without being asked.
  owner: Bakir
  started: 2026-07-25
  constraints:
    provider_agnostic:
      stated_by: Bakir
      date: 2026-07-25
      constraint: >
        Bakir's own deployment is a SINGLE LiteLLM gateway (NeraAiRaw). His users run
        many different backends, and StackOwl's provider config already supports that.
        Therefore NO code may branch on a provider's name. Dispatch on response SHAPE
        and declared CAPABILITY instead.
      worked_example: >
        D01.6's _cached_input_tokens() walks prompt_tokens_details.cached_tokens ->
        cache_read_input_tokens -> cached_tokens -> 0. Nothing in it names a vendor. A
        new backend reporting any of those three shapes works with no code change; one
        reporting none returns 0 honestly. Had it hardcoded the OpenAI shape it would
        have read 0 forever on Bakir's own LiteLLM gateway, and we would have wrongly
        concluded D01.1 had failed.
      related_rule: feedback_no_vendor_specific_logic
  vision:
    # Bakir, 2026-07-25, answering "what hurts today?" — all four pains, plus:
    stated: >
      Full J.A.R.V.I.S. for everyone. Today StackOwl is expensive, slow, and
      inconsistent; beyond that it lacks a good memory system, good tool usage,
      and a real autonomous agentic solution. Owls can be created and scheduled,
      but he wants much more: knowledge, the ability to learn the customer and
      know him well, and genuine autonomy.
    pillars:
      - "Cheap and fast enough to talk to all day"
      - "Memory that actually knows the user, not just stores facts"
      - "Tool usage that reliably accomplishes things"
      - "Autonomy beyond scheduled jobs — give it a goal and forget it"
      - "Learns continuously from every conversation"

teacher:
  name: hermes-agent
  origin: NousResearch/hermes-agent
  commit: 689b51bef
  local_path: do_not_push_to_git_research_only/hermes-agent
  handling: reference_only
  constraints:
    - "NEVER push this directory to git."
    - "NEVER copy source verbatim — port the design, write our own code."
    - "License is MIT; attribute ported designs in commit messages."
  laws:
    law_1:
      name: "Per-conversation prompt caching is sacred"
      statement: >
        A long conversation reuses a cached prefix every turn. Nothing may mutate past
        context, swap toolsets, or rebuild the system prompt mid-conversation. The only
        sanctioned exception is context compression.
    law_2:
      name: "The core is a narrow waist; capability lives at the edges"
      statement: >
        Every model tool ships on every API call, so a new core tool is the most expensive
        possible addition. Grow the product aggressively — at the edges, never at the waist.
  footprint_ladder:
    # Take the HIGHEST rung that correctly solves the problem.
    1: "Extend existing code"
    2: "CLI command + skill"
    3: "Service-gated tool (check_fn)"
    4: "Plugin"
    5: "MCP server in the catalog"
    6: "New core tool — last resort"

map_document: docs/hermes-mapping/HERMES_STACKOWL_MAP.md
process_document: docs/hermes-mapping/PROCESS.md   # READ THIS FIRST — how the work is done
doc_standard: docs/hermes-mapping/DOC_STANDARD.md
