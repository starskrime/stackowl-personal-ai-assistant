          - "The gate is 'the ended incarnation has transcript rows'. A lane that said nothing costs nothing, which is the whole cost control now that Q14's structural gate is withdrawn (its only signal was the counter that counted nothing). Keyed on the INCARNATION, because a conversations row IS one incarnation — so it cannot summarise a previous run of the same lane."
          - "Notability is carried in a STRUCTURED field ({notable, summary}), never sniffed out of prose. Matching phrases would be an English keyword list, and the prompt asks the model to answer in the conversation's own language."
          - "notable=true with an empty summary is treated as unusable, not as a summary. Unparseable output stages NOTHING and reports summary_parsed=false — a model that ignores the schema must not have its prose stored as a fact."
          - "The DurableTask is a CHECKPOINT RECORD driven by the handler, not a goal fed to the ReAct kernel: the kernel drives an agent loop toward an objective, and this is one call. A test asserts a failed summary leaves the row 'failed', never 'running' — a row stuck running for ever is the zombie the record exists to prevent."
          - "Idempotency is the DATABASE's (jobs.idempotency_key is UNIQUE), not the event's. One boundary produces one summary however many times it is announced, which matters because the sweeper finalises on the clock and the next inbound message resolves the same lane."
          - "params['run_once']=True — the scheduler's own convention (scheduler._is_recurring). Without it the job would re-arm onto a cadence for ever and re-summarise a conversation that ended once. Found by reading the scheduler rather than assuming 'manual' meant one-shot."
          - "A miner failure does NOT abort the narrative, and a provider failure still reports what was mined. The two halves are independent; losing both because one failed would be the coupling turn_persist was already careful to avoid."
