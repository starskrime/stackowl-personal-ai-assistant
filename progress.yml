  - id: D05.3
    title: "Service gating (check_fn)"
    domain: D05
    verdict: PARTIAL
    track: close_gap
    priority: P0
    wave: 2
    order: 10
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d053"
    gap: "Unconfigured capability still costs tokens on every call and invites hallucinated use."
    depends_on: [D05.2]
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: "docs/reference-mapping/designs/D05.3.md"
    doc_last_verified: "2026-08-02"
    decisions:
      - date: 2026-08-02
        stage: brainstorm
        by: Bakir
        round: >
          17 questions over 5 rounds, NOT the nominal 25 — stated rather than
          padded. The D05.2 lesson was applied first: read Hermes, then read the
          TREE, then ask only what neither answers. Roughly a third of the
          planned questions were retired by reading rather than by asking, and
          one round was spent putting a contradiction back (see THE_BIG_FINDING).
        THE_PREMISE_IS_MEASURED_not_asserted: >
          On this box, right now: 77 tools registered, 18,061 tokens of schema.
          BROWSER IS 25 TOOLS / 2,652 TOKENS = 14% of the entire tool surface,
          and the browser runtime is NOT running in this process. All 25 are
          presented anyway. That is D05.3's gap, live and quantified, without
          needing a synthetic scenario.
        what_hermes_does:
          check_fn: "A per-tool predicate. A tool with a failing check_fn is ABSENT from the schema entirely. registry.py:_check_fn_cached."
          ttl: "30s TTL cached on the FUNCTION OBJECT, so 25 tools sharing one predicate probe once."
          failure_grace: >
            THE HARD-WON DETAIL, and worth more than the mechanism. 60s grace:
            a probe that fails within 60s of its last success is treated as a
            FLAKE — last-good True is served, the failure is NOT cached, and a
            WARNING is logged. Scar tissue from their incidents #21658/#5304,
            where one timed-out `docker version` under load silently stripped a
            whole toolset mid-session and a delegate_task subagent then reported
            "Tool read_file does not exist".
          invalidate: "invalidate_check_fn_cache() after config changes."
        THE_BIG_FINDING_it_is_already_built: >
          ADR-6's HealableResource (infra/resilience.py:47) is a Protocol with
          EXACTLY the four things this item needs — available, unavailable_reason,
          ensure_available() (the heal), register_on_recycled() (the invalidation
          hook) — and it is implemented by TEN subsystems: browser runtime, the
          telegram/slack/discord/whatsapp adapters, LanceDB, Kuzu, the embedding
          registry, providers, the db pool and the MCP client.
          Health is further along than that: BrowserContributor.health_check()
          ALREADY returns "unavailable: {reason}", and health_sweep ALREADY
          collects it periodically and already has a heal path.
          So D05.3 is a LINK, not a subsystem. Same shape as D05.2, where the
          usage signal had been recorded for two months and only the consumer was
          missing. This time it was caught BEFORE designing, not after.
          The contradiction was put back to Bakir rather than absorbed: it
          changed the answer to two questions already given (Q8 and Q9).
        answers:
          gating_unit: "PER TOOL — but via a capability NAME, so 25 browser tools share one probe naturally (Hermes gets the same effect by caching on the fn object)."
          when_unavailable: "ABSENT from the schema, still findable via tool_search WITH the reason. Zero token cost, but an owl can still discover that the capability exists and report what is blocking it — a capability it cannot see is one it can never ask to have enabled."
          heal: "HEAL AT BOOT, then gate on the result. And heal EVERYTHING, no consent — Bakir overrode the 'ask for sudo/622MB' recommendation. CONSISTENT WITH THE TREE: browser_probe already auto-fetches the 622MB binary at boot today (fetch_if_missing=True), so this extends existing behaviour rather than introducing a new risk. Also matches the standing feedback_agent_auto_install rule."
          vs_D05_2_memo: "An availability flip INVALIDATES the memo — the same resolution D05.2 used for tool_search hydration: the toolset genuinely changed, which is what a cache miss is supposed to mean."
          predicate_shape: "(available, reason, remedy) — structured, not a bare bool. A bool cannot tell tool_search why, which would undercut the whole reason for keeping the tool discoverable."
          flake_handling: "ADOPT BOTH the TTL and the 60s grace window. StackOwl is MORE exposed than Hermes, not less — our probes run on a Jetson under load, and losing 25 tools to one timed-out probe is precisely the silent capability loss this repo has a standing rule against."
          protected_tools: "NEVER availability-gated. _DEFAULT_BASE ∪ _DEFAULT_ALWAYS are always presented even if their capability is down. Bakir chose this over my recommendation, accepting that web_fetch stays visible with no network, in exchange for a probe bug never being able to empty an owl's toolbox."
          manifest_field: "requires_capability: str | None on ToolManifest — Bakir's chosen PLACEMENT unchanged, but holding a NAME that resolves to one of the 10 existing HealableResources rather than 25 hand-written callables that would only wrap them."
          detection: "BOTH. register_on_recycled gives instant push for recycles; health_sweep polls for availability that APPEARS where nothing was recycled (an API key added, Docker started). Neither direction is covered by the other."
          dispatch: "REFUSE with the reason and remedy. A hidden tool is still dispatchable by name (that is how tool_search overflow stays callable), so the precondition is checked at dispatch instead of letting the tool's own code fail deep with an opaque error."
          remedy_source: "EXTEND HealableResource with an optional remedy. Bakir chose the precise-but-wider option over declaring it statically on the manifest: the subsystem knows WHY it is down, and a missing lib needs different advice than a dead socket. Touches all 10 implementations."
          degraded: "GATE ON `available` ONLY. Degraded means working-but-slow; hiding a working tool because it is slow removes capability the agent could still use."
          scope: "MAP EVERY CAPABILITY NOW — Bakir overrode my 'browser only' recommendation."
          registry_placement: "infra/capabilities.py, beside resilience.py which defines the protocol it serves. Same layer as hydrated_tools and presented_tools. Subsystems self-register at startup, because tools are registered statically by with_defaults() long before any runtime exists — so resolution MUST be lazy."
        THE_RISK_I_FLAGGED_WAS_ALREADY_MITIGATED_two_rounds_earlier: >
          I warned that "map every capability now" risks a Kuzu/LanceDB blip
          hiding the agent's MEMORY tools, against the standing rule about never
          silently disabling features. MEASURED instead of argued, and the
          warning turns out to be already covered by Bakir's own Q7 answer:
            18 of 77 tools are PROTECTED and can never be gated, including
            memory, reflect_now, evolve_now, skill_view (5 of the 9 knowledge
            tools), read_file, shell, web_fetch, tool_build, owl_build,
            skill_manage, synthesize_skills, cronjob, send_file, tool_search,
            tool_describe.
            Only 59 tools are gateable at all, and every self-extension tool is
            immune.
          So a vector-store hiccup CANNOT hide the memory tool. Two answers given
          three rounds apart compose into a safe outcome; recorded because the
          composition is not obvious from either answer alone.
        blast_radius_measured:
          gateable_by_group: "browser 25, code 7, agents 4, knowledge 4, media 4, (none) 4, scheduling 3, planning 2, interaction 2, process 2, web 1, tasks 1 = 59"
          never_gateable: "18 (the _DEFAULT_BASE ∪ _DEFAULT_ALWAYS protected set)"
        DEFECT_FOUND_WHILE_READING_misleading_startup_log: >
          orchestrator.py:1084-1086. The browser-runtime guard is
          `if self._role != "gateway" and probe is not None and probe.binary_ok:`
          but the else-branch logs `reason = "binary not found" if probe is not
          None else "probe did not run"` — it CANNOT say "this process is the
          gateway", which is the actual reason on this box. Live proof: the same
          boot logs `browser_probe.check: exit ... binary=True` and then
          `gateway: browser runtime skipped — binary not found`. Two lines from
          one boot contradicting each other, and it misled ME for ten minutes
          during this brainstorm. Small, real, and in scope for an item about
          what "available" means and who reports it. Fix in cleanup.
        NOT_a_defect_checked_before_flagging: >
          `browser_probe.check: exit libs=False xvfb=True binary=True ready=True`
          looks wrong — ready=True with libs=False. It is CORRECT BY DESIGN:
          browser_probe.py:30-35 documents that missing libs/xvfb are recoverable
          at runtime because Camoufox falls back to headless, so `ready` is
          deliberately `binary_ok` alone. Recorded because I nearly reported it,
          and the "understand the design intent before fixing" rule is what
          stopped me.
      - date: 2026-08-02
        stage: implement+cleanup+test+validate+document
        by: Claude
        what_shipped:
          registry: "NEW infra/capabilities.py — name -> HealableResource, 30s TTL, 60s failure-grace, fail-open on every uncertainty. Availability(ok, reason, remedy)."
          manifest: "ToolManifest.requires_capability. Declared on all 25 browser tools + browser_vision."
          presentation: "_capability_ok filters the DISCRETIONARY tiers in both select() and rank_candidates(). The guaranteed set is built WITHOUT it — invariant I2."
          tool_search: "A gated tool is still listed, annotated '[UNAVAILABLE: reason — fix: remedy]'. Hydration deliberately NOT filtered: a capability that returns mid-session must not lose a promotion the model already paid a search for."
          dispatch: "Refuses with reason + remedy, ordered BEFORE the bounds check — 'this cannot run' is cheaper and more honest than 'you may not run this', and needs no owl registry. Authz unchanged."
          protocol: "HealableResource gained an OPTIONAL remedy, read via getattr. Deliberately NOT declared on the Protocol — all ten existing implementers predate it and must keep conforming without edits."
        THREE_DEFECTS_FOUND_BY_WRITING_THE_TESTS_all_mine: >
          1. THE DIFF LOOKED COMPLETE AND WAS NOT. requires_capability on the
             shared _BrowserTool base covers only 18 of the 25 browser tools;
             SEVEN (browse, snapshot, back, press, get_images, console, dialog)
             subclass Tool directly and would have shipped silently ungated.
          2. browser_vision is grouped under "media" but screenshots a live page
             via sessions.get_page, so it needs the browser runtime. A sweep over
             the browser GROUP misses it. THIS IS THE COUNTER-EXAMPLE THAT
             JUSTIFIES requires_capability BEING ITS OWN FIELD rather than
             inferred from toolset_group. Caught only because the test asserted
             on tool NAMES instead of on the grouping the code already uses — an
             assertion deliberately stricter than the implementation.
          3. capabilities.clear() was wiping SUBSCRIBERS, which are import-time
             wiring, not state. That silently unhooked D05.2's memo invalidation
             for the rest of the process: a capability could recover and its
             tools stayed hidden until rollover. Also fixed register() to NOTIFY
             rather than merely drop its own cache — re-registration is exactly
             what a recovered subsystem looks like.
        THE_ITEM_WAS_INERT_ON_THIS_BOX_until_validate: >
          THE MOST IMPORTANT FINDING, and it surfaced only by restarting and
          reading live logs rather than trusting a green suite.
          resolve() fails OPEN on an unregistered name — correct, and the reason
          a typo cannot delete a toolset. But the orchestrator registered the
          browser capability only INSIDE the branch that constructs the runtime,
          and the gateway role skips that branch. So on this box the gateway
          registered nothing, gated nothing, and presented all 25 browser tools:
          THE GATE WAS CORRECT, WIRED, AND COMPLETELY INERT.
          Fixed by registering an _UnavailableCapability stub on the skip path.
          "There is no browser in this process" is a real availability verdict
          and must be stated as one; fail-open is for names nobody has an answer
          for, not for ones we do. Its ensure_available() RAISES rather than
          pretending to heal — a process that does not host a subsystem cannot
          start it, and silently succeeding would report a repair that never
          happened.
        THE_MAPS_FRAMING_IS_HALF_WRONG_measured: >
          The map says "unconfigured capability still costs tokens on every
          call". Measured both ways; the benefit depends on whether the cap binds:
            UNCAPPED (generous window): 59 -> 33 tools, 12,467 -> 9,553 tokens.
            A real 2,914-token / 23% saving — the pure availability effect.
            CAPPED at 36 (a browser-profiled owl): 36 -> 33 tools but tokens went
            UP, 7,285 -> 9,553. The cap was already binding, so gating frees 26
            slots that refill with other groups' LARGER schemas.
          The second case is not a token saving at all, it is CAPABILITY
          SUBSTITUTION: dead tools replaced by live ones. Arguably the bigger
          win, and not what the map claims. Both are wins; only one was predicted.
        mutation_M3: >
          Make _capability_ok return True unconditionally. Kills EXACTLY the
          three gating tests; all 15 registry tests still pass. Written BEFORE
          implementing this time, because D05.2's M1 survived its first suite —
          module tests prove correct, not wired.
        tests:
          - "tests/infra/test_capabilities.py — 15, weighted toward the REFUSALS to hide: fail-open on an unknown name, the grace window, a raising probe, a flake not being cached."
          - "tests/pipeline/test_d053_capability_gating_is_wired.py — 5. Real registry, real presentation, real budgeter, only the AI provider mocked. Asserts on what the PROVIDER received."
        suites_green: "D05.3 5, infra 143, presentation+registry 30, tools/meta 157, search+pipeline 35, D05.2 regression suite still green. ruff 46 / mypy 78 throughout."
        live_validation: >
          ./start.sh twice (pids 177475, 178216). Zero ERROR/CRITICAL both times.
          PROVEN LIVE:
            * the corrected skip message — "browser runtime skipped — this
              process runs the gateway role; the browser is hosted by core" —
              which no longer contradicts the probe's binary=True two lines away
            * "[presented_tools] capability changed — dropping every memoized
              tool array" — the registration fired and the capability -> memo
              invalidation chain works END TO END in production
          NOT PROVEN LIVE: the gating itself. ZERO turns have run since restart,
          so no schema has been built and "[capabilities] resolve: capability
          UNAVAILABLE" has had no opportunity to fire. Same denominator caveat as
          D05.2 — silence here is no traffic, not success.
        cleanup_done: "The misleading orchestrator log now distinguishes all three causes (gateway role / probe did not run / binary missing) instead of hardcoding 'binary not found' for all of them."
    changes: []
    notes: null

