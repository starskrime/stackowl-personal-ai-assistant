        mutation harness needs its restore VERIFIED, not assumed, or it silently
        poisons every result after the first miss.
      verified:
        tests: "tests/pipeline/ 1080 passed = the 1076 baseline plus exactly the 4 new gateway tests. Zero regressions."
        gates: "ruff src/ 46 = DEBT-1 baseline; ruff clean on the new test file; mypy src/ 78 = DEBT-8 baseline. Zero added."
