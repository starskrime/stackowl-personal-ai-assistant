# ---------------------------------------------------------------------------
# DOCUMENTATION — tracked for EVERY finding, no exceptions
# ---------------------------------------------------------------------------
documentation:
  rule: >
    Every one of the 111 items ships a document at docs/hermes-mapping/designs/<ID>.md
    meeting docs/hermes-mapping/DOC_STANDARD.md. No item reaches `done` without one.
    The document is OPENED in `architect`, kept current through `implement`, and CLOSED
    in `document`. It is never written after the fact.
  why: >
    Hermes' docs/session-lifecycle.md is why we adopted their whole session model in an
    afternoon instead of reverse-engineering gateway/session.py for a week. The document
    is not overhead — it is what makes the NEXT item cheaper. A subsystem legible only by
    reading its source gets rebuilt by the next person who touches it.
  our_style_vs_theirs: >
    We take their structure (audience, source files, field tables, flow diagrams, config
    appendix) and ADD four sections they had no need for: Invariants, Observability,
    Failure modes, Verification. Hermes has no trace propagation, no mandated logging
    contract, no acceptance authority and no self-heal ladder, so their docs never had to
    describe those. We have all four and they are the parts of StackOwl worth keeping.
  mandatory_sections:
    - "Why this exists"
    - Model
    - Lifecycle
    - "Invariants — numbered, each phrased so it could become an assertion"
    - Configuration
    - "Observability — exact log strings, span names, a copy-pasteable query"
    - "Failure modes — detected by / recovery / what the user sees"
    - "Verification — commands that pass, which the validate stage executes"
    - "Related — including WHERE WE DIVERGED FROM HERMES AND WHY"
  hard_rules:
    - "Never state anything you have not run. The first draft of D01.6.md cited a DB path, a CLI tool and a test file that did not exist — caught by running its own Verification section (see DEBT-2)."
    - "One document per subsystem. When several items land on one subsystem the later ones EXTEND it; they never add a second. Anti-duplication applied to prose."
    - "`Last verified` is a date AND a commit, never 'recently'. If you cannot re-verify, set status `stale` rather than leave a confident lie."
    - "Every Invariant must map to a real test. If it cannot be tested it is a wish — sharpen it or delete it."
  status:
    written: 4        # D01.1, D01.6, D01.6-baseline, D01.7
    closed: 1         # D01.6 (amended 2026-07-25 when D01.7 renamed a column it cited)
    outstanding: 107

# ---------------------------------------------------------------------------
# KNOWN DEBT — tracked, not ignored (feedback_no_skipping_preexisting_fails)
# ---------------------------------------------------------------------------
known_debt:
  - id: DEBT-11
    found: 2026-07-26
    what: >
      A rollover announced while no consumer is listening is lost PERMANENTLY, and
      silently. Q15's durability begins when the consumer enqueues a job; the window
      between PUBLISH and ENQUEUE is in-memory, fire-and-forget, and unrecoverable —
      because expiry_finalized makes the double-announce guard suppress any second
      announcement of the same boundary.
    found_how: >
      By validating part 5 live rather than trusting the wiring. The consumer WAS
      subscribed on both processes ('[memory] rollover_consumer: subscribed' at
      14:19 and 14:38) and no job was ever enqueued.
    the_timeline:
      - "01:57:05Z — idle rollover published. Consumer did not exist (part 5b unbuilt)."
      - "09:03:04Z — the SWEEPER finalised the lane on the clock (reason=daily, new_session_id=null), set expiry_finalized, and published session.rollover. Consumer still did not exist."
      - "14:41:55Z — Bakir's message arrived; branch=expired/daily minted 20260726_094155_1b416f35. already_announced was TRUE, so the guard correctly suppressed publication."
      - "Result: zero rollover_summary jobs, zero conversation_summary facts, and that boundary can never be re-announced."
    why_it_is_a_real_defect_not_a_deployment_artefact: >
      Today's instance was caused by adding the consumer after the boundary fired,
      which is a one-off. The MECHANISM is not: the sweeper finalises at 4 AM
      unattended, StackOwl's core exec-replaces itself on every code change, and a
      restart in the window between publish and enqueue loses that day's summary with
      no error and no way to notice. That is precisely the unattended case Q15 was
      written to protect.
    recommended_fix: >
      Make the ENQUEUE recoverable from persisted state instead of from a live
      subscriber. Add `summary_enqueued_at` (nullable) to sessions; conversation_sweep
      already runs every 5 minutes, so it can pick up any lane that is finalised (or
      has a newer incarnation) with no enqueue recorded, and enqueue then. The
      EventBus stays the fast path and the seam D09.1/D09.3 subscribe to (dedup target
      X3 is preserved); the sweep becomes the durable backstop. Rejected alternative:
      having the sweeper enqueue directly instead of publishing, which would work but
      would lose the one-boundary-many-consumers seam that X3 was resolved by.
    status: resolved
    blocks: "Nothing structurally — but part 5 cannot be called done while a boundary can silently lose its summary."
    resolution:
      date: 2026-07-26
      slice: "3b part 5c — the summary backstop"
      how: >
        Migration 0098 adds sessions.summary_enqueued_for — the INCARNATION whose
        summary has been queued, not a timestamp, because a bare "when" cannot tell
        yesterday's boundary from today's and the first marker would silence every
        later one. SessionStore.lanes_awaiting_summary() answers the recovery
        question from the ROW (expiry_finalized set, marker not matching the current
        incarnation), and conversation_sweep — already running every five minutes —
        enqueues for each and marks it. ONE enqueue implementation
        (enqueue_rollover_summary) serves both the live event and the backstop, for
        the same reason /new and the daily boundary share one code path.
      the_seam_is_preserved: >
        The EventBus stays the fast path and the boundary D09.1/D09.3 subscribe to,
        so dedup target X3 remains resolved by architecture. The backstop sits
        underneath it rather than replacing it.
      why_the_backstop_can_be_unconditional: >
        jobs.idempotency_key is UNIQUE on rollover:{lane}:{incarnation}, so
        re-enqueueing an already-queued boundary simply fails to insert. That is
        what lets the recovery pass be dumb and run every sweep instead of trying to
        be clever about when it is needed.
      failure_handling: "The marker is written ONLY after a successful enqueue, so a failed enqueue stays retryable on the next sweep rather than being silently dropped. A test pins it."
      honest_scope:
        covers: "The SWEEPER path — the unattended 4 AM case Q15 was actually written about. The sweeper finalises WITHOUT minting, so the lane still holds the ended incarnation and the boundary stays recoverable from the row."
        does_not_cover: "The INGRESS path, which mints immediately and moves the lane on. A crash in its publish->enqueue window is not recoverable this way — but a user is present there by definition, which is the case Q15 explicitly was not worried about."
        this_mornings_loss_is_permanent: >
          The boundary finalised at 09:03:04Z CANNOT be recovered: the 14:41:55Z
          message minted a new incarnation, which cleared expiry_finalized, so the
          row no longer records that a boundary ended unqueued. The fix prevents
          recurrence; it does not resurrect that summary. Stated rather than left
          for someone to wonder why the backstop found nothing.
      verified:
        tests: "9 new (red first) in tests/sessions/test_summary_backstop.py; 109 passed across tests/sessions + the rollover suite."
        migration: "0098 applied; second run reports already-applied; schema at 0098."
        lint: "ruff src/ 46 = DEBT-1 baseline. types: mypy src/ 78 = DEBT-8 baseline. Zero added."
        live: "Restarted — 'has_summary_backstop: true' on the registration, and conversation_sweep now reports summaries_recovered on every run (0, correctly, since nothing is awaiting)."
  - id: DEBT-10
    found: 2026-07-26
    what: "The ONLY enabled provider is unreachable — llm-gateway.dev.nera.gov does not resolve — so the platform is booting in DEGRADED mode and cannot answer a turn."
    evidence: >
      Log, on every boot since 2026-07-26T13:00: '[startup] provider_probe.check: all
      providers unreachable after 3 attempts — NeraAiRaw [openai]: [Errno -5] No address
      associated with hostname', followed by '[startup] providers: ALL providers
      unreachable — booting in DEGRADED mode'. `getent hosts llm-gateway.dev.nera.gov`
      returns nothing. Restarts earlier the same day showed ZERO ERROR/CRITICAL, so this
      began mid-day.
    not_caused_by_current_work: >
      D01.7 part 5b touches no provider configuration. The failure is DNS resolution of an
      external host, and it first appears BEFORE the restart that carried part 5b.
    impact: >
      Bakir's assistant currently answers nothing, and no D01 item can be validated
      end-to-end (the rollover summary needs a reachable model). The platform itself is
      behaving correctly — degraded mode with a loud error is the designed response.
    decision: "SURFACED to Bakir, not fixed: it is an environment/network fact outside the repo, and guessing at a new base_url would be inventing config."
    root_cause_found:
      date: 2026-07-26
      what: >
        NOT a StackOwl fault and not a moved host — the GlobalProtect VPN tunnel is
        DOWN, so the internal hostname has no resolver. gp-vpn.service died at
        07:07 CDT with "Invalid user name" and "Cookie was rejected by server;
        exiting" while attempting a reconnect.
      restart_attempted: >
        Restarted on Bakir's instruction (2026-07-26 09:24, guide at
        /etc/openconnect/guide.txt). It reached POST getconfig.esp and the portal
        returned HTTP 512 TWICE, re-prompted for credentials a third time, and
        exited when stdin was exhausted ("fgets (stdin): Inappropriate ioctl for
        device") — the unit pipes the password once and then holds stdin open with
        `sleep 120`, so it has nothing to answer a re-prompt with.
      why_it_is_credentials_not_duo: >
        No DUO challenge line ever appears in the log. It goes straight from "Enter
        login credentials" to a 512 on getconfig.esp, so the portal is REJECTING the
        credential rather than waiting for a push. /etc/openconnect/gp-risk.passwd
        is 19 bytes and unmodified since 2026-07-03 — 23 days, which is where a
        30-day corporate rotation would start biting.
      why_no_further_retries: >
        The unit sets Restart=no with the comment "each start triggers a DUO push;
        retrying on failure would send multiple pushes and LOCK THE ACCOUNT", and the
        guide caps it at 3 tries / 5 min. One attempt is already spent. Hammering an
        authenticated corporate portal with a credential it just rejected is the same
        harm class as the Telegram flood-control ban in this repo's history
        (project_telegram_flood_ban_fixed), so this stops here and asks.
      does_not_block_the_program: >
        Parts 6 and 7 need no model call, so D01.7 implementation continues. Only
        end-to-end VALIDATION of part 5 is blocked.
    status: resolved
    resolution:
      date: 2026-07-26
      what: >
        Bakir approved the DUO push and the tunnel came up:
        llm-gateway.dev.nera.gov -> 172.30.104.100. Platform restarted; the boot
        probe now reports 'provider NeraAiRaw [openai]: ok (770ms)' and
        'provider_probe.check: exit — ok=1 degraded=0' on BOTH processes.
        `python -m stackowl health` agrees: provider:NeraAiRaw ok (760ms). The only
        remaining degraded item is `browser` ("runtime not constructed"), which is
        lazy init and unrelated.
      my_diagnosis_was_WRONG_and_is_corrected_here: >
        I concluded from two HTTP 512s, the absence of any DUO challenge line, and a
        23-day-old password file that the stored credential had been rotated, and I
        told Bakir to consider re-entering it. That was wrong. The credential was
        fine; the 512s were the portal failing an UNAPPROVED DUO push. The reasoning
        error was treating "no DUO line in the log" as evidence that DUO was not
        reached, when this client simply does not log the push step — absence of a
        log line is not absence of a step. Recorded because the same inference would
        otherwise be made again the next time this tunnel drops.
      the_stopping_decision_was_still_right: >
        Halting after one failed attempt remains correct on its own terms — the unit
        says a retry risks locking the account, and the retry was made only once
        Bakir confirmed he was at his phone. Right call, wrong reason attached to it.
      lesson: >
        A VPN tunnel dropping presents identically to a provider outage or a moved
        host. `getent hosts <internal-host>` distinguishes them in one command and is
        now the first check when every provider goes unreachable at once.
