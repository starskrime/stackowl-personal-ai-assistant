      SPECIFICALLY because a reachability test could have contradicted the grep, and does
      not: it builds its own list of panels. So this is Telegram''s unwired handler again,
      in the TUI.
      It also reviews STAGED FACTS — the same permanently-empty queue — so even if it were
      reachable it could only ever show an empty list (no memory_nudge emitter anywhere,
