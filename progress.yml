  - id: D10.2
    title: "Authoring standard"
    domain: D10
    verdict: MISSING
    track: adopt
    priority: P2
    wave: 4        # pulled forward from 8 by D09.3 R1Q1 — it blocks the migration
    order: 61
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d102"
    gap: "Without a standard, an agent that writes its own skills writes inconsistent ones."
    depends_on: []
    blocks: [D09.3]
    dedup_target: null
    stages:
      brainstorm: done             # 25 questions, 7 rounds, 2026-08-08
      architect:  done             # designs/D09.3.md — shared with D09.3
      implement:  done             # slices 1,2,6,7 — standard.py, the gate, the
                                   # brief line, and the migrator
      cleanup:    done             # ruff 39 / mypy 78 baselines held exactly
      test:       done             # 41 in test_authoring_standard*.py, 13 in
                                   # test_standard_migration.py, 6 in the brief
      validate:   done             # 154/154 learned skills migrated, 0 failures;
                                   # conformance 157/168 -> 13/166, all 13 builtins (19 of 168 at last check)
      document:   partial          # designs/D09.3.md covers both; item doc pending
    doc: docs/reference-mapping/designs/D09.3.md
    doc_last_verified: null
    changes:
    - 'slice 1 (2026-08-08) — skills/standard.py: ONE machine-readable source. The rules are constants, describe_for_prompt() generates the prompt text from them, and the validator reads the same constants. Three hand-maintained copies of a standard is how a standard rots.'
    - slice 2 (2026-08-08) — enforced in gated_skill_write BEFORE the security scan and consent, so a malformed skill never reaches a human for approval. Every violation is reported at once (one retry, not three).
    - 'slice 6 (2026-08-08) — conformance reported in the autonomic_health brief. THE FEEDBACK LEG: the validator only covers writes made since it shipped, and the acceptance criterion is a claim about a trend, so without a number ''the standard is enforced'' is an assumption about code rather than an observation of the catalog.'
    - 'slice 7 (2026-08-08) — SkillStandardMigrator + /skill migrate + migration 0111 (standard_version). The rewrite is validated THROUGH gated_skill_write, so a bad rewrite is refused and the original survives. Order turned out to be load-bearing: validator first is what makes an unattended LLM rewrite safe.'
    - 'FALSE POSITIVE FIXED (2026-08-08), found by the first live batch: the shell-verb rule matched bare \b(grep|sed|awk|cat|ls|find)\b anywhere, so ''Use this to find the failing job'' was a shell instruction. A hardcoded English word-list applied to prose — the standing rule against exactly that. Now structural: matched only inside fenced/inline code, anchored to a line start or after a pipe, delimiters stripped from the span. The FIRST attempt at the fix over-corrected and passed everything, because leaving the backticks in pushes the first token off the line start and defeats the anchor. Tested in both directions.'
    - 'STANDARD_VERSION deliberately NOT bumped for that fix: the version triggers re-migration and the change LOOSENS the rule, so a bump would spend one LLM call per skill to reach the same catalog. Comment now reads ''bump on stricter, not on any change''.'
    - 'MIGRATION STATE (2026-08-08 ~19:00 UTC): 41 of 168 skills at v1. PAUSED — the LLM gateway host llm-gateway.dev.nera.gov stopped resolving from this box, so every provider call fails platform-wide (48 ''all providers unavailable'' errors in 10 minutes, and the scheduler''s earlier 93 failures at 15:38-16:01 have the same root cause). Not a code defect. Re-run scripts/migrate_skills_to_standard.py when DNS is back; progress is per-skill so nothing repeats.'
    - 'MY OWN RETRY STORM: the first batch runner looped 39 batches into an OPEN CIRCUIT BREAKER, logging 371 ''failures'' that were the breaker working correctly. Same shape as the scheduler retry storm noted under D09.3. The runner is now scripts/migrate_skills_to_standard.py and STOPS on a wholly-failed batch — ten failures with zero successes means the provider is down, not that ten skills are unmigratable.'
    - acceptance is 'zero NEW non-conforming skills', judged on writes from here on — not on the pre-standard backlog, which slice 7 is working through.
    - 'MIGRATION COMPLETE 2026-08-09: FINAL ok=113 fail=0. Every one of the 154 learned skills is at standard v1. The 14 builtins are excluded BY DESIGN (they are shipped files under version control; rewriting them with an LLM would put generated content in the repository).'
    - 'ACCEPTANCE MET, measured on the live catalog: the brief''s conformance line went from ''over_60_chars:157/168'' to ''over_60_chars:13/166'', and all 13 remaining are those excluded builtins. numbered:0/166 holds. Restart clean, 0 errors, loader reports 168 skills.'
    - 'The corrective retry earned itself: zero failures across all 12 batches after it landed, against roughly one per batch before.'
    decisions:
      - "R1Q1 — WRITE OURS, TAKING THEIR STRUCTURE. Keep Hermes' bones (fixed section order, real tool names in backticks, scripts/references/templates layout) but set our own values where evidence differs, and make every rule MACHINE-CHECKABLE. Their rubric is reviewer-enforced and assumes a human author; ours must hold when the agent is the author."
      - "R1Q2 — *** ADOPT <=60 CHAR DESCRIPTIONS, against measured evidence ***. Shown before choosing: our median is 197 chars, only 15 of 423 skills would pass, and registry.py already warns 'thin tool description — tool_search under-ranks short descriptions'. Bakir chose the Hermes rule anyway. Recorded as an informed override; the retrieval consequence is followed up in R2."
      - "R1Q3 — THE FILE CARRIES AUTHORED CONTENT ONLY. success_rate, n_executions, parent_traces and embedding_model move out of frontmatter; the database is already authoritative for all four. Two writers to one field is how they drift."
      - "R1Q4 — ADOPT ALL SEVEN HERMES SECTIONS AS REQUIRED (When to Use -> Prerequisites -> How to Run -> Quick Reference -> Procedure -> Pitfalls -> Verification). NOTE: this supersedes D09.3 R2Q5, which chose a three-section template (Steps / Verification / When not to use) — neither 'Steps' nor 'When not to use' is in the seven. Put back in R2."
      - "R2Q5 — CONTRADICTION RESOLVED: the seven stand and supersede D09.3 R2Q5. 'Steps' becomes 'Procedure'; 'When not to use' folds into 'When to Use' as its negative case. D09.3's decision list is superseded on this point, not deleted."
      - "R2Q6 — RETRIEVAL IS PROTECTED BY MOVING THE SIGNAL, not by keeping the long description. when_to_use becomes a REQUIRED rich field (1-3 sentences) while description is the <=60-char label. Measured: _embed_text composes name + description + when_to_use + body, and skills_fts indexes name/description/when_to_use/summary — so both already read when_to_use and the ~137 chars stripped from description are recovered there."
      - "R2Q7 — the 408 over-length descriptions are rewritten BY LLM during the migration, in the same pass that restructures bodies into the seven sections. One call per skill either way; the old rich description seeds when_to_use where that field is empty, so no retrieval signal is discarded."
      - "R2Q8 — the rule applies to SKILLS OF EVERY SOURCE (learned, user, builtin — they share one catalog and one retrieval path) and NOT to tools. A tool description feeds the model's tool array, a different surface with a different consumer."
      - "R3Q9 — ADOPT the backticked-real-tool-name rule, VALIDATED AGAINST THE LIVE ToolRegistry. A backticked token shaped like a tool must be registered, and raw shell verbs are rejected. Measured breach rate is low here (3 of 200 sampled bodies), but the rule is cheap, machine-checkable, and stops a skill teaching the agent to shell out where a real capability exists."
      - "R3Q10 — REJECT AT WRITE, REPORT ON LOAD. Nothing non-conforming can be created; existing skills are counted at load so conformance is visible and rising as migration proceeds. Deliberately NOT rejecting at load: that would make 408 skills unloadable and effectively empty the catalog on boot."
      - "R3Q11 — length is a SOFT CAP, warn only, above ~200 lines. A long skill is a smell, not an error, and a hard cap would reject a genuinely detailed procedure."
      - "R3Q12 — per-skill TESTS are required for builtin/user skills ONLY. Learned skills rely on the required Verification section instead; mandating a test file per learned skill would have the agent generating 400+ test files nobody runs."
      - "R4Q13 — REQUIRED FRONTMATTER IS name, description, when_to_use. Those three carry meaning and feed retrieval; source/enabled/version are derived and summary/category/tags/author/license are optional. Requiring more would only make the agent invent values to satisfy a validator."
      - "R4Q14 — NO platforms FIELD. Hermes needs it because their skills ship scripts with OS-specific dependencies; our standing rule is that everything runs on all hardware, so the field would either always say all three or quietly license a skill that does not."
      - "R4Q15 — author IS THE HUMAN OPERATOR, following Hermes' credit-the-human convention, even for a synthesised skill. (Implementation note: resolve from owner identity, not a hardcoded name.)"
      - "R4Q16 — version BUMPS ON EVERY CONTENT CHANGE, by whoever writes: patch for an edit, minor for a restructure (the template migration), major for a merge (consolidation). Gives skill_audit a human-readable trail beside its before/after hashes."
      - "R5Q17 — DROP summary. Measured: all 423 learned skills carry one and none equals its description, because summary was generated to compensate for descriptions being unreadable at a glance. A <=60-char description IS that glance and when_to_use carries retrieval, so summary earns nothing and costs a generation pass per skill."
      - "R5Q18 — THE AUTHORING PROMPT TEACHES THE STANDARD; THE VALIDATOR ENFORCES IT. Teach-then-check, not check-only: without the prompt carrying the template and rules, every non-conforming synthesis pays at least one wasted LLM call on a reject-retry."
      - "R5Q19 — ONE MODULE IS THE SOURCE OF TRUTH (rules as constants); the design doc and the authoring prompt cite or derive from it. Three hand-maintained copies of a standard is exactly how a standard rots."
      - "R5Q20 — support-file layout is ENFORCED to scripts/ | references/ | templates/; any other subdirectory is rejected. Gives consolidation the predictable package shape R3Q11 requires, and only 8 of 423 skills carry subdirectories at all."
      - "R6Q21 — summary is removed COMPLETELY in one change: the _summarize_missing boot pass, the summary/summary_source/summary_body_hash columns, and the summary column in skills_fts (which must be rebuilt). Chosen over a staged removal despite the larger blast radius."
      - "R6Q22 — a rejected write returns EVERY violation at once, each naming the rule it broke, so the model fixes all of them in one retry instead of discovering them one call at a time. Deliberately not returning a corrected draft: the platform authoring the fix would make it the author."
      - "R6Q23 — conformance is reported in the autonomic_health brief section, beside skills active/stale/archived and ever-used. One place to read how the catalog is doing."
      - "R6Q24 — THE STANDARD IS VERSIONED and each skill records which version it conformed to. When the standard moves, the conformance report shows the gap and the migration re-runs for the changed rules only — rather than re-validating everything or grandfathering old skills into permanent fragmentation."
      - "R7Q25 — ACCEPTANCE: zero new non-conforming skills, and no new -N duplicate families. The standard exists to stop drift AT THE SOURCE, so it is judged on what gets written from now on — not on how fast the 423-skill backlog migrates, which is D09.3's job. Conformance overall should rise as a consequence."
    notes: null

