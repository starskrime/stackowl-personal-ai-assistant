      cannot fail is worse than no assertion: the intent-class equality test
      passed for a whole slice while the regression in DEBT-24 was live,
      because its harness registered no tool_registry.

  - id: D01.2
    title: "Prompt-cache breakpoints"
    domain: D01
    verdict: MISSING
    track: adopt
    priority: P0
    wave: 1
    order: 4
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d012"
    gap: "Even after D01.1, no markers means no cache."
    depends_on: [D01.1]
    blocks: []
    dedup_target: null
    started: 2026-07-27
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    implement_result:
      date: 2026-07-27
      commits: [daf58a60, 11328aee, 90b30704, f2d811e3]
      pushed: "2026-07-27 — cf280aa3..f2d811e3 to origin/main, on Bakir's explicit approval. Ten commits went up: the five that had been waiting since D01.1, plus the four from this stage."
      ships: "ON. No enable flag — the capability gate makes it inert on every non-Anthropic provider, so the standing rule is satisfied honestly rather than with a setting that defaults off forever."
      four_corrections_the_document_stage_MUST_fold_in:
        1: "The minimum guard is CUMULATIVE, not per-span. The Lifecycle section reads as a per-span check."
        2: "I2 as written cannot be fully satisfied. Anthropic returns one cache_creation_input_tokens per REQUEST, so a positive is never attributable to a span and the learned state can never recover a per-model minimum. The guard defaults to MIN_CACHEABLE_TOKENS=512 with a minimum_tokens override, and on a 4096-floor model some markers will not cache."
        3: "The tools-instability audit is in pipeline/steps/execute.py, NOT the Anthropic provider as the Observability table says. On the Anthropic path it would measure nothing on this deployment."
        4: "Breakpoints ARE reallocated. The Lifecycle section's 'its breakpoint is NOT reallocated' is now false — adopted from Hermes after Bakir's read-Hermes-first instruction."
      two_things_the_design_did_not_have:
        i1_hazard: "complete_with_tools re-marks ONE growing messages list every round, so stale markers accumulate and I1 breaks on the SECOND tool iteration. apply_cache_breakpoints now strips existing markers before placing its four."
        ordering_invariant: "Marking must be the LAST mutation before the wire — it turns a string into a block list, so any later isinstance(content, str) pass silently skips it and the same message goes normalised on one turn and raw on the next. Learned from Hermes' own test suite, which locks it by inspecting source order. Ours holds STRUCTURALLY (per iteration: trim -> mark -> send, and apply_cache_breakpoints returns copies so the loop's list stays permanently unmarked), verified by reading; the OUTCOME is locked by a test asserting markers reach messages.create()."
      mutation_testing_summary: >
        25 mutations across the three modules; 24 died on the first attempt. The
        single survivor was M2 — replacing the cumulative guard with a per-span
        one still passed 20/20, because the cumulative test's system span cleared
        the floor unaided and so could not fail. Exactly the D01.1 trap. A case
        where NEITHER span clears alone but their sum does was added; M2 now dies.
      verified:
        tests: "tests/providers/ 525 passed. tests/pipeline/ 1076 passed = the 1065 baseline plus exactly the 11 new audit tests. tests/skills/test_skill_retrieval.py 9 passed (was 1 failed, DEBT-17)."
        gates: "ruff src/ 46 = DEBT-1 baseline; mypy src/ 78 = DEBT-8 baseline. Zero added — including one mypy error this stage introduced and then fixed (stream()'s dict[str, object] kwargs bag)."
        migration: "0104 applied, then reported 'already applied' on a second run. Schema version 0104."
      no_capability_removed: "Checked explicitly. Every change adds a marker, a reader, a store or a log line. Nothing was disabled, stubbed or deleted to make a check pass."
    cleanup_record:
      date: 2026-07-27
      dedup_target: "null for this item — nothing to resolve."
      what_it_found:
        stream_path_was_marked_but_not_instrumented: >
          THE REAL FIND. stream() routes through the same chokepoint as the three
          create() sites, so its requests DO carry markers — but only
          _record_usage_safe fed the probe store and emitted the
          "[cache] breakpoints: result" line. A streaming deployment would have
          placed markers, had them honoured, and recorded no evidence of it: the
          endpoint would read "never confirmed" forever with nothing to blame.
          Asymmetric instrumentation is what makes a measurement silently blind —
          the exact failure D01.6 exists to prevent. Fixed by extracting ONE
          shared outcome site, _report_cache_outcome(), that both paths call,
          rather than duplicating the block into the stream path where the two
          copies could drift apart again. Pinned by two new tests.
        two_silent_excepts_i_introduced: >
          _cache_read_tokens and _cache_creation_tokens caught (TypeError,
          ValueError) and returned 0 with NO log — a standing-rule violation in
          my own new code, and a nasty one here specifically: an unreadable cache
          field is indistinguishable from an honest cold cache, so "always 0"
          would have had nothing to blame. Both now log at error. Note the D01.6
          sibling _cached_input_tokens has the same shape and is NOT touched —
          out of scope, and it is pre-existing.
      the_phantom_debt_the_design_created_and_this_stage_CLOSES: >
        designs/D01.2.md records "Debt created: misplaced cache_read_input_tokens
        probe in openai_provider.py:138". IT IS NOT MISPLACED and there is no
        debt. Verified against the live config rather than reasoned about: the
        only ENABLED provider, NeraAiRaw, is `protocol: openai` pointed at
        http://llm-gateway.dev.nera.gov:4000/v1 — a LiteLLM gateway, which passes
        an upstream Anthropic model's `cache_read_input_tokens` through verbatim
        on an OpenAI-protocol response. That branch is therefore a LIVE path for
        Bakir's own deployment, not an Anthropic concept leaking into the wrong
        file. D01.2 does not obsolete it either: D01.2's reader is on the
        Anthropic PROTOCOL path, a different code path entirely. Removing it
        would have blinded the only backend that exists here. The design's
        "duplication" framing (contradiction 2 of the brainstorm) was resolved
        the right way for the wrong reason.
      also_confirmed: "No Anthropic provider is configured at all in ~/.stackowl/stackowl.yaml — all four entries are protocol: openai, three disabled. This is the direct evidence for the doc's LIVE HALF UNVERIFIED banner, now checked rather than assumed."
    test_result:
      date: 2026-07-27
      file: "tests/pipeline/test_d012_cache_breakpoints_gateway_integration.py (4 tests)"
      business_requirement: >
        "When my assistant talks to an Anthropic backend, the request it sends is
        marked so the provider bills a long conversation at the cached rate — and
        what the model READS is not changed by that."
      only_the_ai_provider_is_faked: >
        The scanner, the router decision, the pipeline steps, the owl registry,
        SessionPromptStore, CostTracker, CacheProbeStore and the database are all
        real, per the standing gateway-integration rule.
      THE_FINDING_THAT_JUSTIFIES_THE_STAGE: >
        THE PIPELINE'S ANSWER PATH STREAMS. The first run of this file called
        messages.create() ZERO times and messages.stream() once — the fake had no
        stream() and blew up. Every provider unit test in this item drives
        create(), so the whole marker layer was proven on a path a real
        interactive turn does not take. It also means the cleanup stage's finding
        was not a tidiness fix at all: for that slice the probe store was fed ONLY
        from _record_usage_safe, i.e. never on the path a real turn actually uses.
        Caching would have worked and recorded nothing, forever, on the live path.
        Neither the unit tests nor the design would have surfaced this; driving
        the real gateway did — which is exactly what the rule is for.
      the_assertion_that_does_the_work: >
        NOT "markers are present" — that passes on almost anything. It is that the
        text the model reads is byte-identical to the frozen prompt D01.1 stored
        in the database. Marking rewrites the system prompt from a string into a
        block list and rewrites message contents; getting that wrong would
        silently change the model's input to buy a cache entry. Mutation G2
        (truncate the text when marking a string block) kills exactly that test
        and nothing else.
      mutations:
        G1: "capability off -> stream path sends unmarked. 2 tests die."
        G2: "truncate text when marking a string block. 1 test dies — the byte-identity one."
        G3: "persist zeros too (break I5). 2 tests die."
        G4: "stream path stops recording the probe. 2 tests die."
