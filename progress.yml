# KNOWN DEBT — tracked, not ignored (feedback_no_skipping_preexisting_fails)
# ---------------------------------------------------------------------------
known_debt:
  - id: DEBT-1
    found: 2026-07-25
    what: "46 pre-existing ruff errors in src/, in files unrelated to any current item."
    evidence: "`uv run ruff check src/` -> Found 46 errors. `ruff check src/stackowl/providers/cost_tracker.py` -> All checks passed."
    decision: "NOT fixed during D01.6 — unrelated files, and fixing them mid-item violates minimal-diffs. Scheduled as its own cleanup pass."
    status: open
  - id: DEBT-6
    found: 2026-07-25
    what: "Empty completions from NeraAiRaw — the model emits reasoning but no visible content."
    evidence: "Log, repeatedly: '[openai] complete: empty after think-strip — retrying once with a varied prompt' then 'still empty after varied retry — returning empty for the downstream floor'."
    impact: "Every occurrence costs a full paid call and yields nothing. Seen 3+ times in a 5-message conversation."
    decision: "Tracked. Needs its own root-cause pass — likely a reasoning model spending max_tokens on reasoning_content."
    status: open
  - id: DEBT-7
    found: 2026-07-25
    what: "Budget alerting can NEVER fire — 'budget_80pct_alert' and 'budget_exceeded' are subscribed with no publisher."
    evidence: "Boot wiring audit: 'DANGLING event subscription ... subscribed but NO module declares it as a publisher, so the subscriber will NEVER fire.'"
    impact: "A conversation that cost $2.85 produced no budget signal. Directly relevant to D01.6's purpose."
    decision: "Tracked. Small fix; fold into a D01 cleanup pass."
    status: open
  - id: DEBT-5
    found: 2026-07-25
    what: "progress.yml was pushed to main in an INVALID-YAML state for one commit (01c53d78)."
    evidence: "A scripted edit replaced a `remaining:` key with `remaining: []` while its list items were still present, orphaning them. yaml.safe_load raised ParserError at line 728. Repaired in the next commit."
    root_cause: "The validation step ran AFTER the write and its failure did not block the commit — the script printed a traceback but `git commit` in the same shell line ran regardless."
    decision: >
      FIXED PROCESS: progress.yml must be validated BEFORE the commit, and the commit must not
      run when validation fails. Use `uv run python -c \"import yaml; yaml.safe_load(open('progress.yml'))\" && git commit ...`
      so a parse failure short-circuits the chain.
    status: closed
  - id: DEBT-3
    found: 2026-07-25
    what: "tests/commands/test_config_meta.py::test_config_declares_all_subcommands fails on main, unrelated to any current item."
    evidence: "Fails IDENTICALLY with D01.6 changes stashed and unstashed — verified by stash/run/pop. Not caused by this work."
    decision: "Tracked, not fixed during D01.6. Needs its own root-cause pass."
    status: open
  - id: DEBT-4
    found: 2026-07-25
    what: "tests/commands/test_cost_meta.py::test_cost_declares_only_privacy_subcommand is a CHANGE-DETECTOR test."
    evidence: "assert names == {'privacy'} — freezes an enumeration, so it breaks whenever a subcommand is legitimately added. It broke on /cost turns, a correct feature."
    decision: >
      NOT autonomously patched. Bakir's standing rule is that the AI must STOP and inform rather
      than silently fix a failing test. Recommendation on the table: convert it to the invariant
      it was reaching for — every declared subcommand has a summary, and privacy is present —
      instead of asserting the exact set. This is map item D18.6 (change-detector test ban)
      appearing in our own tree.
    status: resolved
    resolution: >
      2026-07-25, approved by Bakir. Converted to the invariant it was reaching for:
      privacy must stay reachable, every declared subcommand must have a summary, and
      no two may share a name. The frozen set assertion is gone. 369 tests pass.
  - id: DEBT-2
    found: 2026-07-25
    what: "Two stale paths existed in the first draft of designs/D01.6.md: wrong DB location and a test file that does not exist."
    evidence: "Live DB is ~/.stackowl/workspace/stackowl.db (StackowlHome.workspace()); sqlite3 CLI is not installed; the suite is tests/providers/test_cost_tracker_turn_totals.py."
    decision: "Corrected in the doc, with the correction left visible as a worked example of DOC_STANDARD rule 3."
    status: closed

