      why_unconditional_was_forced: >
        A frozen prompt cannot express a per-turn conditional at all. A session
        opening on a conversational turn would have carried a protocol-less
        prompt for its whole life, losing tool use until the next rollover.
      pinned_by: >
        tests/pipeline/test_assemble_skill_catalogue.py —
        test_the_catalogue_is_present_on_a_tool_free_turn now asserts WHOLE-prompt
        equality across intent classes, which it previously declined to assert.
        NOTE that assertion was vacuous when first added: the harness registered
