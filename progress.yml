      document:   done
    doc: "docs/reference-mapping/designs/D05.6.md"
    doc_last_verified: "2026-08-04"
    decisions:
      - date: 2026-08-04
        stage: brainstorm
        by: Bakir
        round: "5 questions over 3 rounds. One was re-asked with REAL text from our own tree after Bakir said he did not understand the abstract version — the concrete form got a clear answer immediately."
        THE_PREMISE_MEASURED: >
          40 of 77 schemas name another tool; 78 references total, 42 cross-group.
          Filtering the ones that CANNOT dangle — target is in the never-evicted
          base set, or referrer and target share a capability so they vanish
          together — leaves 31 REAL exposures across 22 referrers and 14 targets.
          Targets include edit, git, process, delegate_task, send_message,
          clarify, transcripts, session_search — all evictable by the budget/cap
          or absent from a narrow owl profile.
          Worked example: undo_write is ALWAYS presented (base set) and its
          description says it restores what edit/patch changed — but `edit` is
          NOT in the base set, so on a narrow profile the model is told to rely
          on a tool it cannot see.
        THIS_ITEM_GOT_WORSE_BECAUSE_OF_D05_3: >
          Worth stating: before D05.3 every registered tool was always presented,
          so a cross-reference was always valid and this was theoretical. Gating
          made tools genuinely disappear. Of the 4 references to a capability-
          gated tool, all 4 are browser->browser and safe — and browser_vision ->
          browser_navigate is safe ONLY because I gated browser_vision in D05.3
          after a test caught it. Left ungated it would have been the first real
          dangling reference this item exists to prevent.
        what_hermes_actually_does: >
          THE RULE IS MUCH STRONGER THAN THE MECHANISM, and the map repeats the
          rule. AGENTS.md states a hard prohibition ("must not mention tools from
          other toolsets by name... causing the model to hallucinate calls to
          non-existent tools") and says cross-refs are "added dynamically in
          get_tool_definitions()". The actual enforcement is ONE hardcoded
          string-replace for ONE tool — model_tools.py strips the literal
          " For simple information retrieval, prefer web_search or web_extract
          (faster, cheaper)." from browser_navigate when those tools are absent —
          plus one test on x_search. It breaks the moment anyone rewords the
          sentence.
        answers:
          mechanism: "STRIP AT PRESENTATION TIME. to_provider_schema already knows exactly which tools are presented, so a reference is removed only when the target is genuinely absent — no false positives, and the hint survives whenever it is valid."
          same_capability_exempt: "YES. If browser is down, browser_dialog and browser_snapshot are BOTH absent, so the reference can never dangle. Exempting them keeps useful in-toolset guidance."
          prior_art: "ADOPT THE RULE, BUILD A REAL MECHANISM. Their policy is right; their implementation is a brittle per-tool patch. We have the presentation seam they lack, so it can be generic."
          strip_method: >
            SENTENCE-LEVEL REMOVAL — drop any sentence naming an absent tool.
            Chosen with the cost stated and accepted: read_logs' ANTI-LANE
            sentence also carries a still-valid "durable facts (use memory)"
            hint, and that half is lost with it. The alternatives (declare hints
            structurally per target; swap the name for a generic phrase) are
            lossless but need per-tool work across 22 tools.
          placement: "INSIDE to_provider_schema, BEFORE the D05.2 memo stores the array — so the memo caches the already-stripped version and the array stays byte-stable for the session. A capability flip already invalidates the memo, so a returning tool restores its hints automatically. No new invalidation path."
        note_on_asking: >
          The strip-method question was first asked abstractly ("deleting the name
          mid-sentence yields garbage") and Bakir answered "I did not understand".
          Re-asked with the REAL read_logs sentence and the exact before/after for
          each option, it was answered immediately. Recording because the fix was
          to show our own text, not to add words.
      - date: 2026-08-04
        stage: architect+implement+cleanup+test+validate+document
        by: Claude
        what_shipped:
          module: "NEW tools/_infra/cross_refs.py::strip_dangling_references — sentence-level removal driven by the presented set."
          seam: "to_provider_schema had THREE separate `return [_schema_for(t) ...]` exits; they now share one _emit(), because the strip needs the FINAL presented set, which is not known until the list is complete."
          placement: "Inside to_provider_schema, BEFORE D05.2's memo stores the array — so descriptions are session-stable, not per-turn. A capability flip already invalidates that memo, so a returning tool regains its hints with NO new invalidation path."
          exemptions: "(1) only names in the CATALOG count — memory/process/wait/git/edit are all real tool names AND ordinary English words; (2) same-capability targets are exempt, since they vanish together."
        A_TEST_FOUND_A_FLAW_IN_THE_CHOSEN_STRATEGY: >
          Sentence-level removal was chosen with its bluntness accepted (read_logs
          loses a still-valid "use memory" half). The test found a WORSE case the
          decision had not anticipated: undo_write opens "Undo the most recent
          file write/edit by restoring the file's pre-image", and \bedit\b
          matches inside "write/edit" — so the blunt rule deleted the tool's own
          DEFINITION, leaving a schema that described only its 'token' argument
          and never said what the tool does.
          RULE ADDED: the first sentence is never dropped. It states what the tool
          IS; later sentences elaborate or route. The trade is explicit — a first
          sentence naming an absent tool in passing keeps that word, which is
          prose rather than an instruction to call it, and far less harmful than a
          schema that no longer says what the tool does.
          My TEST assertion was then wrong, not the code: it asserted "edit" not
          in the description, when "write/edit" legitimately survives. Corrected
          to assert the ROUTING sentence is gone and the DEFINITION remains.
        mutations:
          M8: "stripper returns the description unchanged -> fails 4 tests."
          M9: "drop the same-capability exemption -> fails exactly the exemption test."
        tests: "tests/tools/test_cross_refs.py — 12, including an end-to-end case through the REAL registry rather than only the pure function."
        suites_green: "209 across cross_refs, discovery, all presentation slices, the D05.2/D05.3 wiring suites and infra. ruff src 46 / mypy 78 unchanged."
        live_validation: >
          ./start.sh (pid 384003). 77 tools discovered in both processes; 421
          skills loaded; 2 learned tools registered.
          TWO ERRORs in the log, and they are NOT from this item: "dream-*:
          handler timed out" is DEBT-19 (the dream worker exceeds the scheduler's
          20-minute handler timeout), which fired 48 times in yesterday's rotated
          log before any of this work. Checked rather than claimed clean.
        not_adopted_registration_lint: >
          Considered and rejected as a REPLACEMENT: StackOwl already has a
          _lint_description seam that warns on thin descriptions, so a
          cross-reference lint would fit there. But registration cannot know what
          will be PRESENTED, so it would flag all 31 references forever —
          including the ones that are correct whenever their target is present.
        standing_liability: >
          A future tool named after a common English word (`list`, `run`) would
          strip innocent prose. The catalog check bounds the damage to REGISTERED
          names — edit/process/wait/memory/git are already both — but the risk
          grows with the catalog. Recorded as a failure-mode row, not solved.
