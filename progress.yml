    blocked_on: "INTERACTIVE TRAFFIC. All 64 measured turns are goal (background) lanes; the interactive path is unmeasured. Bakir chose to measure it before deciding rather than close on background data alone."
    doc: null
    doc_last_verified: null
    decisions:
      - date: 2026-08-04
        stage: brainstorm
        by: Bakir
        round: "2 questions, 1 round. Most of the item was settled by MEASURING rather than asking — the map's premise did not survive contact with the numbers."
        THE_MAPS_ENTRY_IS_WRONG_ON_BOTH_SIDES: >
          It reads: "Both register 75 tools. The difference is entirely in
          exposure discipline: Hermes ships ~40 by default and gates the rest;
          StackOwl presents up to 150."
          MEASURED:
            * Hermes' CLI default set (_HERMES_CORE_TOOLS) is 54 tools, not ~40.
            * StackOwl registers 77, not 75.
            * Our CONFIGURED cap is 40 (OrchestratorSettings.tool_count_cap).
              The 150 is HARD_TOOL_COUNT_CAP — a pathological-catalog backstop
              whose own comment says it "should sit comfortably above any real
              toolset, not below it". The map compares OUR BACKSTOP against
              THEIR DEFAULT.
            * Real presentation by profile, measured through to_provider_schema:
              25-40 tools / 7,105-8,889 tokens.
            * LIVE production, from the tools_count field already in the logs:
              64 turns, avg 4.0 tools, max 24. Distribution: 3 x32, 4 x23,
              5 x4, 6 x2, 7 x2, 24 x1.
          SO THE GAP IS INVERTED: we present FEWER tools than Hermes, not more.
          Their default is 54; our live average is 4.
        why_the_map_could_be_this_stale: >
          The entry predates three items that all moved exposure: D05.2 (stable
          ordering + session memo), D05.3 (capability gating — 25 browser tools
          vanish on a box with no browser) and D05.6 (cross-reference stripping).
          A number in a map is a measurement with an expiry date.
        answers:
          verdict: "MEASURE THE INTERACTIVE PATH FIRST, then decide. Bakir chose this over closing as no_change_needed — all 64 measured turns are GOAL lanes, and closing on background-lane data alone would repeat exactly the blind spot D01.3 recorded about itself."
          the_150_backstop: "LEAVE IT. Its own comment says it is 'a backstop against a pathological catalog, not a shaping lever'. It was raised from 40 to 150 in July precisely because the catalog outgrew 40 and real tools were being silently trimmed. Nothing reaches it in practice."
        THE_OPPOSITE_QUESTION_now_open: >
          If we present an average of 4 tools from a 77-tool catalog, the risk
          worth investigating is UNDER-presentation, not over-presentation. That
          may be correct (narrow owl profiles by design, plus tool_search overflow
          as the escape hatch) or it may be starving the model. It is a DIFFERENT
          question from the one the map wrote, and is deliberately not folded in.
        the_instrument_already_exists: >
          No new telemetry is needed — `tools_count` is already logged per turn by
          execute.py's context-budget line. The blocker is TRAFFIC, not
          instrumentation. Same blocker as D05.2's and D05.3's live acceptance
          tests: all three settle from ordinary interactive use.
        what_settles_it: >
          jq -r 'select(.fields.tools_count) | "\(.fields.tools_count)\t\(.session_key)"'
            ~/.stackowl/logs/stackowl.jsonl | grep -v $'\tgoal-' | grep -v $'\tincident-'
          Non-empty output = interactive turns measured. Compare the distribution
          against Hermes' 54-tool default and against our 40 cap.
    changes: []
    notes: null

