          migration: "0097 applied; second run reports already-applied; schema at 0097. 110037 rows preserved, all three secondary indexes recreated, conversation_summary now permitted."
          lint: "ruff clean on all touched files; src/ total 46 = DEBT-1 baseline, zero added."
