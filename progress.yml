          overlapping three existing ones — recreating X2, the duplication this
          item exists to resolve. Recorded as invariant I6 in the doc.
        rejected_reusing_ToolOutcomeMiner: >
          learning/tool_outcome_miner.py already scans these outcomes daily and
          writes tool_heuristics — but it buckets by (tool, failure_label) and
          DISCARDS o.owl_name, which is sitting on the outcome it iterates
          (tool_outcome_miner.py:122). Adding owl to its bucket key was considered
          and rejected: its read surface (find_for_tool, list_all) is keyed on tool
          by design, and its question is "does this tool tend to succeed" (global,
          predictive) not "does THIS OWL reach for it" (per-owl, descriptive).
        two_parameter_traps_for_implement: >
          list_successful_with_sequence defaults must NOT be inherited blindly.
          (1) min_quality=0.75 is a SKILL-SYNTHESIS bar — stricter than "this owl
          uses this tool". (2) limit=500 with ORDER BY captured_at ASC returns the
          OLDEST 500 in the window, which is the wrong end for a recency-weighted
          signal. Either narrow the window so the limit cannot bind, or add an
          owl-scoped DESC variant — do not reuse the default and call it recent.
        DEFECT_B_FOUND_IN_ARCHITECT_the_budget_moves_too: >
          THE FOURTH FINDING, AND THE ONLY ONE THAT MADE THE ITEM BIGGER. Every
          prior analysis (mine, the brainstorm, D01.3's doc) named ONE cause: the
          request_text ordering. Reading the call site found a second, independent
          one:
            execute.py:1100 — _fixed_cost = est(system_prompt) + est(EVERY
            history message), recomputed every turn
            context_budget.py:41 — tool_budget_tokens = window - fixed_cost
          History GROWS every turn, so the tool-token budget SHRINKS monotonically
          and fit_items admits fewer candidates — EVEN WITH A PERFECTLY STABLE
          ORDERING. When history is trimmed/compacted the budget recovers and the
          tool returns.
          THIS IS THE MISSING EXPLANATION FOR D01.3'S COUNT OSCILLATION. 4 of 5
          pairs oscillated in tool COUNT (5->4->5->5->5, 4->4->3->4). An ordering
          defect reshuffles a fixed-size array; it cannot change its LENGTH.
          Defect B can. Fixing only the ordering would have shipped an item that
          looked correct and measured unchanged.
        rejected_removing_history_from_fixed_cost: >
          Smaller diff, and WRONG. The budget exists to stop a small-window model
          being handed more schemas than it has room for, and on turn 40 the
          history IS the room. Removing it yields a budget that is stable and
          wrong precisely when the window is tightest — satisfying the letter of
          I3 while hollowing it out. Memoize the FIT instead: same measurement,
          taken once, at the session's first turn where D01.1 already freezes and
          D01.4 already invalidates.
        memo_key_and_the_three_things_it_must_carry: >
          (session_key, owl, protocol, window, hydrated-fingerprint).
            * protocol + window because build_tool_schemas is deliberately
              re-invoked PER ESCALATION TIER — execute.py:1113 states the tiers
              "can speak different wire protocols and have different context
              windows". A session-only key would hand an Anthropic-shaped array
              to an OpenAI-protocol tier.
            * hydrated because FX-07 promotes a tool_search hit into the NEXT
              turn's schema (tool_search.py:158). Under a naive memo that
              promotion SILENTLY STOPS WORKING — the model searches, finds the
              tool, and never receives it.
          NOT memoized: the restrict_to path (per-task by construction, already
          deterministic, has neither defect) and the depth>0 spawn exclusion
          (a property of the TURN — caching it would pin a delegated child's
          exclusion onto its parent's lane).
        I1_vs_I2_collision_resolved_in_favour_of_I2: >
          Stated rather than resolved by omission. A hydration is a mid-session
          array change — exactly what I1 forbids — so it invalidates the memo:
          one cache miss at the moment the model discovers a tool it needs. Right
          trade on three counts: BOUNDED (the hydrated set is monotonic and grows
          only on an explicit tool_search, so invalidations = discoveries, not
          turns); CAUSED (the prefix changes because the toolset genuinely
          changed, which is what an invalidation is supposed to mean); and the
          alternative is a permanently broken bridge. Hermes avoids the collision
          only because their bridge DISPATCHES (tool_call) instead of promoting.
          Ours promotes, which is better for the model, and costs one rebuild.
