  - id: DEBT-39
    found: 2026-08-05
    what: "FailureCause.PAYLOAD_TOO_LARGE prescribes COMPRESS, and nothing in the process can perform it."
    evidence: >
      D02.6 wired FALLBACK_MODEL and ROTATE_CREDENTIAL into LLMGateway's tier
      cascade (both are performable: the next tier is a different model behind a
      different credential). COMPRESS has no equivalent — climbing a tier does not
      make the payload smaller. Pinned deliberately by
      test_a_413_does_not_cascade_because_nothing_can_compress_yet.
    why_it_matters: >
      We trim proactively before every call, so a 413 means the proactive trim was
      WRONG about the limit — exactly the case where a reactive shrink-and-retry
      would save the turn. Today a 413 is named correctly and then surfaces as a
      failure. Deliberately not faked: an actuator that pretends to compress and
      does not is worse than an honest gap.
      Zero 413s in 15 days of logs, so this is not urgent — it is a known,
      un-actuated rung, recorded so nobody reads the taxonomy and assumes it works.
    status: RESOLVED 2026-08-05 — the actuator was BUILT rather than deferred.
    resolution: >
      Bakir, same day, unprompted: "one of the biggest rules on each implementation
      is Agentic Self Healing. It is a must to remember and always be as guide
      star." Filing an un-actuated recovery rung as debt is exactly what that
      forbids — a taxonomy that names a treatment it cannot administer.
      Built at ModelProvider._resilient_round (base.py) — the ONE bracket all 13
      remote-round call sites in all 3 providers already share, so one seam covers
      every round. On PAYLOAD_TOO_LARGE the caller's `shrink(attempt)` rebuilds the
      round against a halved context; bounded at 3 attempts; every attempt logged
      at WARNING; returns None to surface honestly when there is nothing to give.
      HEALS rather than recovers: note_payload_limit() records the working size and
      _effective_context_budget() applies it to later calls, so the same rejection
      is not re-earned every round. Learned ceiling only ever moves DOWN, and is
      in-memory so a restart re-probes instead of inheriting a pessimistic limit.
      TWO BUGS THE WIRING TEST CAUGHT that 9 green unit tests did not:
        1. Shrinking was relative to the CONFIGURED budget. Halving a 1,000,000
           ceiling does nothing to a 100,000-char payload — the trimmer is already
           under budget, so every "smaller retry" was byte-identical. Now relative
           to total_content_chars(messages), the real size on the wire.
        2. `if shrunk == messages: return None` was ALWAYS true — the trimmer
           elides IN PLACE and returns the same list object. That guard silently
           disabled the entire actuator. Now compares SIZE, not identity.
      HONEST LIMIT, pinned by its own test: the trimmer elides tool OBSERVATIONS
      only, never the system prompt, the first user message, or the two most
      recent. A single enormous user message therefore cannot be compressed at
      all, and the actuator surfaces the error rather than retrying identically.
      COMPRESS serves a long tool loop; it does not serve one huge message.
      Verified: 12 new tests (9 unit + 3 wiring), 589 passed across tests/providers,
      ruff 46 / mypy 78 held.

