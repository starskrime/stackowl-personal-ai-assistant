  - id: ESC-6-trust-fencing-guard-outlives-its-data-path
    RESOLVED: "RESOLVED 2026-08-14 — Bakir chose RELOCATE THE FENCE TO THE LIVE PATHS, over both keep-as-is and remove. The invariant survives; its location changes. neutralize() + trust labelling move onto the memory tool renders the model actually reads (_get at memory.py:439, _format_hits at :487, _forget at :468), and retrieve()'s renderer goes with the fact pipeline. The journey guard is KEPT and repointed at the tool path rather than deleted. Decided with the corrected measurement in hand: the fenced path is dead AND no longer reaches the prompt, while memory(get) renders stored content raw and list_staged filters on status only — so the 10 webpage rows in staged_facts are reachable unfenced TODAY. Narrow (needs an id-prefix lookup) but live, and exactly the threat model the fence exists for."
    raised: 2026-08-14
    blocks: "D08.2 seam 3 pass 4 — the fact_promoter removal, and only that."
    question: >-
      When fact_promoter goes and NOTHING can write to committed_facts, should recall''s
      trust-fencing logic and its regression guard survive?
    why_escalated: >-
      It is a SECURITY property, and the answer turns on what keeping committed_facts was
      meant to preserve — which is Bakir''s intent, not something the code can settle.
    what_was_measured: >-
      tests/journeys/test_memory_governance_journey.py is the end-to-end guard for the
      trust chain: an untrusted webpage fact must recall FENCED
      (<memory_reference trust="untrusted">) and neutralized, never bare and
      trusted-looking, and the ordered regions must not let a forged trust="trusted"
      payload sit where a real trusted fact would. The fencing itself is LIVE code in
      sqlite_bridge.recall() and runs on every `memory` search. But it reads
      committed_facts, empty since migration 0112 — and fact_promoter is the ONLY thing
      that could ever put a row there. Remove it and the fencing becomes permanently
      unreachable-with-data, and the guard becomes untestable through its normal path.
    measured_correction: >-
      CORRECTION 2026-08-14 — THIS ESCALATION'S OWN what_was_measured IS WRONG on the
      load-bearing point, found by tracing the path rather than re-reading the note. It says
      the fencing "is LIVE code in sqlite_bridge.recall() and runs on every `memory` search".
      Neither half holds. The fence is not in recall() — it is in retrieve()
      (sqlite_bridge.py:150-180), a DIFFERENT method: recall() returns records, retrieve()
      renders them into the three trust regions. And the `memory` tool does NOT go through it:
      memory.py:365 calls bridge.recall() and renders hits with _format_hits (memory.py:487),
      which emits raw content with NO fence, NO neutralize() and NO trust tier. A `memory`
      search is precisely the path the fence does not cover.
      AND THE FENCED PATH NO LONGER REACHES THE PROMPT EITHER, which the options were written
      without. retrieve() is called once, from classify.py:629, and its output goes into
      memory_context — which D01.1 removed from the system prompt (assemble.py:354 says so:
      "still computed by classify and still read by execute for its grounding haystacks; it
      simply stops being PROMPT text"). Its ONLY live reader is
      _clarify_question_already_answered at execute.py:2613, a deterministic substring check.
      So the fence today defends a grounding check, not the model's context.
      WHICH INVERTS THE RISK THE OPTIONS WERE WEIGHING. The worry behind A and C is that facts
      might return and find the surface unprotected. Measured, the asymmetry already exists and
      points the other way: the GUARDED path (retrieve) is the dead one, and the LIVE path (the
      `memory` tool, a registered model-facing tool) is the unfenced one. If anything ever
      writes committed_facts again, the tool renders untrusted webpage content raw into the
      model's context while the fenced renderer sits on a channel that no longer reaches the
      prompt. That is failure mode 1 — an actuator wired on only some paths — and it is latent
      rather than live ONLY because the store is empty.
      NOT A LIVE VULNERABILITY TODAY, measured on the live database 2026-08-14: committed_facts
      0 rows AND committed_facts_fts 0 rows, so recall() can only return [], retrieve() returns
      the empty string at its no-matches branch, and the tool's search answers from curated
      memory alone. Nothing is rendered unfenced right now.
      WHAT THIS DOES TO THE OPTIONS: it does not decide the question — that is still Bakir's
      intent about what keeping committed_facts was for — but B gets cheaper (the fencing
      protects a grounding haystack, not the prompt) and A/C get more expensive than stated,
      because keeping the fence WITHOUT also fencing the tool's render buys a protection the
      one live reader bypasses. If the answer is A or C, the honest version routes _format_hits
      through the same neutralize()+trust rendering, so there is one rule rather than two.
    the_tension: >-
      R1Q2 deliberately KEPT committed_facts and recall — "a table that exists and returns
      nothing is honest while a missing one errors at every call site". That argues the
      surface is retained on purpose, and a retained security surface arguably keeps its
      guard. Against that: a guard that can only be exercised by INSERTing directly into
      the table, because no production path can, is testing a museum piece.
    options:
      - "A. Keep the guard, repoint its setup to insert into committed_facts directly. Preserves the regression guard for a retained surface; costs a test that documents its own artificiality."
      - "B. Remove the guard with the pipeline, and remove recall's fencing too — if no data can arrive, the fencing is dead code and keeping it implies a protection that never runs."
      - "C. Keep recall's fencing (cheap, harmless, correct if facts ever return) but drop the end-to-end journey, accepting the surface is unguarded until something writes facts again."
    recommendation: >-
      A. The fencing is the kind of thing that gets quietly broken during a later refactor
      and noticed only when it matters, and the cost of keeping one artificial-but-honest
      test is small. B is defensible only if the intent is that facts never return; that is
      exactly what the loop cannot know.
    note: >-
      Pass 4 is otherwise ready. 19 test files, ~75 tests. The removal is atomic ONLY if
      the survivors are not repointed first — repointing them while the promoter still
      exists makes it stageable and keeps the tree green throughout, which is the plan
      either way.

  - id: ESC-5-db-reindex-memory-cli
    RESOLVED: "RESOLVED 2026-08-14 — Bakir chose REPOINT AT LESSONS, over remove and over keep-as-is. `db reindex-memory` stays a user-facing command; what it reindexes changes. The committed_facts re-embed goes (0 rows, no writers, and its target store is being removed), and the command becomes the way to re-embed the 3,680 lessons after an embedding-model change. SEQUENCING NOTE, raised rather than reconciled: this answer depends on the SQLite+numpy lessons store that does not exist yet, while Bakir sequenced ESC-5/6 and pass 4 BEFORE the LanceDB removal. So it stages in two: strip the committed_facts re-embed now — the half that unblocks dream_worker_helpers — and land the lessons repoint with the new store."
