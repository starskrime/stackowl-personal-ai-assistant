    - 'SEQUENCE THAT WORKS, learned from the failed attempt: the modules are deletable in dependency order (fact_reinforcer has 0 importers, recall_ranker 1, entity_extractor 2, fact_extractor 2, contradiction_detector 4, conversation_miner 4, trust 8, fact_promoter 9), but MemoryBridge is the hard part - it reaches 10+ files outside memory/. Do MemoryBridge''s callers FIRST, then the modules, then the tables. Take a DB backup before the data step; one was already taken at ~/.stackowl/backups/pre-memory-removal-20260809-025304.db.'
    - 'SLICES 1-4 VERIFIED LIVE 2026-08-09 03:17 UTC, on the running platform rather than in tests: ~/.stackowl/memory/{USER.md,secretary.md} created; a permanent write accepted and reported 4% - 56/1,375 chars; an owl write accepted at 2% - 61/2,200; a TRANSIENT write REFUSED with the explanatory message (the stale-date failure, refused at the boundary); both snapshots returned their content. Restart clean, 0 errors. Two real entries were written in the process and left in place because they are true and useful (''prefers root-cause fixes over patches'', ''Telegram replies must stay under 2048 tokens'') - they are plain text and the operator can edit or delete them, which is the point of it being a file.'
    - 'ACCEPTANCE STATUS: 3 of 4 met. Both files exist with written content (yes); the write rate is bounded by the BUDGET rather than a number (yes); the old 14,400/day path is gone (yes, extraction is retired in design and the writer no longer targets the store). Outstanding: the assembled prompt DEMONSTRABLY carrying them, which needs a real turn through the pipeline - deliberately not asserted from the code path, since asserting the code path is exactly how D01.1 shipped a reader with no writer.'
    - 'OBSERVABILITY added 2026-08-09 to unblock the Kuzu/LanceDB question without waiting on the operator: LessonsIndex.search''s exit log promoted from debug to info with n_hits. lessons.lance is 221MB whose write side was visible and read side was not. Cost measured first - ONE caller (pipeline/steps/classify.py:489), once per turn, ~910 turns/24h against 21,632 memory lines already written daily. Takes effect at the next restart.'
    changes:
    - 'FOUR PRE-EXISTING REDS IN tests/journeys/test_memory_fix_guards.py FIXED (2026-08-14), none of them caused here: three from D08.1 making durability required and retargeting /memory at curated memory, one from D01.1 removing memory_context from the prompt. The file is 5 passed, and ruff-clean; src baseline held at 39. Repointed rather than deleted, one at a time: the confirmation string "Remembered" -> "Saved."; both scripted memory(add) calls given durability: permanent; the two persistence assertions moved from committed_facts to CuratedMemory().entries(USER_TARGET), where the system prompt actually reads; and guard B''s FTS-fallback assertion moved to CuratedMemory.search(), since its guarantee — a remembered thing can be found again — is live there while the committed_facts read path has had no writer since migration 0112. The polluting marker was also replaced with "TEST-FIXTURE-DO-NOT-TRUST alpha-quebec-7" so any future leak into the real profile is obvious on sight.'
    - 'slice 1 (2026-08-08) - memory/curated.py: two files, hard budgets (1,375 user / 2,200 owl), durability required and stored, refuse-and-consolidate at capacity bounded per turn, frozen snapshot per incarnation. 34 tests.'
    - 'slice 2 (2026-08-08) - the EXISTING `memory` tool retargeted: add/replace/remove write the curated files, search/get/forget still read the archive. durability required with no ''transient'' offered. Every write scanned by the skill scanner via a new scan_text() extracted from scan_file() rather than a second pattern list. 16 tests. Fixed 6 reds, two of which were my own unnoticed D10.2 regression.'
    - slice 3 (2026-08-08) - assemble injects two labelled blocks from a frozen snapshot; user_profile.py DELETED rather than left as a shim. Its test was replaced by one that goes through the real writer - the old one wrote USER.md itself and then asserted the reader found it, which is how D01.1's reader-with-no-writer passed continuously.
    - slice 4 (2026-08-08) - the nudge (D08.3, absorbed). Rides volatile_turn_context, whose own docstring names it the seam for per-turn facts; it cannot live in the system prompt because D01.1 froze the whole prompt per incarnation. Per-lane, in-process, resets on write; a restart under-nudges, which is the safe direction.
    - 'slices 1-4 VERIFIED LIVE 2026-08-09: both files created, budgets reported, a transient write REFUSED, snapshots correct, restart clean with 0 errors.'
    - 'stage A of slice 5 (2026-08-09) - the conversation boundary stops nudging the extractor. RolloverSummaryHandler''s ''READ THIS BEFORE CHANGING IT'' docstring is what stopped this destroying a capability: it did TWO things, and the narrative artifact (''the part the miner does not produce'') was never duplicated and survives. Three tests survived too - they asserted the identity-vs-lane scoping through mine_session''s argument, but that resolution still decides the task record''s owner, so they now assert it against tasks.owner_id rather than being deleted with the miner.'
    - 'REMAINING on slice 5: the miner and extractor modules, the dream-worker phases, the data purge, then the tri-store and its 10+ callers. Being cut SEAM BY SEAM after a module-list deletion produced 140 errors across 45 files; stage A touched five.'
    - stage B of slice 5 (2026-08-09) - fact_extractor (306) and conversation_miner (413) DELETED, the mining phase and its budget helper removed from the dream worker, wiring dropped from MemoryAssembly. ruff 39 / mypy 78 held exactly; 811 -> 809 source files.
    - 'stage B removed ~41 tests with the capability they covered, each checked first. TWO that looked removable were kept instead: cross-channel identity is covered by tests/tenancy/test_identity.py and six others, so only journey (b) went; and the extractor cost guard was NARROWED to the entity extractor rather than deleted, because ''no extractor may request powerful'' still holds for what remains.'
    - 'stage B: the owner-scope CI guard then caught MY OWN code. Trimming its now-stale conversation_miner allowlist entries exposed three unscoped queries I had written earlier the same day - two in the autonomic_health brief (skills, task_outcomes) and one UPDATE in cost_backfill. All three now carry an owner_id predicate. On a multi-tenant install that UPDATE would have rewritten every principal''s cost history, and ''it only runs once'' is not a property of the SQL.'
    - 'REMAINING on slice 5: fact_promoter/contradiction_detector/pruner and their dream-worker phases, the data purge, then the tri-store and its 10+ callers. Seam-by-seam is working - stage A touched 5 files, stage B held both baselines, against 140 errors across 45 files for the module-list attempt.'
    - 'stage C part 1 (2026-08-09) - /staged DELETED (command + its 7 tests + registration). Its whole purpose was reviewing a queue of STAGED facts; extraction is retired so the queue is permanently empty, and a command that can only report ''nothing here'' is worse than none because it implies the pipeline behind it still works. staged_helpers SURVIVES for now: /memory still uses it until that retarget.'
    - 'stage C part 2 NOT DONE and deliberately stopped: the channel approve/reject callbacks are wired INSIDE the same orchestrator try-blocks as consent and clarify. Breaking that breaks consent buttons on Telegram, Slack and Discord. It needs care and a dedicated pass, not a session tail.'
    - 'found while running the commands suite: tests/commands/test_config_meta.py had been RED since 2026-07-25 - `detect-timezone` was added to ConfigCommand without updating the expected-subcommand set. Not mine (0 commits in 20h touch either file) but fixed, same class as the /skill meta drift.'
    - 'EXTRACTION CONFIRMED DEAD IN PRODUCTION 2026-08-10 20:47 UTC, and the confirmation needed a RESTART to be true. Deleting the modules on disk did not stop the running platform, which had been up since the previous afternoon on pre-deletion code: between stage B and the restart it staged another ~18,500 facts (committed 89,031 -> 107,576, staged -> 134,901). Restarted; boot clean with 0 errors; counts frozen (last staged_at 20:42, verified still 20:42 at 20:50). This is exactly what the always-restart-and-verify-via-the-log rule exists for - a deletion is not live until the process that held the old code is gone.'
    - 'stage E - THE PURGE, applied 2026-08-10 via migration 0112 after a 922MB backup (~/.stackowl/backups/pre-fact-purge-20260810-205135.db). 107,576 committed facts, 134,901 staged facts and the FTS index emptied; fact_rejections, memory_facts and pellets DROPPED (all three had never held a row - fact_rejections is its own verdict on the contradiction detector, which never rejected a single fact in the store''s life). committed_facts and its FTS index are EMPTIED rather than dropped: `memory` still offers search, and a table that exists and returns nothing is honest while a missing one errors at every call site. Verified: FTS query runs and returns 0; platform restarted with 0 errors; counts stay at 0.'
    - 'migration 0112 first FAILED on `cannot VACUUM from within a transaction` - the runner wraps each migration in one. It failed atomically so nothing was applied, which is the transactional guarantee working. VACUUM removed: space reclamation is a maintenance concern, not a schema one, and freed pages are reused by later writes anyway.'
    - 'GRILLING SESSION 2026-08-10 (17 questions, 5 rounds, via the grill-me skill) settled everything left in slice 5. Headline correction it produced: staged_facts serves TWO masters - the dead fact-staging queue AND the live short-term conversation buffer classify reads every turn. Purging it deleted live conversation memory (bounded, self-healing, refilled). The fact store was never a clean layer to remove.'
    - 'conversation buffer BOUNDED 2026-08-09/10: staged_facts keeps max(short_term_window * 10, 50) turns per owner scope, trimmed ON WRITE in the same path as the insert. Derived from the setting that governs READS so raising it cannot starve the only reader; on-write rather than scheduled because MemoryBudgetEnforcer is still scheduled today and does nothing - it sums committed_facts, which is permanently empty. Nothing else bounded this after mining and promotion were removed: every turn appended a row forever, the same no-decay disease as the 88k store, created by the change that removed it. 9 tests; live check shows scopes at 2-3 turns and 0 errors.'
    - DreamWorker UNSCHEDULED, not deleted (migration 0113). All five phases were fact work; the handler stays registered as the seat for N01 Dreaming.
    - 'web_fetch STOPPED STAGING pages as low-confidence facts (2026-08-10), and enable_memory_caching removed with it. Not retargeted at curated memory: a fetched page is exactly the ''will stop being true'' content the durability rule keeps out. Its test was INVERTED rather than deleted - what can regress is the write coming back.'
    - '/memory RETARGETED at curated memory: stats and budget describe how full USER.md and each owl''s notes are, search finds entries by substring, remember/forget edit the profile under the SAME budget the agent lives with (so it can refuse the user too), export prints the files verbatim. reindex and menu removed - one rebuilt a vector index over an empty store, the other browsed facts. The dependency guard went too: every subcommand now reads or writes two text files and touches no database, so refusing to show someone their own profile because SQLite is unavailable would be the coupling this item removed. 18 rewritten tests.'
    - knowledge_prune HANDLER now runs the SKILL CURATOR ONLY (2026-08-10). It wrapped MemoryPruner, which pruned committed facts by age and confidence; that store is empty and its writers are retired, so the pruner had nothing to prune. The ADR-19 skill decay half is now the whole job. 349 green in tests/scheduler/.
    - 'STAGE D STOPPED DELIBERATELY, with the reasoning: fact_promoter''s ONLY remaining live consumers are the three channel approve/reject callbacks, which R8Q4 deferred to D08.2. _phase_promotion needs the promoter, so the DreamWorker cannot lose all five phases until D08.2 lands. Removing two of five now would leave a partially-gutted handler that is harder to reason about than a coherent one - and it is UNSCHEDULED, so none of its phases can run in the meantime. The phases, the promoter, the detector and the pruner should all leave together with the channel callbacks.'
    - 'THE FOURTH ACCEPTANCE CHECK WAS UNCLOSABLE, and the reason was a log level (2026-08-10, commit 41bd62e4). It was recorded as "needs a real turn from Bakir"; it was not waiting on the operator at all. Its only evidence line was log.memory.debug("[curated] snapshot: frozen"), and production runs at INFO - a day of traffic held 5,427 INFO and 91 WARNING records and ZERO DEBUG. No volume of live traffic could ever have closed it. Two INFO lines now exist: curated.py''s snapshot log (once per target per incarnation) and a NEW line in assemble.py at the point profile joins the prompt parts, carrying blocks/chars/owl. The second is the one that matters - the snapshot log proves the files were READ, not that the prompt CARRIES them, and that exact distinction is what D01.1 got wrong. Gate: 50 tests green across tests/memory/test_curated.py, test_prompt_carries_curated_memory.py and tests/pipeline/test_assemble_profile.py; ruff clean on both files with the src/ baseline holding at 39; mypy clean. map_check.py found no mapped item, so this is evidence-led work.'
    - 'AND THE RUNNING PLATFORM WAS FOUR COMMITS STALE while that check sat open - the same lesson this item had already written down. Core had been up since 21:14:12 while 61b27b6a (the conversation-buffer bound, a real fix), 247d74a5, abb08e09 and b4c69b8f all landed after it. Restarted via ./start.sh at 2026-08-10 ~22:5x; boot clean, 265 INFO / 2 WARNING / 0 ERROR, new PIDs 2491983 gateway and 2492071 core. Measured directly against the live files through the real snapshot_for_prompt() before the restart: user=92 chars, secretary=61 chars, both non-empty - so the read path was always sound and only the evidence was missing.'
