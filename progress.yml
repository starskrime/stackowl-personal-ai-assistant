  - id: ESC-2-brief-memory-sections
    RESOLVED: "RESOLVED 2026-08-14 — Bakir chose option B/C: DROP BOTH brief memory sections. A count of rows nobody can act on is noise however it is filtered, and once filtered it reports zero forever, which is the same permanent-nothing problem memory_highlights already demonstrates. A memory section returns later when curated memory has something real to say."
    raised: 2026-08-14
    raised_by: "the item-loop, continuing D08.2 slice A"
    blocks: "the brief half of slice A only. The browser recall drop and the I7 bound proceed."
    why_escalated: >-
      NEW EVIDENCE CONTRADICTS THE PREMISE OF A RECORDED DECISION, which the loop must
      surface rather than reconcile. R1Q2 approved dropping the brief's recall and
      list_staged call sites because they were "a source that returns nothing anyway".
      That is TRUE for one and FALSE for the other, and the false one is actively
      showing Bakir a misleading number every morning.
    what_was_measured: >-
      morning_brief is ENABLED, last ran 2026-08-13T13:00:05Z, next 2026-08-14T13:00Z —
      so both sections are live daily.
      (a) memory_highlights calls bridge.recall() over committed_facts, which has held 0
      rows since migration 0112 and has no writers left. It therefore renders its F-79
      "nothing notable" item every single day, structurally, forever. The premise holds.
      (b) pending_staged calls list_staged(status="staged"), and list_staged filters ONLY
      on status, never on source_type. staged_facts is no longer a fact queue — D08.1 made
      it the conversation buffer — so the query now returns 5,719 rows and the section
      renders "staged_count:5719". It is not empty; it is WRONG, it grows with every
      normal conversation, and /staged was deleted in D08.1 so nothing can act on it.
    the_shape: >-
      Failure mode 1 in a form worth naming: the READER did not change, the MEANING OF THE
      STORE changed underneath it. Nothing was wired wrong; a query that was correct before
      D08.1 silently started answering a different question.
    options:
      - "A. Drop memory_highlights, and FIX pending_staged to filter source_type so it counts only rows a human could act on (today: zero)."
      - "B. Drop both sections. The brief loses its memory reporting entirely until there is something real to report."
      - "C. Drop memory_highlights, drop pending_staged too, and reintroduce a memory section later when curated memory has something worth surfacing (e.g. what was learned about the user this week)."
    recommendation: >-
      C. A count of rows nobody can act on is noise whichever way it is filtered, and once
      filtered it reports zero forever — which is the same permanent-"nothing" problem as
      memory_highlights. The genuinely useful brief section is about CURATED memory (what
      the assistant learned about Bakir), and that is a real feature rather than a
      salvage job. B is the honest minimum if C is too much scope.
    do_not: >-
      Do NOT just filter pending_staged and call it fixed without deciding whether a
