    root_cause_2026_07_29: >
      A PRODUCTION defect, not a harness one. OwlsCommand._build called
      set_services(StepServices(...)) with only three fields, silently DISCARDING
      everything the caller had wired — consent_gate, tool_registry,
      provider_registry, skill_store. The test wired seven fields and got three,
      so OwlBuildTool refused fail-closed with "no consent gate wired" and the
