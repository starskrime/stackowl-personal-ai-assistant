        slice: "3b part 5a — a fact can be AUTHORED ONCE (the summary's reachability)"
        files:
          - "src/stackowl/db/migrations/0097_authored_once_facts.sql (new) — staged_facts rebuilt to widen the source_type CHECK"
          - "src/stackowl/memory/fact_promoter.py — AUTHORED_ONCE_SOURCE_TYPES + ELIGIBLE_PREDICATE_SQL, defined once"
          - "src/stackowl/memory/dream_worker_helpers.py — imports the shared predicate instead of duplicating it"
          - "src/stackowl/memory/models.py — StagedFact.source_type gains conversation_summary"
          - "tests/memory/test_authored_once_promotion.py (new) — 6 tests, written FIRST and red"
        why_this_is_its_own_slice: >
          Part 5 was split because an UNREACHABLE summary is the entire risk of this
          work. Writing the boundary handler first would have produced a feature that
          logs success at every step and is never recalled — so reachability is proven
          before anything is written to be reached.
        the_third_dormancy_trap: >
          The promotion gate requires CORROBORATION: reinforcement_count >= 3 for most
          source types, >= 1 for conversation_fact. That is correct for an EXTRACTED
          claim — the miner's re-derivation supplies the second sighting, which is how
          98k conversation_facts got promoted. It is WRONG for an AUTHORED artifact. A
          rollover summary is written once per boundary and never re-derived, so its
          reinforcement_count stays 0 for ever. Under any existing source type it would
          have sat in staged_facts permanently: written, logged as written, and never
          recalled.
        why_it_would_have_been_invisible: >
          Every intermediate step reports success. The job runs, the handler logs a
          summary, the row appears in staged_facts. Nothing anywhere says "and this will
          never be promoted". This is the THIRD dormant-feature trap in this one item
          (after the unenqueued handler and the dead turn_count) and the only one with
          no observable symptom at all.
        design_notes:
          - "AUTHORED_ONCE_SOURCE_TYPES is a named frozenset, not a hardcoded string in a WHERE clause, so the next authored artifact joins a list rather than adding a fourth branch to two queries."
          - "Exemption is from CORROBORATION ONLY. The confidence gate still applies — a test pins that a low-confidence summary is still refused. Authored-once buys 'no second sighting required', never 'no honesty required'."
          - "ROOT CAUSE, not the example: the eligibility predicate existed as TWO hand-copied duplicates whose own comment said they were 'kept in lock-step by review'. They are different queries (one SELECTs rows to promote, the other COUNTs rows that should have promoted and did not) that must agree exactly on WHICH rows qualify — and if they drift, the stuck-memory alarm reports on a different population than the promoter acts on, invisibly in both directions. Rather than edit both copies, the WHERE clause is now ONE shared string, and a test asserts the two agree. Editing two copies would have been the smaller diff and would have left the fragility that made this necessary."
        why_a_table_rebuild: >
          staged_facts.source_type carries a CHECK constraint and SQLite cannot alter a
          CHECK in place, so the table is rebuilt to widen the allowed set by one value.
          The constraint is KEPT rather than dropped because it is what caught this: the
          first attempt to stage a summary failed loudly at the database instead of
          writing an unrecognised type that six readers would have silently ignored.
          Verified safe first: no foreign key references staged_facts, and the runner
          executes each file inside BEGIN EXCLUSIVE.
