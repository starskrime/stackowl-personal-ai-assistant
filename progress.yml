    doc: "docs/reference-mapping/designs/D01.7.md"
    doc_last_verified: 2026-07-27
    decisions:
      - date: 2026-07-25
        stage: brainstorm
        round: "1 of 7 (Q1-Q4)"
        by: Bakir
        answers:
          owl_in_session_key: "YES — a different owl is a different conversation. Confirms the assertion made unilaterally in the design doc; each owl gets its own lane, its own stable prompt, its own history."
          extra_reset_triggers: "Explicit /new, AND context getting too full. NOT crash — so a crash PRESERVES the session and auto-continues, matching Hermes' resume_pending."
          boundary_ux: "A short one-line note, shown once. A boundary the user cannot see is one they experience as amnesia."
          storage: "BOTH, exactly like Hermes — SQLite canonical + a JSON mirror of the key->id map."
        implications:
          - "Choosing 'context too full' as a reset trigger TIES D01.7 to compression (D03.2): the session boundary becomes compression's mechanism. Good convergence — one seam, two items."
          - "Crash-preserves confirms the resume_pending design, which matters more for us than for Hermes because our core exec-replaces itself on every code change."
        design_response_to_sync_risk: >
          Bakir was shown the cost of 'both' (two things to keep in sync) and reaffirmed it. Rather
          than accept that bug class, the design eliminates it: SQLite is the SINGLE source of
          truth, and the JSON file is a DERIVED, WRITE-ONLY MIRROR — projected after each commit,
          never read back except by a human inspecting it. A one-way projection cannot drift into
          disagreement, because nothing ever trusts it. If the mirror is deleted or corrupted it is
          simply regenerated. This gives the legibility he asked for at no correctness cost.
      - date: 2026-07-25
        stage: brainstorm
        round: "2 of 7 (Q5-Q8)"
        by: Bakir
        answers:
          multi_user_isolation: "Shared in THREADS, private in the main channel — Hermes' exact default combination (group_sessions_per_user true, thread_sessions_per_user false). A thread is a focused sub-discussion where shared context helps; the main channel is where privacy matters."
          mid_turn_restart: "SILENTLY FINISH THE ANSWER. resume_pending + a synthesised message event to auto-continue. The most machinery of the four options, and it earns it — this is the case he hits constantly during development because the core exec-replaces on every code change."
          stuck_loop_escape: "3 consecutive restart failures on one lane -> clean slate, AND tell him why. The counter is per-lane so one poisoned conversation cannot take down the others. Naming the failure turns a silent wipe into a bug report, which fits the self-heal-and-surface posture."
          new_semantics: "/new archives the conversation AND summarises it into memory — the full rollover treatment. /reset stays the destructive verb."
        implications:
          - "DEDUP: /new and the daily rollover become the SAME code path — archive, summarise, mint a new incarnation. One mechanism, two triggers. Four triggers in total once idle and context-full are counted."
          - "Q6 confirms resume_pending is load-bearing for StackOwl in a way it is not for Hermes: their gateway restarts rarely, ours exec-replaces on every code change. The synthesised-continue path is not a nicety here."
          - "Q5 means the session key needs chat_type + thread_id + participant_id, exactly as Hermes' build_session_key does. The design doc's key format already anticipated this."
      - date: 2026-07-25
        stage: brainstorm
        round: "3 of 7 (Q9-Q12)"
        by: Bakir
        answers:
          non_human_lanes: "EVERY runner gets a lane — cron jobs, delegated subagents, objectives. One rule, no special cases."
          idle_window: "24h, keeping Hermes' number. With a 4 AM rollover the idle path rarely fires anyway; it only catches a conversation abandoned mid-day."
          retention: "Keep the TRANSCRIPT, prune the session RECORD. Hermes' exact split — entries are pruned, transcripts are not."
          never_expire: "ALL FOUR conditions: running background process, in-flight durable task, active objective, AND a pending clarify question."
        implications:
          - "Q12 EXTENDS Hermes rather than adopting it. Their rule protects background processes only; ours protects four conditions because StackOwl has autonomy machinery Hermes lacks (durable tasks, objectives, the clarify gateway). Worth stating in the design doc as a deliberate divergence — a future reader will otherwise assume the extra three were scope creep."
          - "Q9 means the D01.1 frozen prompt benefits BACKGROUND work too, not just chat. The baseline already hinted at this: goal-owl_lifecycle sessions were the ONLY ones showing 1 distinct prompt across many calls."
          - "Q12's fourth condition (pending clarify) is subtle: if a lane rolls while the owl is waiting for an answer, the parked turn has nowhere to land. That is a live bug class in the current clarify_pump, not a hypothetical."
      - date: 2026-07-25
        stage: brainstorm
        round: "4 of 7 (Q13-Q16)"
        by: Bakir
        answers:
          summary_model: "Cheap by default, CONFIGURABLE PER TASK. This is Hermes' `auxiliary` block verbatim — and it is map item D04.4."
          summary_content: "All four selected: facts about him, what was decided/agreed, what went wrong, AND a notability gate. Read as a conjunction not a contradiction: summarise ONLY when something notable happened, but when you do, capture all three categories."
          rollover_hook: "EventBus publication, BUT the work must be queued DURABLY in case the session crashes mid-rollover. Option 4 — publish the event, consumers enqueue durable tasks rather than working inline."
          boundary_testing: "BOTH — clock-injected unit tests for every branch of the priority order, PLUS one live run to prove it is actually wired into the gateway."
        implications:
          - "NEW DEPENDENCY FOUND: Q13 pulls D04.4 (auxiliary-model router) into D01.7's path. Today StackOwl resolves side-LLM models ad hoc across acceptance_llm, the interaction/ classifiers, critic_scorer and reflection. The rollover summary needs a cheap-by-default, per-task-configurable resolution chain — which is exactly D04.4. Either build a minimal version inside D01.7 or promote D04.4 ahead of it. RESOLVE BEFORE ARCHITECT."
          - "Q15 raises the bar above what was designed. The doc said 'emit session.rollover on the EventBus'; Bakir wants the consumers to enqueue DURABLE tasks so a crash mid-rollover does not lose the summary. Correct instinct — a rollover fires at 4 AM unattended, which is precisely when nobody is watching. pipeline/durable/ already provides the machinery."
          - "Q14's notability gate is a cost control: Q9 made EVERY runner a lane, so an ungated summary would fire one LLM call per lane per day. The gate is what keeps that bounded."
          - "Q16 names the failure mode explicitly: registered-but-unreachable. A clock-injected unit test proves the logic; only a live run proves the gateway actually calls it."
      - date: 2026-07-25
        stage: brainstorm
        round: "5 of 7 (Q17-Q20)"
        by: Bakir
        answers:
          migration: "Adopt every existing conversation as one lane with its history intact; the first 4 AM boundary after upgrade rolls it. Nothing lost, no user action, everyone on the new model within a day."
          resume_across_change: "Resume with the NEW prompt. Simpler — no stale prompt retained."
          aux_router_dependency: "Use the existing providers/tier_selector.py as-is — CONDITIONAL, see open_action below."
          json_mirror: "Key->id map plus timestamps, exactly like Hermes. Smallest useful mirror."
        open_actions:
          - id: "D01.7-OA1"
            what: "VERIFY that providers/tier_selector.py can actually serve a cheap-model summary call before treating Q19 as settled."
            why: >
              That option was offered WITH the caveat 'I would need to check before promising this.'
              Bakir picked it, so the answer is conditional on the check. If tier_selector cannot do
              it, D04.4 comes back onto D01.7's path and Q19 must be re-asked.
            status: RESOLVED — NEGATIVE
            resolved: 2026-07-25
            finding: >
              TierSelector CANNOT serve this. It is a round-robin picker among healthy providers
              WITHIN a tier (sync, lock-free, ~30 lines), whose only caller is
              ProviderRegistry.get_with_cascade. It selects WHICH PROVIDER, not WHICH MODEL FOR
              WHICH TASK. No per-task configuration, no cheap-by-default policy, no side-LLM
              fallback chain. A different concern entirely.
            consequence: >
              Q19's answer does not hold. D04.4 (auxiliary-model router) genuinely returns to
              D01.7's path and Q19 MUST BE RE-ASKED with this information. This is why the answer
              was recorded as conditional rather than settled.
            blocks: "NOTHING — Q19 re-asked and answered, see below."
            q19_final_answer:
              date: 2026-07-25
              by: Bakir
              answer: "Point the rollover summary at the STANDARD tier explicitly."
              why_this_works: >
                Footprint-ladder RUNG 1 — extend existing code, add nothing. The fast/standard/
                powerful tier concept already exists and is config-driven (NeraAiRaw is configured
                on all three). The summary call simply names its tier instead of inheriting the
                owl's selection or requiring a new router. No D04.4 dependency, no second
                resolution path, nothing to deduplicate later — which satisfies the Q24 standing
                acceptance criterion directly.
              consequence: "D01.7 depends_on reverts to [D01.6] alone. ARCHITECT IS UNBLOCKED."
        accepted_tradeoffs:
          - "Q18: resuming with the NEW prompt means the second half of an interrupted answer can come from a different persona than the first half, if DNA evolved or routing changed overnight. Bakir chose simplicity over coherence here; recorded so it is a known consequence rather than a surprise bug report later."
      - date: 2026-07-25
        stage: brainstorm
        round: "6 of 6 (Q21-Q24) — BRAINSTORM COMPLETE, 24 questions"
        by: Bakir
        answers:
          rollout: "Straight cutover, default ON. No flag, no dual path; migration is automatic per Q17."
          hard_invariants: "'Nothing. We can have a new conversation.' — no ADDITIONAL hard constraints beyond those already chosen."
          success_criteria: "The FULL invariant suite green — every one of I1-I6 has a test, plus the live run."
          standing_requirement: "'Just make sure we are not creating duplicate code and always optimizing code.'"
        contradiction_surfaced:
          apparent: "Q22 ('nothing must never break') pulls against Q11 (keep the transcript), Q12 (four never-expire conditions) and Q23 (full invariant suite green)."
          resolution: >
            Read Q22 as 'I will not be upset if a conversation resets' — a statement about his
            tolerance — NOT as 'discard the invariants you already chose'. I1-I6 are structural
            correctness properties, not user-facing promises, and Q23 explicitly demands all of
            them be tested. Flagged to Bakir for correction rather than silently reconciled.
          status: "resolved unless Bakir corrects"
        implications:
          - "Q22 LOWERS the risk bar: no recall-regression gate, no history-preservation gate beyond what Q11 already chose. D01.7 can move fast."
          - "Q24 elevates anti-duplication from a process rule to a STANDING ACCEPTANCE CRITERION for every item. Already encoded in dedup_targets X1-X10 and the PROCESS.md three-question check; now also a stated success condition."
          - "Q23 + Q22 together define the shape: prove the MECHANISM rigorously (I1-I6 + live run), do not gate on user-facing guarantees he does not want."
      - date: 2026-07-25
        stage: architect
        by: Bakir
        question: "session.at_hour — midnight (his Q16 answer) or 4 AM (Hermes default)?"
        answer: "4 AM. SIGNED OFF."
        rationale: >
          Hermes' reasoning accepted: a session running at 1 AM is mid-thought and midnight
          guillotines it; at 4 AM nobody is talking. Ships configurable (reset_mode + at_hour)
          so midnight remains reachable, with 4 as the default. Supersedes the Q16 answer.
        blocks_cleared: ["D01.7 implement"]
      - date: 2026-07-25
        stage: implement
        round: "slice-3 design round (5 questions, 2 batches)"
        by: Bakir
        trigger: >
          Slice 3 is the first slice to touch the LIVE message path, and reading that path
          surfaced two facts the architect stage did not have. Both change what slice 3 is,
          so they were put back to Bakir before any code was written.
        finding_1_identifier_collision:
          what: >
            StackOwl's existing `session_id` IS Hermes' `session_key` — the LANE, not the
            incarnation. Verified: channels/telegram/adapter.py mints it as str(user_id);
            channels/base.py:81 resolve_target(session_id) treats it as the delivery target;
            gateway/turn_registry.py keys concurrency on it; memory/sqlite_bridge.py scopes
            staged facts by it. The design doc's model (session_id = incarnation) therefore
            collides head-on with 1715 occurrences in src/.
          why_the_doc_missed_it: >
            The design was written from Hermes' model outward. Nobody had yet traced what
            StackOwl's existing identifier actually MEANT at the channel boundary.
        finding_2_transcript_store_has_no_writer:
          what: >
            The `conversations` and `messages` tables (migration 0002) have ZERO INSERT
            sites anywhere in src/, and both are empty in the live DB.
          evidence: >
            `grep -rn "INSERT INTO messages|INSERT INTO conversations" src/` -> no matches.
            Live DB: conversations 0 rows, messages 0 rows — against cost_records 61858 and
            staged_facts 109380. The de-facto transcript is staged_facts
            (source_type='conversation', source_ref=session_id).
          six_dead_readers:
            - "owls/evolution.py:92 — fetches excerpts to evolve owl DNA. Evolves on an empty set."
            - "memory/extraction_handler.py:22 — fact extraction from session messages. Extracts from nothing."
            - "tools/knowledge/session_search.py:71 — search past conversations."
            - "tools/knowledge/transcripts.py:50 — read a transcript."
            - "tools/knowledge/session_access.py:137 — owner lookup used for authz."
            - "tools/scheduling/cron_helpers.py:20 — owl owner for a cron job."
          why_it_belongs_to_D01_7: >
            Invariant I6 says "no transcript is destroyed by a rollover". There is no
            transcript being written to destroy. I6 was unfalsifiable as stated.
        answers:
          identity: >
            FULL RENAME. Today's session_id becomes session_key across the conversation
            domain; the minted incarnation takes the name session_id, matching Hermes and
            the design doc exactly. Chosen over the cheaper alternative (keep session_id as
            the routing identifier, name the incarnation `incarnation_id`) which reaches the
            same functional end state with a ~10x smaller diff.
          transcript: "FIX IT INSIDE D01.7 — write the transcript at turn end, keyed by lane + incarnation."
          rollover_scoping: >
            Re-scope, keep both queryable. New conversation facts are stamped with the
            incarnation; in-conversation recall reads the current incarnation, lane-wide
