              pairs are recoverable TODAY, e.g. (headhunter, web_search) 2425,
              (secretary, web_fetch) 1919, (secretary, shell) 1557
            * WRITE GAP = 0. Every row with tool_call_count > 0 has a sequence;
              the 8,862 empty ones genuinely made no tool calls. Single writer:
              pipeline/backends/shared.py:532.
          The READ helper exists too — outcome_store.list_successful_with_sequence
          (outcome_store.py:501) already returns scored outcomes with owl_name and
          a non-empty tool_sequence, and is already used by SkillSynthesizerHandler.
