  - id: D05.5
    title: "Programmatic tool calling (PTC)"
    domain: D05
    verdict: PARTIAL
    track: close_gap
    priority: P2
    wave: 2
    order: 12
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d055"
    gap: "Likely narrower (a privileged escape hatch rather than a general RPC surface)."
    depends_on: []
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: "docs/reference-mapping/designs/D05.5.md"
    doc_last_verified: "2026-08-02"
    decisions:
      - date: 2026-08-02
        stage: all_seven
        by: Bakir
        round: "4 questions over 2 rounds. The map's own question — 'walk _ptc.py, is this already 80% there?' — was answered by READING, which retired most of the planned grill."
        THE_MAPS_QUESTION_ANSWERED: >
          THE TRANSPORT IS ~100% THERE. THE SURFACE WAS 6.5%.
          StackOwl's PTC already had: per-run UDS at 0600 unlinked on teardown, a
          generated in-sandbox stub (import owl), HOST-side default-DENY
          enforcement, per-call bounds (owl ∩ creation_ceiling), write-confinement
          to the run workspace, rate limits, arg/frame caps, audit, never-raise.
          It was architecturally STRICTER than the reference on every axis except
          the one that decides whether the feature does anything: it could call 5
          of 77 tools.
        THE_PREMISE_MEASURED: >
          1,470 turns called at least one tool. 1,237 (84%) were MULTI-CALL
          chains; 810 used 5+ calls; the longest was 46. Only 256 of the 1,237
          (20%) fitted inside the five allowlisted names — so PTC could collapse
          a fifth of the opportunity it exists for.
          The single largest blocker was web_fetch: 4,102 appearances in chains,
          DENIED, while its read-only sibling web_search was ALLOWED. That
          asymmetry is what made the narrow allowlist look accidental rather than
          principled.
        answers:
          allowlist_rule: "DEFAULT-ALLOW MINUS EXCLUSIONS (the reference platform's shape). Bakir chose this over my 'curated read-only, still default-DENY' recommendation."
          web_fetch: "ALLOW — the asymmetry with web_search was unintended."
          long_chains: "INVESTIGATE AS ITS OWN ITEM, not folded into D05.5. Recorded as a backlog entry with the measurement attached."
          consent: >
            DEFAULT-ALLOW EVERYTHING, NO CONSENT (literal Hermes). Chosen AFTER I
            surfaced the specific consequence: dispatch.py:54 deliberately skips
            the per-call consent gate, and the reason given in the code was that
            the allowlist was read+sandbox-write only. Removing that premise makes
            13 consequential tools (send_message, owl_build, tool_build,
            skill_manage, claude_code, browser_eval_js, ...) callable from a
            sandboxed script with no prompt. Bakir was shown exactly that and
            chose it. Concern raised once, decision taken, proceeded in full.
        what_shipped:
          policy: "PTC_ALLOWLIST (5 names, default-DENY) -> PTC_DENYLIST (7 names, default-ALLOW). ptc_callable() is a function, not a frozenset, so it cannot go stale as tools register."
          denylist_meaning_changed: "It is now a SANDBOX-ESCAPE fence, not a capability fence: shell, execute_code, process, claude_code, delegate_task, sessions_spawn, sessions_send. Each would let code break OUT — host commands, nested sandbox, host process control, an agent with host FS access, or a bypass of E8-S0's delegation-depth ceiling."
          stub: "Generic __getattr__ so any non-denied tool is owl.<tool>(**kwargs). Dunder names still raise AttributeError — otherwise `import owl`, copy, pickle and pytest collection each become an RPC call for __wrapped__."
        THREE_SELF_JUSTIFYING_COMMENTS_REWRITTEN_not_left_standing: >
          The most important cleanup in this item. Three places justified
          themselves on the five-name allowlist and would have been left asserting
          a safety that no longer holds — worse than no comment at all:
            * dispatch.invoke — "the allowlist is read+workspace-write only" was
              the stated reason for skipping consent. Now states that
              consequential tools are reachable and unprompted, and lists what
              DOES still constrain a call.
            * sandbox/ptc/__init__ — "Default-DENY allowlist — ONLY the five
              names". Now default-ALLOW minus escape vectors, consent cost named.
            * _ptc.ptc_enabled — ON by default because "the allowlist is read +
              sandbox-workspace-write only". Now ON by operator decision, naming
              the guardrails that actually remain.
          The USER-FACING consent text was also wrong and is fixed: it described a
          curated five-tool surface. It now says approving the run approves
          everything the script does.
        what_still_constrains_a_call: "Bounds (owl ∩ creation_ceiling) per call, write-confinement, per-run rate cap, arg/frame caps, audit with bounded args, never-raise. None removed — which is why this is still a narrower grant than the reference platform's despite matching its shape."
        mutation_M4: >
          Make ptc_callable() return True unconditionally. Fails ALL SEVEN
          escape-vector tests and nothing else. That is the mutation that matters
          here — it is the one that would let sandboxed code out. The tests assert
          on the REGISTRY LOOKUP as well as invocation, because refusal after
          resolution means the tool was already constructed, which for
          execute_code or process is too late.
        tests: "tests/sandbox/ 165 passed. TestAllowlistDefaultDeny rewritten to TestEscapeFenceDefaultAllow: 7 escape-vector params (was 5), plus a new test PINNING that send_message/owl_build/tool_build ARE now callable — the widening is asserted explicitly rather than left implied, so it is visible in the suite and not only in a commit message."
        gates: "src ruff 46 / mypy 78 unchanged. NOTE: ruff on tests/sandbox/ptc/ reports 2 errors, both in test_ptc_bwrap.py which this item never touched — pre-existing, verified not introduced."
        NOT_verified_live: "No sandboxed run was executed against the widened surface. Evidence is the suite plus M4. A live execute_code run calling owl.web_fetch is what would close it."
        STANDING_LIABILITY_recorded_not_solved: >
          THE FENCE IS A HAND-KEPT LIST. A future tool that can escape the sandbox
          is callable until someone remembers to add it to PTC_DENYLIST. Deriving
          the fence (e.g. from action_severity) was considered and REJECTED: that
          field is authored for consent, and a mislabelled tool would silently
          open the fence rather than merely mis-prompt. Stated as a failure mode
          in the design doc rather than left implicit.
    changes: []
    notes: null

  - id: D05.6
