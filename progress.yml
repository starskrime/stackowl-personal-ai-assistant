  - id: D05.1
    title: "Registry & auto-discovery"
    domain: D05
    verdict: PARTIAL
    verdict_corrected_2026_08_02: >
      WAS "PARITY". The map claimed "StackOwl. tools/registry.py with
      auto-discovery" — there is none for builtin tools; with_defaults() is ~77
      hardcoded imports. It also missed that StackOwl's only real auto-discovery
      (the skill loader) exec_module()s model-reachable Python at boot from a
      directory write_file can write to. Not parity, and not small.
    track: verify
    priority: P3
    wave: 2
    order: 8
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d051"
    gap: "Small: no dynamic_schema_overrides, no AST prefilter."
    depends_on: []
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: "docs/reference-mapping/designs/D05.1.md"
    doc_last_verified: "2026-08-03"
    decisions:
      - date: 2026-08-02
        stage: brainstorm
        by: Bakir
        round: "6 questions over 3 rounds, Hermes read FIRST. One round was spent answering Bakir's own question (how would skill installation work?) by reading rather than guessing — the answer changed nothing about the plan and confirmed it."
        THE_MAP_IS_WRONG_ABOUT_US: >
          The map says "StackOwl. tools/registry.py WITH AUTO-DISCOVERY" and
          rates D05.1 PARITY with a "small" gap. FALSE. ToolRegistry.with_defaults()
          is ~77 hardcoded imports plus explicit register() calls; there is NO
          discovery for builtin tools at all. The only dynamic registration paths
          are (a) learned_tool_loader reading declarative JSON specs and (b) the
          SKILL loader, which exec_module()s tools/*.py at boot.
          Re-verdict agreed: PARITY -> PARTIAL, and the item WIDENS to registry
          hardening rather than housekeeping.
        SECURITY_FINDING_confirmed_by_running_it: >
          THE EXEC-AT-BOOT HOLE. Skills live at ~/.stackowl/workspace/skills —
          INSIDE the workspace that write_file is confined to. Verified by
          calling the real guard:
            resolve_in_workspace("skills/evil/tools/pwn.py")
              -> /home/boss/.stackowl/workspace/skills/evil/tools/pwn.py
          and skills/loader.py:290-299 calls importlib exec_module() on every
          tools/*.py under the skills tree at boot.
          So ANY tool that can write the workspace gets arbitrary Python executed
          at next start. write_file is a BASE, always-presented tool and is not
          consent-gated as consequential. Post-D05.5 sandboxed PTC code can call
          write_file too — meaning a sandboxed script can escape the sandbox with
          a ONE-REBOOT DELAY, partly bypassing the escape fence D05.5 built one
          day earlier.
          Realistic chain on this box: fetched web content -> prompt influence ->
          model writes the file -> next boot executes it.
        THE_HOLE_IS_UNEXERCISED: >
          MEASURED before proposing a fix: 420 skills on disk, ZERO ship a
          tools/*.py. The exec capability has no users at all. So the migration
          risks nothing, and "stop exec'ing entirely" would also have cost
          nothing — worth recording because it makes the chosen fix the
          conservative one rather than the cautious-sounding one.
        answers:
          auto_discovery: "ADOPT glob + AST prefilter. Bakir chose this over my 'keep the explicit list' recommendation — the hardcoded list's reviewability was my argument, and he took the ergonomics."
          ast_target: >
            A TOP-LEVEL ClassDef INHERITING Tool — not Hermes' `registry.register(...)`
            call. Their tools self-register with a module-level call; ours are Tool
            SUBCLASSES that with_defaults() instantiates, so their AST predicate would
            match nothing in our tree. Same technique, different target: port the
            DESIGN, never the code.
          dynamic_schema_overrides: >
            DECLINED, and this is the map's actual headline ask. It makes a
            description config-dependent, which is exactly the instability D05.2
            spent the last two items removing — I had already written in D05.2's
            doc that importing it would be "precisely backwards". Hermes needs it
            because their limits are per-install user config; ours are mostly
            module constants. MEASURED: 13 of 77 schemas state a numeric limit,
            and delegate_task — the tool Hermes rewrites dynamically — has a
            purely generic description here with no limits in it.
          skill_exec_path: "IN SCOPE. D05.1 is 'registry & auto-discovery' and this IS StackOwl's auto-discovery. Two loaders take OPPOSITE positions on executing model-authored code at boot and only learned_tool_loader wrote down why."
          verdict: "RE-VERDICT AND WIDEN — one registry-hardening item covering discovery + the exec-at-boot policy."
          exec_fix: >
            MOVE SKILLS OUT OF THE WORKSPACE. skills_dir() becomes root()/"skills"
            instead of workspace()/"skills", plus an idempotent boot migration.
            Structural, not a rule to remember.
        BAKIRS_QUESTION_ANSWERED_BY_READING: >
          He asked "if we move out then how will skill installation work?" —
          the right question, and the answer is UNAFFECTED. Verified: skill_manage,
          synthesize_skills, the loader, the scheduler, the orchestrator and
          builtin-seeding ALL resolve through StackowlHome.skills_dir() and write
          with a direct Path.write_text(). NONE goes through write_file's
          workspace guard. So the location was never load-bearing for
          installation — only for the hole. The only hardcoded "workspace/skills"
          strings are in 5 DOCSTRINGS, not code.
        rejected_alternatives:
          refuse_py_writes: "A path-guard rule refusing write_file under skills/**. Rejected: it is a rule that must be re-applied for every future executable tree, which is precisely how this hole appeared."
          stop_exec_entirely: "Would also have worked (0 of 420 skills use it) but removes a shipped extension surface for a hole the relocation already closes."
      - date: 2026-08-03
        stage: implement+cleanup+test+validate+document
        by: Claude
        what_shipped:
          security: "skills_dir() -> home()/'skills'. NEW skills_dir_is_outside_workspace() makes the property CHECKABLE — it is NOT implied by reading skills_dir(), because STACKOWL_DATA_DIR moves workspace() but not home(). NEW migrate_legacy_skills(), called from ensure_exists() beside the existing downloads migration."
          discovery: "NEW tools/_infra/discovery.py. AST prefilter -> import only the 61 modules declaring a top-level Tool subclass (69 helpers untouched) -> issubclass is the real check. with_defaults() went from 61 imports + 60 register() calls to a loop."
          wiring: "Discovery yields CLASSES. 5 tools in 2 groups stay hand-wired for their SHARED stores; 11 more are named in _DEFAULT_CONSTRUCTIBLE to record that cls() is correct; anything else with a constructor param RAISES at boot."
          excluded: "LearnedShellTool — ONE class that becomes MANY tools, one per agent-authored JSON spec. Auto-registering the class would add a nameless template tool beside the real ones."
        comments_were_relocated_not_deleted: >
          with_defaults held 153 comment lines of per-tool rationale — more than
          half the method. Deleting that to save 61 imports would have been a bad
          trade, so 31 blocks were moved VERBATIM into each tool's own module
          docstring under a "Registration note" heading. They described the TOOL,
          not the line that constructed it, and a reader looks in the tool's file.
        parity_verified_against_a_clean_worktree: >
          Not against my own expectation: checked out HEAD into a separate
          worktree, dumped its registered tool names, and diffed. 77 both sides,
          0 lost, 0 added, sets IDENTICAL. Shared stores asserted by IDENTITY
          (`is`), not equality — equality would pass with two separate stores.
        THE_INCIDENT: >
          MY MIGRATION DELETED 419 OF 420 SKILLS ON ITS FIRST RUN, against live
          data. Fully recovered from the DB. Full account in
          INCIDENT-2026-08-03-skills-migration; the short version is that
          ensure_exists() pre-creates the four skills subdirs, my migration
          treated those empty dirs as "already migrated", and my verify only
          asked whether each NAME existed at the target — which empty dirs
          satisfy. Verify passed; rmtree deleted the source. The data survived
          because a CACHE happened to hold the source of truth: luck, not design.
        mutations:
          M6: "AST filter always True -> fails the 5 prefilter tests, nothing else. Proves the prefilter does work rather than being incidental."
          M7: "Drop the wiring table -> fails exactly the shared-store tests. Proves the wiring is load-bearing."
          M5: "Restore the destructive migration logic -> fails precisely test_migration_survives_ensure_exists_having_precreated_the_subdirs."
        tests: "tests/tools/test_discovery.py (14) + tests/paths/test_skills_relocation.py (8). The prefilter tests name the REAL helper modules (_infra/presentation.py, agents/schema.py, code/_ptc.py) rather than synthetic strings."
        suites_green: "discovery 14, paths 24, registry+presentation slices 48, infra 143, D05.2/D05.3 wiring suites 167. ruff src 46 / mypy 78 unchanged."
        live_validation: >
          ./start.sh (pid 366908). 0 ERROR/CRITICAL.
          "[tools] registry.with_defaults: discovered {tools:77}" in BOTH the
          gateway and core processes. "[skills] loader.load_all: exit
          {loaded_count:421, by_source:{builtin:14, learned:407}}" — the relocated
          tree loads and the DB holds 421 rows.
