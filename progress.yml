    decisions_addendum_memory_scope:
      date: 2026-07-25
      stage: implement
      by: Bakir
      question: >
        PipelineState.session_key still held the channel-native value. Switching it to
        the composite lane would repoint memory scoping onto a key staged_facts has no
        rows for (738 on the live Telegram lane, 109380 overall), silently emptying
        recall — which contradicts Q17's "adopt every existing conversation with its
        history intact".
      answer: "Scope durable knowledge by identity_key, freeing session_key to become the composite lane."
      why_it_is_the_right_seam: >
        `state.identity_key or state.session_key` was ALREADY the established pattern
        for durable knowledge — classify.py (preferences), feedback.py, deliver.py,
        tier_command.py, preferences_command.py and style_command.py all wrote it
        inline. Conversation facts were the ONE durable-knowledge site still using the
        raw lane (turn_persist.py). So this is not a new mechanism; it is the removal
        of an inconsistency that had gone unnoticed because nothing had yet tried to
        change what session_key means.
      why_not_the_alternatives: >
        A backfill was rejected as lossy: the composite lane contains the OWL, and a
        chat's facts can span owls, so a per-row owl would have to be guessed and a
        wrong guess silently misattributes memory. A union read was rejected as a
        compatibility branch nobody would remember to remove. Leaving session_key
        channel-native was rejected because it preserves two meanings of one name —
        the exact confusion the rename existed to end.
      why_identity_and_not_the_lane: >
        Knowledge is about a PERSON, not about which owl heard it. Scoping facts to an
        owl-prefixed lane would mean telling Brain your timezone and Scout not knowing
        it. The identity resolver returns the handle unchanged when no alias is
        configured, so identity_key equals today's chat id and every existing row stays
        reachable with no migration at all.
