  - id: ESC-1-skill-manage-autoallow
    raised: 2026-08-11
    RESOLVED: 2026-08-14
    resolution: >-
      Bakir chose option B — always ask on a prompt-injection surface. Implemented by
      WIRING AN EXISTING MECHANISM rather than adding one: ToolManifest.consent_category
      has been read by the consent gate all along and NO tool had ever declared one.
      skill_manage now declares consent_category="prompt_surface", and that value joins
      always_ask_categories. Deliberately a CATEGORY, not a tool name in a list, because
      the property belongs to a class — owl_build and tool_build are candidates on the
      same reasoning. commit_coupling="transactional" is accurate and STAYS; it simply is
      not sufficient on its own to decide prompting for this class.
    what_it_also_uncovered: >-
      Fixing the consent bug let the smoke get FAR ENOUGH to hit a second defect the
      missing prompt had been masking. The test isolates its database with
      STACKOWL_DATA_DIR, but that overrides only workspace() (paths.py:39) — skills_dir()
      derives from home(), which reads STACKOWL_HOME. So the suite wrote into the
      OPERATOR'''S REAL ~/.stackowl/skills/learned every time it ran, and a run on
      2026-08-07 left a '''greet-politely''' skill behind there, which then failed the next
      run with "already exists". The test now sets STACKOWL_HOME too. The leftover skill
      was NOT deleted — it is in the live skills index and may be one Bakir uses; that is
      his call, not the loop'''s.
    verified: >-
      95 passed across 14 consent files, up from 83 passed / 2 failed. ruff clean with the
      src/ baseline holding at 39; mypy clean. The two smokes now pass by the code matching
      its own stated contract, and NEITHER assertion was weakened — one was strengthened,
      pinning that an always-ask tool offers no session- or window-scope grant at all
      (consent.py passes allow_relaxation=not excluded).
    blocks: "NOTHING further — slice B is unblocked."
    question: >-
      Should creating a SKILL be auto-allowed without a consent prompt?
    why_not_derivable: >-
      Both behaviours are deliberately recorded in the codebase and they contradict each
      other. This is risk appetite on a security surface, which is never derivable.
    what_was_measured: >-
      All of it, no inference. reversibility_resolver flag = True (ADR-3 resolver ON).
      skill_manage.manifest.commit_coupling = "transactional", so ToolRegistry._is_reversible
      returns True. consent_category = None, so it is not in always_ask_categories. The live
      path is therefore consent.request()'s `reversible_auto` branch: auto-allow with undo, no
      prompt. Confirmed EMPIRICALLY as well as by reading — the smoke test's own log shows
      "[consent] policy.request: exit" followed immediately by "skill_manage.execute: entry"
      with no keyboard ever sent to Telegram.
    the_contradiction: >-
      skill_manage.py LINE 20 states: 'Severity (operator decision): consequential — every
      write is consent-gated.' That is NOT what the running system does; line 170 of the same
      file declares commit_coupling="transactional", which routes it to ADR-3's auto-allow.
      An operator decision written in prose is contradicted by the manifest beside it. Two
      copies of one rule, drifted — and the drift silently removed a consent prompt.
    why_it_matters: >-
      skill_manage creates an agent-writable file that becomes part of a prompt. D08.1's own
      design called this 'a prompt-injection surface' and insisted every curated write be
      scanned rather than pointing at a later item. Reversible is not the same as harmless:
      an injected skill can act before anyone exercises the undo.
    options:
      - "A. ADR-3 is right — skill creation is reversible, auto-allow stands. Fix LINE 20's stale claim and update the two smoke tests to assert the undo affordance instead of a keyboard."
      - "B. Line 20 is right — a prompt-injection surface must always ask. Give skill_manage a consent_category that lands it in always_ask, leave the tests as they are. They are currently telling the truth."
      - "C. Split the difference — auto-allow edits to an existing skill, always ask on CREATE."
    recommendation: >-
      B, and it is not a close call. Every other reversible-auto tool changes DATA; this one
      changes what the agent will DO on later turns. 'Undo is available' assumes someone looks,
      and nothing currently tells them to. Cheapest correct fix, and it makes two red tests
      green by making the code match its own stated intent rather than by weakening an
      assertion.
    do_not: >-
      Do NOT loosen the two failing assertions to get green. If B is chosen they were right all
      along, and editing them would have destroyed the only evidence of a real regression.

  # The item-loop skill (.claude/skills/item-loop/SKILL.md) writes here. One entry per
  # question the six-lens panel refused to answer because evidence could not settle it:
  # the question, WHY it is not derivable, the panel's recommendation, and what stays
  # blocked until it is answered. Bakir clears the queue in one sitting; the loop keeps
  # working on everything the queue does not block.
  #
  # The panel may only answer a question it can name the evidence for — a measurement, a
  # log line, a file in the tree, the reference platform, or a decision already recorded
  # here. "The panel agreed" is not evidence. Product intent, priority, risk appetite and
  # anything user-facing are never derivable and always land here.

  LANCEDB_REMOVAL_DECIDED_2026_08_14: >-
    NEW ARC, DECIDED AND NOT YET STARTED — Bakir: "I do not want lancedb at all because it
    is heavy and does not support all platforms." MEASURED, which is what makes the
    objection concrete: lancedb 100MB + its pyarrow requirement 136MB = 236MB of
    dependency weight, against kuzu at 19MB and numpy — ALREADY a direct dependency — at
    30MB. So the complaint lands on LanceDB specifically, not on the wider stack.
    WHAT IS ACTUALLY STORED, measured on the live store: three tables. committed_facts
    (4,985 vectors) and committed_facts_meta (1) are ALREADY DEAD — semantic_recall
    hydrates content via fetch_committed_by_ids from SQLite committed_facts, which has
    held 0 rows since migration 0112, so 4,985 vector hits hydrate to nothing. They are
    orphans migration 0112 left behind: it purged the SQL rows and not the vectors.
    Only `lessons` is live — 3,680 rows at 384 dims (3,429 reflection, 198 skill, 53
    tool_heuristic). classify.py:40 calls the lessons index "the SOLE surface" and queries
    it every turn, and lessons are one of the two blocks D01.1 deliberately KEPT in the
    system prompt. So this is a REPLACEMENT, not a deletion, and LessonsIndex is hard-wired
    to LessonsLanceAdapter with no FTS alternative behind it.
    DECIDED (Bakir, 2026-08-14): (1) REPLACEMENT = embeddings as BLOBs in SQLite ranked by
    a numpy cosine matmul. Zero new dependencies, 5.4MB resident for the whole corpus,
    ~1.4M FLOPs per query, and EXACT rather than LanceDB's approximate ANN — so recall
    quality goes up, not down. Rejected: sqlite-vec (a new binary dep with aarch64 wheel
    risk, the same class of problem being removed) and FTS5-only (would delete semantic
    matching, and lessons are paraphrase-heavy). (2) DEAD DATA = back up the lancedb
    directory to ~/.stackowl/backups/ first, then delete the two committed_facts tables.
    (3) SEQUENCING = ESC-5/6 and seam 3 pass 4 FIRST; this arc after.
    CONTRADICTS A RECORDED DECISION, raised rather than silently reconciled: the memory
    storage architecture on record is node-llama-cpp + LanceDB + Kuzu + SQLite. This
    reverses the LanceDB third of it. Kuzu is NOT affected — at 19MB it is a different
    scale, and the objection was measured against LanceDB's 236MB. Embeddings themselves
    are unaffected: what changes is the STORE, not the embedder.
  WHAT_IS_WAITING_FOR_BAKIR: >-
    D08.2's brainstorm. designs/D08.2.md has the teacher-platform research finished —
    the MemoryProvider ABC, its lifecycle table, and the two decisions worth stealing
    (one active external provider, enforced, because tool-schema bloat IS our waist
    problem; and system_prompt_block() being STATIC with recall split into prefetch(),
