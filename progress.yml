          mutation M1 it emitted "[cache] breakpoints: tools array CHANGED —
          position 0 invalidated this turn" inside the unit run, and was silent
          without it. So when turns do arrive, silence will be meaningful.
        the_command_that_closes_it: >
          After any (lane, owl) pair has had 2+ turns:
            jq -r 'select(.msg|test("tools array CHANGED"))
                   | "\(.fields.session_key) owl=\(.fields.owl) n=\(.fields.tool_count)"' \
              ~/.stackowl/logs/stackowl.jsonl
          Read the DENOMINATOR first — count tool_loop entries per (session_key,
          owl) — then read the result. Expect silence for repeat pairs.
        note_on_log_level: >
          The memo hit/rebuild lines are DEBUG and the deployment runs at INFO, so
          they are invisible in production today. Deliberate, and NOT D01.6's
          mistake: D01.6's lesson applies to a measurement obtainable no other
          way. Here the acceptance signal is the cache_audit WARNING, which is
          visible; the DEBUG lines are supplementary detail for a debug session.
        gates: "ruff src/ = 46, mypy src/ = 78, ruff on the new test file clean. 33 tests green after restoring both mutations."
