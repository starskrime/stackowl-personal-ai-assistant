# ---------------------------------------------------------------------------
# DOCUMENTATION — tracked for EVERY finding, no exceptions
# ---------------------------------------------------------------------------
documentation:
  rule: >
    Every one of the 111 items ships a document at docs/reference-mapping/designs/<ID>.md
    meeting docs/reference-mapping/DOC_STANDARD.md. No item reaches `done` without one.
    The document is OPENED in `architect`, kept current through `implement`, and CLOSED
    in `document`. It is never written after the fact.
  why: >
    Hermes' docs/session-lifecycle.md is why we adopted their whole session model in an
    afternoon instead of reverse-engineering gateway/session.py for a week. The document
    is not overhead — it is what makes the NEXT item cheaper. A subsystem legible only by
    reading its source gets rebuilt by the next person who touches it.
  our_style_vs_theirs: >
    We take their structure (audience, source files, field tables, flow diagrams, config
    appendix) and ADD four sections they had no need for: Invariants, Observability,
    Failure modes, Verification. Hermes has no trace propagation, no mandated logging
    contract, no acceptance authority and no self-heal ladder, so their docs never had to
    describe those. We have all four and they are the parts of StackOwl worth keeping.
  mandatory_sections:
    - "Why this exists"
    - Model
    - Lifecycle
    - "Invariants — numbered, each phrased so it could become an assertion"
    - Configuration
    - "Observability — exact log strings, span names, a copy-pasteable query"
    - "Failure modes — detected by / recovery / what the user sees"
    - "Verification — commands that pass, which the validate stage executes"
    - "Related — including WHERE WE DIVERGED FROM HERMES AND WHY"
  hard_rules:
    - "Never state anything you have not run. The first draft of D01.6.md cited a DB path, a CLI tool and a test file that did not exist — caught by running its own Verification section (see DEBT-2)."
