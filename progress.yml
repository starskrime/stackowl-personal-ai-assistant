            They copy.deepcopy the whole message list on every call. We copy only
            what we mark. Our tool loop re-marks a growing list every round, so a
            deepcopy of 40 messages per round is real cost on the hot path.
          their_lack_of_a_minimum_guard: >
            Hermes places markers unconditionally. On a 4096-floor model several
            of theirs are silently dead. We keep our guard — this is one of the
            16 areas where StackOwl is genuinely ahead.
          envelope_layout_handling: >
            _can_carry_marker's OpenRouter-specific branches (top-level marker on
            role:tool causes a silent hang) do not apply — we speak native
            Anthropic. We took the INSIGHT (never spend a marker on a message
            that cannot carry it) without the transport-specific complexity.
        design_doc_correction_required: >
          designs/D01.2.md's Lifecycle section states "If a span fails the
          minimum guard its breakpoint is NOT reallocated". That is now FALSE and
          must be rewritten in the `document` stage. This is the fourth
          correction the implement stage has produced.
        verified:
          tests: "24 in test_cache_control.py (4 new) + 13 provider tests = 40 passed."
          mutations: "5 run, 5 killed: mark every carrier, take the oldest carriers, ignore markers already placed, drop the message minimum guard, mark uncarriable messages."
          test_updated_not_weakened: >
            test_short_tools_lose_their_marker_but_a_long_system_still_gets_one
            asserted 2 message markers; it now asserts 3 plus a total of 4. That
            assertion encoded the OLD no-reallocation decision, which was
            deliberately changed — not a test bent to make code pass.
    notes: >
      The lesson that generalises: the handoff's premise, the map's own text, and
      my first recollection of the minimum-prefix threshold were EACH wrong in a
      different direction. The premise was disproved by reading the tree, the map
      by grepping it, and the threshold by loading the API reference instead of
      trusting memory. None of the three would have been caught by writing the
      design first and checking later.

