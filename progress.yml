    recommendation each. Q1 is the one that matters: whether external providers are
    wanted AT ALL, or whether the valuable half is only the MemoryBridge split and the
    removal. Guessing it builds the wrong two thirds, so it was not guessed.

  NEXT: >-
    D08.2 (raised P2 -> P1) now carries the MemoryBridge split — a live conversation
