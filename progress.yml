# ---------------------------------------------------------------------------
# WORKFLOW — six stages, per item, in order. No stage may be skipped.
# ---------------------------------------------------------------------------
workflow:
  doc_standard: docs/hermes-mapping/DOC_STANDARD.md
  doc_location: "docs/hermes-mapping/designs/<ID>.md"
  doc_rule: >
    EVERY item ships a document. Hermes' docs/session-lifecycle.md is why we adopted their
    session model in an afternoon instead of reverse-engineering it for a week. Our template
    takes their structure and ADDS the four sections they have no need for — Invariants,
    Observability, Failure modes, Verification — because those are the parts of StackOwl
    worth keeping. See doc_standard for the template and rules.
  stages: [brainstorm, architect, implement, cleanup, test, validate, document]

  stage_status_values:
    - not_started
    - in_progress
    - blocked
    - done
    - no_change_needed   # legitimate terminal state for `keep` / `verify` tracks

  stage_definitions:
    brainstorm:
      skill: "superpowers:brainstorming"
      purpose: >
        Understand what Hermes designed for this component and WHY, understand what
        StackOwl does today and why, then explore the option space with Bakir.
      gate: "Bakir has answered the item's `Ask` questions. Decision recorded in `decisions`."
      output: "One or more entries appended to `decisions`."

    architect:
      skill: "bmad-agent-architect (Winston) or superpowers:writing-plans"
      purpose: >
        Turn the decision into a design: seams, interfaces, migration path, flag strategy,
        and an explicit statement of which Footprint Ladder rung this lands on.
      gate: >
        A written design exists at docs/hermes-mapping/designs/<ID>.md, names the ladder
        rung, names every file it will touch, and states how Law 1 and Law 2 are preserved.
      output: "design_doc path recorded in the item."

    implement:
      skill: "superpowers:test-driven-development + superpowers:subagent-driven-development"
      purpose: "Build it. Tests first. Minimal root-cause diffs. Enterprise, OOP, interface-driven."
      gate: "Feature complete and ships ON by default (not dormant behind a flag)."
      output: "Commits appended to `changes`."

    cleanup:
      skill: "tonyStyle + simplify"
      purpose: >
        Remove what this item made obsolete. Resolve the item's `dedup_target` if it has one.
        No dead code, no silent catches, 4-point logging present on every new execute().
      gate: "Nothing duplicated, nothing orphaned, ruff + mypy strict green."
      output: "Cleanup commits appended to `changes`."

    test:
      skill: "superpowers:test-driven-development"
      purpose: >
        Unit + gateway-driven integration tests built from BUSINESS requirements, mocking
        ONLY the AI provider. Targeted paths with timeouts — never a full pytest run.
      gate: "All new tests green; no pre-existing failure left unexplained or unfixed."
      output: "Test paths recorded in `changes`."

    document:
      skill: "none — follow docs/hermes-mapping/DOC_STANDARD.md"
      purpose: >
        Close the document opened during `architect`: bring every section to final, re-verify
        every source path / config key / default against the tree, stamp `Last verified` with
        today's date and the commit sha, and write the paragraph explaining where we diverged
        from Hermes and why.
      gate: >
        Document exists at docs/hermes-mapping/designs/<ID>.md, has all mandatory sections,
        its Verification section is copy-pasteable and passes, and every Invariant maps to a
        real test. Status line reads `live`.
      output: "doc path + last_verified recorded on the item."

    validate:
      skill: "superpowers:verification-before-completion"
      purpose: >
        Prove it works in the real platform, not just in tests. Restart gateway + core,
        drive a real turn, read the JSONL logs, confirm the behaviour changed.
      gate: >
        Evidence pasted into `notes` — log lines, measured numbers, or a transcript.
        For D01 items this MUST include a measured cache-hit / token-cost delta.
      output: "Item status flips to done; `updated` bumped."

# ---------------------------------------------------------------------------
# RULES — non-negotiable, derived from Bakir's standing preferences.
# ---------------------------------------------------------------------------
rules:
  process:
    - "READ docs/hermes-mapping/PROCESS.md before picking up any item. It is the method."
    - "Port the DESIGN, never the code. Read Hermes until you can explain it, then write our own in our idiom, then state the divergence in the doc."
    - "One item at a time. Finish all six stages before starting the next item."
    - "GRILL RULE (Bakir, 2026-07-25): ask 25 questions per item during brainstorm, and 25 more for each architecture design. Batch 4 per round. Purpose is to extract his full vision and knowledge, not to confirm ours."
    - "Never skip a stage. `no_change_needed` is an allowed outcome; silence is not."
    - "Update this file after EVERY stage transition, not at the end of the item."
    - "Append to decisions/changes. Never delete or rewrite an existing entry."
    - "If an item turns out bigger than one iteration, split it into <ID>a / <ID>b here."
    - "EVERY item ships a document per docs/hermes-mapping/DOC_STANDARD.md. No item reaches done without one."
    - "The document is opened in `architect`, kept current through `implement`, and closed in `document`. It is never written after the fact."
  engineering:
    - "Check existing code before writing new — wire/extend, never recreate."
    - "Fix the architecture, not the example that surfaced it."
    - "Minimal diffs. Change only the lines needed."
    - "Never disable or stub an existing feature without explicit consent."
    - "No hidden errors — recover loudly or propagate. Every catch logs."
    - "4-point logging (entry/decision/step/exit) on every new execute()."
    - "Schema changes are migrations only. Idempotent."
    - "All state under ~/.stackowl/ via StackowlHome. Never the project dir."
    - "No vendor names in src/. No hardcoded English keyword lists. Cross-platform."
    - "Finished features ship ON by default, not dormant."
  verification:
    - "Restart gateway + core after every fix and verify via JSONL logs, not PID."
    - "Never claim done without running the command and reading the output."
    - "Never silently fix a failing integration test — stop and report."
    - "Test runs are targeted paths with timeouts. Never a full pytest run (it hangs)."
  git:
    - "Commit at sub-story granularity when green and reviewed. Bisectable."
    - "Merge to main and push when an item is fully green."
    - "Never push do_not_push_to_git_research_only/."

# ---------------------------------------------------------------------------
# DEPLOYMENT FACTS — discovered 2026-07-25, constrains several items
# ---------------------------------------------------------------------------
deployment:
  active_provider:
    name: NeraAiRaw
    protocol: openai
    base_url: "http://llm-gateway.dev.nera.gov:4000/v1"
    model: neraai-v1-raw
    note: "The ONLY enabled provider. qwen36 / ollama-standard / ollama-powerful are all enabled:false."
  implications:
    - "Anthropic-style cache_control breakpoints DO NOT apply — this is an OpenAI-protocol endpoint."
    - "OpenAI-protocol caching is AUTOMATIC on a byte-identical prefix (typically >=1024 tokens). Law 1 therefore matters MORE, not less: stability alone earns the discount, and instability forfeits it silently with no marker to blame."
    - "D01.2 (cache breakpoints) is provider-dependent and should be re-scoped after D01.1 — it may become a no-op for this deployment."
  session_model:
    finding: "StackOwl has no session lifetime concept. /reset deletes history; nothing starts a new session. Sessions are effectively permanent per chat."
    implication: "Hermes' 'rebuild next session' escape hatch has no equivalent here. A session boundary may need to be invented as part of D01.1."

