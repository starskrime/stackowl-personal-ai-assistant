      (a hung handler must never freeze every other job's dispatch)' at 16:48,
      17:38, 17:58, 18:18, 19:08, 19:28, 20:08 on 2026-07-26 alone.
      _HANDLER_TIMEOUT_SEC is 1200s and its comment records the slowest observed
      legitimate dream_worker run as ~16 min — so it is now running past 20.
    why_it_matters: >
      The timeout works as designed (it frees the slot so other jobs still
      dispatch), but the dream worker never COMPLETES, so whatever it produces
      is never produced. Same shape as DEBT-18: a budget calibrated against a
      faster model, on a subsystem whose failure is invisible because the
      recovery path looks like success in the log.
    decision: "NOT fixed alongside DEBT-18 — different subsystem, different budget, and raising the OUTER handler timeout affects every job, so it needs its own measurement rather than a sympathetic guess."
    resolved: 2026-08-04
    THE_ORIGINAL_DIAGNOSIS_WAS_WRONG: >
      This entry said "the dream worker never COMPLETES, so whatever it produces
      is never produced", and hypothesised "a budget calibrated against a faster
      model". MEASURED on the live box, both halves are wrong:
        * It PRODUCES ~828 facts/day (kuzu_sync_log, 5-day average). 15,256 of
          43,032 committed facts are mirrored; 27,780 remain -> ~34 days of
          backlog at the current rate.
        * It is not a model-speed problem. kuzu_sync_handler step 2 is an LLM
          call PER FACT and the loop ran to completion however long that took,
          so a 50-fact batch simply outran the 1200s handler timeout.
      What it fails to do is RETURN. The dream worker checkpoints its phase, so a
      phase that never returns is resumed forever: kuzu_sync started 42-49x/DAY
      while contradiction/promotion/pruning started 1-5x. THE REAL COST IS PHASE
      STARVATION, not lost production — and that is not what this entry said.
      Also: the handler logged "entry" and then NOTHING until it was killed. No
      exit, no error, no per-fact progress. Twenty minutes invisible.
    the_fix: >
      Applied the pattern its own sibling already established. dream_worker
      ._mining_budget_s bounds mining at HALF the handler timeout, and its comment
      explains why: the later phases "need the other half... starving it would
      preserve the very ratchet this fixes". Mining was budgeted; kuzu_sync was
      NOT, so it consumed whatever mining left and then overran.
      kuzu_sync now takes a THIRD (it is the last phase, so it inherits whatever
      the earlier ones spent), returns SUCCESS with partial progress, and defers
      the remainder to the next tick. Deferred facts are never marked synced, so
      the backlog drains at the same rate — the run just finishes.
      Plus the missing per-fact STEP logging, per this repo's own rule.
    tests: "tests/memory/test_kuzu_sync_deadline.py — 5. Mutation M12 (remove the deadline break) fails exactly the bounded-batch test."
    note_on_my_own_test: >
      The first _Kuzu stub had the wrong method names, so every fact 'failed' and
      the deferral assertion passed for the wrong reason. Method names are now
      read from the handler rather than guessed.
    LIVE_CONFIRMED_AND_THEN_I_FOUND_MY_OWN_REGRESSION: >
      FIRST FIX, confirmed live after restart:
        23:53:05 "budget reached — deferring" synced=8 deferred=42 elapsed_s=403.8
        0 "handler timed out" errors since restart (was 47/day).
      The handler returns. Phase starvation is fixed.
      BUT THE SAME LOG LINE SHOWED A REGRESSION I HAD INTRODUCED. 403.8s of a
      1200s window — a fixed 0.33 share left ~800s unused, because it ignores how
      much the EARLIER phases actually spent (on that run mining had nothing to
      do). Measured rates:
        arrival ~419 facts/day
        drain BEFORE ~774/day  -> backlog shrinking ~355/day
        drain AFTER  ~384/day  -> backlog GROWING
      The old behaviour got its throughput precisely BECAUSE it ran the full
      window before being killed. Trading that for a clean return was the right
      goal and the wrong shape.
    second_fix: >
      Budget by REMAINING time, not a fixed share. kuzu_sync is the last phase, so
      it gets whatever is left: the dream worker now clocks the WHOLE handler
      (t0 was set after _mine(), so it never covered mining), passes
      total - elapsed - 60s margin, with a 60s floor so a late run still makes
      progress. A standalone scheduler call, which has no run clock, keeps the
      conservative default. Also fixed the mypy 78->79 this introduced.
    what_this_cost_me: >
      I declared the first fix good on the strength of "0 timeouts" and would have
      left a backlog that grows instead of shrinks. The number that caught it —
      elapsed_s=403.8 against a 1200s window — was in the very log line I used to
      claim success. Reading a metric for the ONE thing I was hoping to see is how
      a regression ships next to a green tick.
    status: "RESOLVED 2026-08-05 — first fix live-confirmed (0 timeouts); second fix pending the next tick."
