        _visible_text first concatenated EVERY value of a content-block dict,
        folding the block's own "type": "text" discriminator into the comparison
        and failing with a spurious leading "text". Then it handled only block
        dicts and not message dicts, so the messages assertion read "". Both were
        faults in the probe, fixed in the probe — the code under test was correct
        each time.
      a_restore_that_did_not_restore: >
        The mutation harness restored two files but G2 had mutated a THIRD
        (_cache_control.py), so the post-battery run reported 1 failed and I
        nearly recorded a green stage over a still-mutated tree. Caught by running
        the restore verification instead of trusting it; `git diff --stat src/`
