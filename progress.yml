items:
  - id: D01.1
    title: "System-prompt stability"
    domain: D01
    verdict: CONFLICT
    track: decide
    priority: P0
    wave: 1
    order: 3
    started: 2026-07-25
    implement_blocked_by: [D01.6, D01.7]
    map_ref: "docs/hermes-mapping/HERMES_STACKOWL_MAP.md#d011"
    gap: "Zero prefix reuse. Every turn pays full input price on a prompt that is mostly identical."
    depends_on: [D01.6]
    blocks: [D01.2, D01.4, D03.2, D09.1, D10.5, D10.6]
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: "docs/hermes-mapping/designs/D01.1.md"
    doc_last_verified: 2026-07-27
    decisions:
      - date: 2026-07-25
        stage: brainstorm
        round: "25-question grill (Q1-Q25)"
        by: Bakir
        answers:
          session_boundary: "Conversations roll over DAILY, at the first message after midnight in the user's local timezone."
          after_silence: "Fresh start that still remembers me — continuity comes from memory, not from carrying the old transcript."
          old_transcript: "Archived + searchable, AND a summary written into memory at rollover."
          cross_channel: "Telegram / CLI / TUI stay separate threads, but each can see what happened on the others."
          job_output: "Scheduled jobs and briefs get their own conversation, with a one-line note visible in the main thread."
          subagents: "Children get a fresh focused prompt — no parent prefix reuse."
          memory_shape: "A stable profile of the user, always loaded, PLUS a memory tool the model can call for depth. (Reconciles Q5 with Q12.)"
          memory_legibility: "Plain file the user can open and edit — Hermes MEMORY.md / USER.md model."
          memory_latency: "Newly learned facts land in the NEXT conversation, not the current one."
          memory_consent: "Notify, do not ask. Saved automatically, user informed, undo available."
          skills: "Names + descriptions always loaded; full body fetched on demand via tool call."
          persona: "Frozen for the life of a conversation. Nightly evolution + daily rollover means deferred costs ~nothing."
          owls_block: "Keep it, but resolve once per conversation instead of per turn."
          negotiable: "Per-message skill scoring may be dropped. Per-message memory search is replaced by profile + tool, not deleted."
          measure_first: "YES — build D01.6 instrumentation BEFORE D01.1 implementation."
          success_metric: "ALL FOUR: cached-input %, time-to-first-token, cost per 10-turn conversation, and a byte-identical-prompt invariant."
          migration: "Cut over immediately and restart the platform. No dual path, no flag."
          hard_invariants:
            - "The owl still sounds like itself (persona fidelity)."
            - "No tool the owl owns may become invisible."
            - "Scheduled jobs and proactive delivery keep working."
          recall_risk: "ACCEPTED. Memory is weak today, so a regression is tolerable; the profile + tool is expected to be a net gain. No recall-regression gate required."
          other_installs: "Friends run StackOwl on their own machines. Ship config default ON; they get it on update."
        approach_approved:
          id: A
          name: "Session Prompt Object"
          approved_by: Bakir
          approved_on: 2026-07-25
          summary: >
            Build a SessionPrompt ONCE when a conversation starts, persist it keyed by
            session_key + owl_name, and reuse it verbatim every turn. All six parts resolve at
            build time: persona+DNA, owls block, capability banner, skill CATALOGUE (names +
            descriptions only), user profile from an editable file, and model_window. Depth
            moves to tool calls the model makes when it needs them — `memory` for recall and
            `skill_view` for a skill body, both of which ALREADY EXIST. assemble.py shrinks
            from an orchestrator to a cache lookup.
          rejected:
            B: "Stable prefix + live suffix — keeps per-turn retrieval latency and leaves two assembly paths alive permanently."
            C: "Freeze on first turn, no daily boundary — a permanent conversation never reaches a 'next conversation', so the deferred-learning answers in Q7 and Q14 never arrive."
          wins: "Byte-identical prompt (automatic prefix caching on NeraAiRaw), plus the window probe, embedding scoring and DB reads all leave the critical path of every reply. Cost AND latency together."
          sequence: "D01.6 (measure) -> D01.7 (session lifecycle) -> D01.1 (frozen prompt)"
        implications:
          - "D08.1 (two-file curated memory) is pre-answered toward the curated layer — dedup target X4 resolved in principle."
          - "Daily rollover creates the natural home for D09.1 background review and D09.3 curator — three items converge on one seam."
          - "D01.2 is likely a no-op for this deployment: NeraAiRaw is OpenAI-protocol, where prefix caching is automatic."
          - "Q23 (friends on other machines) raises the priority of D18.3 profiles above what the map assumed."
          - "NEW PREREQUISITE FOUND: StackOwl has no session lifecycle at all. Tracked as D01.7."
    slices:
      note: >
        The freeze is the headline and it went LAST, deliberately. Freezing
        earlier would have pinned whichever value the first turn happened to
        carry, so every volatile part had to leave first. Prose version, with the
        reasoning, is in designs/D01.1.md "What shipped, and why the order
        mattered".
      order:
        1: "the next-contact banner left the prompt for its own delivered chunk"
        2: "SessionPromptStore + migration 0102"
        3: "stable user profile in, query-scoped recall out (prefs + lessons kept)"
        4a: "lessons selected by owl identity rather than by the question"
        4b: "skills became a stable CATALOGUE (names + descriptions; bodies via skill_view); focus clock stopped needing assemble to seed it"
        5: "the STABLE and VOLATILE tiers named; the wall-clock left the system prompt and rides the turn (DEBT-23)"
        6: "THE FREEZE — built once per (session_key, owl_name), reused verbatim"
      commits: [85afe9fb, 67d80bbe, d61b992f, 12cca5ee, cf280aa3]
    validate_result:
      date: 2026-07-27
      verdict: PASS
      invariant: "I1 — within one session_id AND one owl, every turn sends a byte-identical system prompt."
      evidence: >
        Two messages 74 seconds apart produced six model calls sharing ONE
        prompt_hash (aad8651ec66f6502): 19:00:21 / 19:00:24 / 19:00:24 and
        19:01:31 / 19:01:34 / 19:01:35. The cache says the same thing directly —
        "[pipeline] assemble: prompt source" read source=cold_build once and
        source=cached thereafter, both carrying that hash.
      baseline_it_replaced: "3 distinct prompts across 8 turns; 4 across 16. Now 1."
      measurement_trap: >
        A first pass showed distinct=2 for that lane. That was the QUERY, not the
        platform: it counted rows with prompt_hash='' — classifier and utility
        calls that carry no prompt. Filter those out and every remaining row
        shares one hash. Recorded because the next reader will run the same query
        and see the same 2.
      prerequisite: >
        I1 could not be measured at all until cost_records gained owl_name
        (migration 0103, DEBT-21). As first written I1 grouped by session_id
        alone, which counted a correct multi-owl lane as three violations.
    changes:
      - date: 2026-07-27
        stage: cleanup
        summary: "Removed what the freeze made obsolete; fixed one regression the freeze introduced."
        removed:
