  - id: DEBT-42
    found: 2026-08-05
    what: "The skill synthesizer mints numbered near-duplicates instead of recognising it already learned the lesson: 265 of 407 learned skills (65%) are -1/-2/-3 variants of an existing base name."
    evidence: >
      MEASURED on the live catalog 2026-08-05:
        407 learned skills / only 142 distinct base names
        265 rows are numbered duplicates of a base that already exists
      Worst offenders (count x base name):
        21x recover_tool_search_unachieved_effect
        16x tool_build_unachieved_effect_recovery
        14x web_fetch_unachieved_effect_recovery
        14x shell_retry_loop_breaker
        13x skill_management_failure_recovery_and_routing_fix
      ROOT CAUSE, read directly: skills/synthesizer.py:490-495 proposes a name,
      and while the target directory exists appends -1, -2, -3 ... then creates a
      NEW skill. Nothing asks whether this lesson is already known.
    why_it_matters: >
      This is the self-IMPROVEMENT loop failing in the same way every other loop
      in ADR-19 fails: the writer never reads what it already wrote. Learning the
      same lesson 21 times should STRENGTHEN one skill, not create 21. It is also
      the direct cause of the catalog rot ADR-19 #1 now decays: the duplicates
      are unused by construction, because only one of them can ever rank first.
    next: >
      Reinforce-instead-of-mint: when the proposed base name already exists,
      revive + record against the existing skill and do not create a variant.
      ADR-19 obligation (4) FEEDBACK, applied to the synthesizer.
    status: FIXED 2026-08-05 (same day) — skills/synthesizer.py::_reinforce_if_known.
    resolution: >
      The suffix was the symptom. The cause is that `_cluster_already_covered`
      dedupes on parent_traces — on the EVIDENCE — so a lesson re-derived from a
      NEW incident carries new trace_ids, never matches, and mints a variant.
      Now dedupes on the CONCLUSION as well: if the proposed name's BASE matches
      an existing learned skill (so an earlier `foo-3` still answers "we know
      foo", which matters because 265 such rows already exist), the synthesizer
      reinforces that skill instead of minting. Reinforcement bumps
      n_executions, which under ADR-19 also REVIVES a stale/archived skill — a
      lesson a fresh cluster just re-derived has plainly not stopped mattering.
      Deliberately does NOT rewrite the skill body: refining content is the
      refine pass's job, and a synthesizer that silently rewrote skills would be
      a far larger claim than this fixes. Fails open on any store error (B5) —
