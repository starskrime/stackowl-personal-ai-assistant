  - id: DEBT-18
    found: 2026-07-26
    what: "A recurring ERROR every ~11 minutes: '[rca] staged.analyze: a stage failed — no verdict'."
    evidence: >
      stackowl.parliament logs it at 16:53, 17:04, 17:15, 17:26, 17:37, 17:48,
      17:59, 19:44, 19:56, 20:07 and on every boot since — roughly every 11
      minutes, which is twice the 5.5-minute health-sweep cadence. Present in
      the FIRST log query of the 2026-07-26 session, hours before any change
      that day, so it is not caused by DEBT-6/7/12 or the D01.7 cleanup.
    also_seen: >
      A sibling recurring ERROR, '[scheduler] dream-50fd10ab: handler timed out
      — freed for retry/re-arm', on a similar cadence. Likely the same
      underlying stall; recorded together so they are investigated together.
    why_it_matters: >
      An RCA stage that never reaches a verdict means the platform's own
      root-cause analysis is silently producing nothing, on a schedule. That is
      the self-heal machinery this repo has invested heavily in, reporting
      failure into a log nobody reads — and it burns a model call each time.
    decision: "NOT investigated during the D01.7 test stage — unrelated subsystem, and a recurring stall needs its own systematic-debugging pass rather than a guess."
    status: resolved
    root_cause:
      date: 2026-07-27
      what: >
        StagedRcaSession's per-stage budget was a hardcoded 30s, never
        overridden by any caller. A stage is not one model call — it is a whole
        agentic turn (backend.run -> execute -> complete_with_tools, which can
        loop over tools). The exception in the log was a bare asyncio
        TimeoutError from _run_stage's wait_for.
      the_measurement_that_proved_it: >
        Across 2123 model calls in one day: median 12.4s, p90 93.5s, max 188s.
        The budget therefore sat BELOW the p90 of a single call, for something
        that makes several. Decisive corroboration: the SUCCESSFUL RCA duration
        distribution was truncated exactly at the limit — max 28.5s per stage
        against a 30s timeout — which is the signature of a budget cutting into
        real work rather than bounding a hang.
      it_was_not_always_broken: >
        605 verdicts against 323 timeouts across retained logs. Healthy through
        2026-07-23 (~5% failure), then 70% on 07-25, 62% on 07-26 and 100% on
        07-27. Model latency did NOT change (median 6.5-17s and p90 87-104s are
        stable across every day), so the collapse is the marginal budget losing
        a coin-flip more often as incident complexity grew — not a slower model.
    resolution:
      date: 2026-07-27
      instruction_from_bakir: >
        "i hope we are going to fix self heal logic, not a block or remove that
        logic." Both halves below are that instruction: the budget makes the
        analysis able to finish, and the retry makes a timeout recoverable. The
        RCA feature is not gated, throttled or disabled anywhere.
      part_a_budget: >
        DEFAULT_PER_STAGE_TIMEOUT_S = 240.0, a named module constant sized from
        the measurement above rather than from taste. Generous but FINITE,
        following the numeric-limits arc's own treatment of the sibling
        GOVERNOR_ACQUIRE_TIMEOUT_SECONDS (45s -> 1800s): removing the bound
        outright would let one stuck stage sit forever.
      part_b_self_heal: >
        A timed-out stage now RETRIES ONCE inside _run_stage, so all three
        stages heal uniformly (fix the architecture, not one call site).
        Previously any timeout propagated straight out of analyze(), discarding
        the whole run INCLUDING stages that had already succeeded, and nothing
        ever re-ran it — that incident simply never got a verdict. Bounded at one
        retry because every stage is a paid model turn; the happy path makes no
        extra call, pinned by its own test.
      the_invariant_that_caught_a_real_error: >
        A test asserts the inner budget stays strictly under the scheduler's
        _HANDLER_TIMEOUT_SEC (1200s), worst case being three stages plus one
        retry. It failed immediately on the first value tried: 300s makes the
        worst case exactly 1200s — EQUAL to the ceiling rather than under it, so
        a retry could have been killed mid-flight by the outer timeout. 240s
        gives 4 x 240 = 960s with 240s of margin. Without that assertion the fix
        would have shipped with a boundary bug in it.
      verified:
        tests: "9 in tests/parliament/test_staged_rca.py (4 new, red first). 54 passed across tests/parliament."
        gates: "ruff src/ 46 = DEBT-1 baseline; mypy src/ 78 = DEBT-8 baseline. Zero added."
        live: >
          CONFIRMED, and the number proves the diagnosis. The first RCA cycle
          after the restart produced a verdict in duration_ms=101710 — 101.7s
          across three stages, ~33.9s average per stage. The OLD budget was 30s
          PER STAGE, so this exact incident would have timed out under the old
          code; it now completes. Since the restart: 1 verdict, 0 stage
          failures, 0 timeout retries, 0 ERROR/CRITICAL.
        two_details_worth_keeping: >
          (1) ZERO retries fired, so the budget alone carried it — the retry is
          a safety net rather than a crutch, which is the happy path the
          no-extra-call test pins. (2) The verdict was verified=false: the
          verifier REJECTED the hypothesis. That is the loop working and
          returning an honest negative, an outcome that was impossible while
          every run died at 30s. A self-heal system that can say "not verified"
          is the point; one that can only time out is not.
    the_sibling_is_a_different_bug: >
      'dream-50fd10ab: handler timed out' is the OUTER scheduler timeout
      (_HANDLER_TIMEOUT_SEC, 1200s) firing on the dream worker, whose own
      comment records ~16 min as its slowest legitimate run. That is the dream
      worker genuinely exceeding 20 minutes, not the RCA budget, and it is NOT
      fixed here. Tracked as DEBT-19 so it is not lost behind this fix.
  - id: DEBT-23
    found: 2026-07-27
    what: "The system prompt carries the wall-clock time TO THE MINUTE, so it can never be byte-identical across turns — and freezing it would freeze the clock."
    evidence: >
      owls/base_prompt.py:150 —
      `human_now = now.strftime("%A, %B %d, %Y at %I:%M %p %Z")`. This is why
      base_len read a constant 3768 across every measured turn while prompt_hash
      kept changing: identical format WIDTH, different content. Earlier notes
      chased base_len and concluded the charter was stable; it is stable in
      length and unstable in bytes, which is the harder failure to see.
    why_it_outranks_DEBT_22: >
      The intent-class split (DEBT-22) breaks I1 only when a conversation mixes
      chat and work turns. A minute-resolution clock breaks it between ANY two
      turns more than a minute apart, which is essentially every conversation.
      This is the primary reason invariant I1 fails.
    the_conflict_it_creates_for_slice_5: >
      Slice 5 freezes the prompt for the life of a session, which would freeze
      the timestamp with it. Given the daily rollover boundary, the model could
      be told a time up to ~24 hours stale — defeating the exact purpose the
      timestamp serves, which base_prompt documents as grounding the model in
      the real date rather than its training cutoff. Freezing and grounding pull
      in opposite directions, and D01.1's design never addresses it.
    the_options: >
      (a) Coarsen the stamp to the DAY, so it is stable for a session bounded by
      a daily rollover and still grounds the model — cheapest, and it makes the
      daily boundary do double duty. (b) Move the clock OUT of the system prompt
      and into the user message, keeping the system prompt frozen and the time
      always accurate — costs a per-turn injection point. (c) Accept a frozen
      timestamp and rely on the rollover to refresh it. (d) Keep the clock live
      and abandon byte-identical prompts, measuring I1 over the frozen region
      only — which is approach B, already rejected.
    decision: "NOT chosen here. Slice 5 is blocked on it: building the freeze first would silently pick option (c) by omission, which is the one option nobody has argued for."
    resolution:
      chosen: "(b) — move the clock OUT of the system prompt and into the turn."
      when: 2026-07-27
      stage: "D01.1 implement (stage 2), confirmed closed in D01.1 cleanup"
      how: >
        owls/base_prompt.py gained volatile_turn_context(now, *,
        capabilities_offered), and pipeline/steps/execute.py delivers it per turn
        via _turn_context_prefix (three call sites). build_stable_base_prompt()
        takes NO clock argument at all, so the frozen tier cannot regain one by
        accident — the property is structural, not a convention a caller has to
        remember.
      pinned_by: >
        tests/owls/test_prompt_tiers.py — test_the_stable_tier_carries_no_clock,
        test_golden_stable_tier_text (byte-exact), test_golden_volatile_tier_text,
        and test_the_frozen_prompt_is_charter_then_stable_tier which asserts
        "Right now it is" is absent from what assemble freezes.
        Delivery side: tests/pipeline/test_volatile_tier_delivery.py.
    status: resolved
  - id: DEBT-22
    found: 2026-07-27
    what: "The base charter still differs between conversational and tool-using turns, which is now the LAST source of system-prompt variance."
    evidence: >
      base_len read 3768 on tool-using turns and 3684 on a tool-free one — the
      84-char difference first seen live on 2026-07-27 and originally mistaken
      for drift in the charter. It is not drift: build_base_prompt drops the
      ACTION: calling protocol when state.intent_class is in TOOL_FREE_CLASSES.
    why_it_is_deliberate: >
      Documented in assemble.py: teaching the calling PROTOCOL to a turn with
      nothing to call gave a less instruction-following model a pattern to
      imitate with nothing behind it — traced live as a plain conversational
      reply being flagged and floored as an unparsed tool-call attempt. So this
      is a real defence, not an oversight.
    why_it_matters_now: >
      After slices 1, 3, 4a and 4b, every other part of the prompt is stable per
      (session_key, owl_name). This is the only remaining reason invariant I1
      can fail, and it fails exactly when a conversation mixes chat turns with
      working turns — which is the normal case.
    the_options: >
      Either the protocol becomes unconditional (paying the imitation risk the
      comment documents, possibly mitigated by wording), or I1 is scoped to
      turns of the same intent class, or the intent-class split becomes part of
