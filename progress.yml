        slice: "3b part 4 — the lane row tells the truth (identity + two real counters)"
        files:
          - "src/stackowl/db/migrations/0096_session_identity_and_counters.sql (new)"
          - "src/stackowl/sessions/models.py — SessionSource.identity_key; SessionEntry gains identity_key/message_count/completed_turns"
          - "src/stackowl/sessions/store.py — counters incremented, identity COALESCEd, record_completed_turn(), payload rewritten"
