        summary: "Gateway-driven integration for the frozen prompt, mocking ONLY the provider — and mutation-tested so it can actually fail."
        added:
          - "tests/pipeline/test_d011_frozen_prompt_gateway_integration.py — three tests on the REAL path: GatewayScanner -> route -> PipelineState -> AsyncioBackend -> the pipeline -> the REAL SessionPromptStore against a REAL db -> the provider's system message. Only the AI provider is faked."
        the_design_problem_and_its_fix: >
          Two ordinary turns produce identical prompts even with the freeze
          entirely absent, because nothing in a test harness differs between
          them — so the obvious assertion would pass on broken code. The tests
          therefore MUTATE THE OWL'S PERSONA between turn 1 and turn 2: a frozen
          prompt keeps the original, a rebuilt one picks up the change. That also
          encodes a real recorded decision (Q14 — persona frozen for the life of
          a conversation, evolution landing at the next rollover).
        mutation_tested: >
          Proven rather than assumed. Disabling the cache hit in assemble
          (`if False and cached is not None`) turned
          test_two_turns_of_one_conversation_send_a_byte_identical_system_prompt
          RED, and test_prompt_freeze.py's I1 test with it. The mutation was then
          reverted and `git diff src/` confirmed EMPTY.
          Two honest findings from that run, recorded in the file's docstring:
          (1) the byte-equality assertion alone does NOT bite — both rebuilt
          prompts were still identical; it is the persona assertion that fails,
          and in test_prompt_freeze.py only the `saved == 1` count caught it.
          (2) test_a_new_conversation_picks_up_the_evolved_persona also survives
          the mutation and cannot do otherwise; it is not a freeze test alone,
          it is the other jaw of the vice (frozen WITHIN a conversation,
          RELEASED at the boundary — a permanently stuck cache fails it).
        invariant_coverage:
          I1: "tests/pipeline/test_d011_frozen_prompt_gateway_integration.py (gateway) + test_prompt_freeze.py::test_the_second_turn_reuses_the_first_turns_prompt (unit)"
          I2: "test_prompt_freeze.py::test_no_store_wired_still_produces_a_prompt — the freeze is an enhancement to a working pipeline, never a precondition"
          I3: "test_a_tool_still_dispatches_on_the_frozen_turn — turn 1 conversational, tool dispatched on turn 2 off the CACHED prompt. This is DEBT-22's fear in concrete form. Plus 123 passed across the three tool-registry suites + tests/notifications/."
          I4: "the persona-marker assertions above prove the owl's own system_prompt reaches the model verbatim through the frozen path"
          I5: "tests/notifications/ green within that 123; background lanes additionally covered by test_a_turn_with_no_incarnation_is_never_frozen"
          I6: "test_prompt_freeze.py::test_a_different_owl_gets_its_own_prompt + test_a_new_incarnation_rebuilds"
        gate:
          tests: "tests/pipeline 1065 passed (1062 + 3 new); I3/I5 suites 123 passed"
          ruff: "new file clean; src/ 46 UNCHANGED"
          mypy: "78 UNCHANGED; git diff src/ empty (mutation fully reverted)"
    notes: >
      Two documented lessons from this item's cleanup. (1) A grep returning zero
      hits proves a symbol is unreferenced, NOT that a capability is unwanted —
      Bakir rejected the proposal to delete the skill-scoring machinery and the
      evidence then went against deletion (DEBT-25). (2) An assertion that
      cannot fail is worse than no assertion: the intent-class equality test
      passed for a whole slice while the regression in DEBT-24 was live,
      because its harness registered no tool_registry.

  - id: D01.2
    title: "Prompt-cache breakpoints"
    domain: D01
    verdict: MISSING
    track: adopt
    priority: P0
    wave: 1
    order: 4
    map_ref: "docs/hermes-mapping/HERMES_STACKOWL_MAP.md#d012"
    gap: "Even after D01.1, no markers means no cache."
    depends_on: [D01.1]
    blocks: []
    dedup_target: null
    started: 2026-07-27
    stages:
      brainstorm: done
      architect:  done
      implement:  not_started
      cleanup:    not_started
      test:       not_started
      validate:   not_started
      document:   not_started
    doc: "docs/hermes-mapping/designs/D01.2.md"
    doc_last_verified: 2026-07-27
    architect_result:
      date: 2026-07-27
      round: "25 architect questions, batched 4 per round"
      ladder_rung: "1 — extend existing code. No new core tool, no plugin, no MCP server."
      law_1: >
        Not merely respected — this item is the MECHANISM that enforces Law 1 on
        the Anthropic path. D01.1 made the prompt byte-identical; D01.2 is what
        actually claims the discount for it.
      law_2: >
        Nothing is added to the model's tool surface; the change is
        provider-internal and invisible to every prompt. ONE stated exception:
        the invalidator audit hooks pipeline/steps/assemble.py, because that is
        where the frozen prompt is built and so the only place a silent
        invalidator can be caught at its source.
      files_to_create:
        - "src/stackowl/providers/_cache_control.py — ONE pure function, apply_cache_breakpoints(tools, system, messages, *, model, ttl) -> (tools, system, messages). No I/O, no provider dependency, unit-testable with no client."
        - "src/stackowl/db/migrations/0104_*.sql — probe state keyed by (provider, model)."
        - "tests/providers/test_cache_control.py — replay fixture: byte-exact outgoing request shape + a canned usage response."
      files_to_change:
        - "providers/base.py — supports_cache_breakpoints property, default False (matches supports_vision/supports_document)."
        - "providers/anthropic_provider.py — returns True; ONE private wrapper that all 3 create() sites (361, 604, 721) AND the stream path route through; populate cached_input_tokens at _record_stream_usage_safe:163 and _record_usage_safe:675."
        - "config/provider.py — cache_ttl on ProviderConfig (per provider, alongside context_chars/max_output_tokens). Default '5m'."
        - "pipeline/steps/assemble.py — silent-invalidator audit at cold build."
      layout_chosen: "tools + full system + last 2 messages = exactly 4. The STABLE TIER marker is dropped."
      why_the_stable_tier_lost: >
        It is the span Hermes considers the whole point — the cross-conversation
        prefix a NEW session still hits. But it is ~928 tokens, below the
        cacheable minimum on every model except Opus 5 (512). On Opus 4.8 it
        misses by ~96; on Opus 4.6/Haiku 4.5 the floor is 4096 and even the FULL
        system prompt (~2712) misses. Spending a breakpoint there would be
        spending it on nothing for most deployments.
      the_guard: >
        Minimum is NOT in the Models API, so nothing live can be asked for it.
        Instead: measure with count_tokens (once per session, cached; falls back
        to chars/4 with margin when a gateway lacks the endpoint), then PROBE by
        reading cache_creation_input_tokens. Learn ASYMMETRICALLY — persist only
        POSITIVE results. A zero is never persisted and never treated as dead,
        and only counts as "below minimum" after that endpoint has reported a
        non-zero cache field at least once (D01.6's I4 reused).
      why_asymmetric_learning_is_load_bearing: >
        Bakir first chose "trust cache_creation on the first response" AND
        "persist to the database". Put back to him because the two interact
        badly: a field-stripping gateway guarantees a zero on turn one, which
        would be persisted as "marker is dead" and disable the feature FOREVER,
        across restarts, with no error. D01.6 already measured that NeraAiRaw
        reports no cache fields in any accepted shape. He resolved it to
        positives-only, which self-heals.
      invariants:
        I1: "Never more than 4 cache_control markers in one request."
        I2: "A marker is never placed on a span below the model's minimum."
        I3: "A marking failure never fails the turn — log at error, send unmarked. Mirrors D01.1's I2."
        I4: "A provider without the capability sends a byte-identical request to today's — what makes shipping ON safe here."
        I5: "A zero cache reading is never persisted and never disables marking."
      ships: "ON by default, capability-gated. No enable flag — the gate already makes it inert on every non-Anthropic provider, so the standing rule is satisfied honestly rather than with a flag that defaults off forever."
      cannot_be_verified_here: >
        Whether Anthropic honours these markers. This box runs no Anthropic
        backend, and D01.6 established NeraAiRaw reports no cache fields at all,
        so even pointing StackOwl at a gateway would not settle it. The DONE
        criterion explicitly requires the document's Status line to say the live
        half is UNVERIFIED — no green check that reads as proof it ran.
    the_premise_was_DISPROVED_first: >
      The handoff said D01.2 was "likely a no-op — NeraAiRaw is OpenAI-protocol,
      where prefix caching is automatic". Ten minutes of checking killed that:
      anthropic_provider.py is 802 LIVE lines, constructed at registry.py:81,
      shipped with setup/providers/anthropic.yaml and handled in
      setup/minimal.py:44. Anyone who picks Anthropic during setup gets a fully
      reachable path with ZERO prompt caching. It is a no-op for Bakir's own box,
      not for the four protocols StackOwl ships.
      Also corrected: the map claims "no occurrence of cached_tokens anywhere in
      src/". Stale — D01.6 added a 3-shape READER at openai_provider.py:114.
      What genuinely does not exist is the WRITER: zero `cache_control` in src/.
    facts_from_the_api_reference:
      note: "Loaded via the claude-api skill rather than quoted from memory — the first estimate of the minimum was hedged for exactly this reason."
      minimum_cacheable_prefix: >
        MODEL-DEPENDENT and NOT monotonic: 512 tokens (Opus 5, Fable 5), 1024
        (Opus 4.8, Sonnet 5/4.6/4.5), 2048 (Opus 4.7, Haiku 3.5), 4096 (Opus
        4.6/4.5, Haiku 4.5). Below-minimum markers fail SILENTLY —
        cache_creation_input_tokens: 0, no error.
      what_that_means_for_us: >
        Our stable tier is ~928 tokens (3713 chars) and our whole frozen system
        prompt ~2712 (10847 chars). So a marker at the end of
        build_stable_base_prompt() — the elegant idea D01.1 seemed to hand us —
        only works on Opus 5. On Opus 4.6/4.5/Haiku 4.5 even the FULL system
        prompt is below the floor and nothing caches at all.
      breakpoint_limit: "4 per request — Hermes' constraint is real."
      ttl_and_pricing: "ephemeral = 5min; {'ttl':'1h'} = 1 hour. Writes 1.25x (5m) / 2x (1h); reads 0.1x. Break-even 2 requests at 5m, 3+ at 1h."
      render_order: "tools -> system -> messages. Tools at position 0, so a tools marker covers the largest shared span."
      lookback: "A breakpoint searches back at most 20 CONTENT BLOCKS for a prior entry."
      concurrency: "N parallel requests sharing a prefix ALL pay full price — none can read what the others are still writing."
      auto_caching_availability: "Top-level auto-caching is 1P-only: NOT on Bedrock or Vertex, beta on Foundry."
    decisions:
      - date: 2026-07-27
        stage: brainstorm
        round: "25-question grill + 3 contradictions put back"
        by: Bakir
        answers:
          scope: "Wire Anthropic FULLY — read + write. Not reading-only, not no_change_needed."
          layout: "Full Hermes-style 4-marker layout, INCLUDING the tools marker."
          tools_marker: "YES — highest-value breakpoint (position 0, largest shared span, and the only one that comfortably clears the minimum)."
          minimum_guard: "Measure and skip. NEVER place a dead marker — resolve the model's minimum, measure the candidate prefix, place only if it clears. Turns a silent failure into a logged decision."
          capability_gate: "New supports_* capability alongside supports_vision/supports_document/supports_tools. Default False; AnthropicProvider True. Dispatches on declared capability, never a provider name."
          single_seam: "ONE module owns every marker — tools, system and messages. Hermes splits this across prompt_caching.py, anthropic_adapter.py and run_agent.py, which is why their own docs undercount their layout."
          placement: "providers/_cache_control.py — matches the existing _blocks/_react/_truncate/_wrapup/_resilient_round convention. (Placement voted, per standing rule.)"
          wire_shape: "Convert `system` string -> block list ONLY when actually placing a marker. Unmarked requests stay byte-identical to today."
          ttl: "5min default; config key for 1h. 1h doubles write cost and needs 3+ turns to break even."
          reader: "Native Anthropic reader — its usage fields are first-class, so shape-probing is dishonest here."
          invalidator_audit: "Ship a startup audit against Anthropic's documented silent-invalidator list. prompt_hash already detects instability; this names the CAUSE instead of the symptom."
          verification: "Replay fixture built from the real API docs — no key, no network."
          done_criteria: "Unit-green + fixture + the doc STATING PLAINLY in its Status line that the live half is UNVERIFIED on this deployment. No green checkmark that reads as proof it ran against the real API."
          out_of_scope_flag_only:
            - "Parliament parallel fan-out (round_runner.py:73 asyncio.gather) forfeits the shared-prefix discount — N concurrent owls all pay full price. FLAG, do not edit."
            - "The 20-block lookback: MEASURED 9.6% of our tool-using turns exceed it (666 traces; p50 3 calls, p90 10, max 42). Match Hermes for now; D03 tool-result pruning fixes it at the root rather than spending a breakpoint."
            - "D01.3's varying tools array invalidates everything at position 0, so the tools marker delivers little until D01.3/D05.4 land. Flag loudly; it is measured evidence FOR D01.3 rather than a reason to skip the marker."
        contradictions_put_back_and_resolved:
          - conflict: "Would edit parliament/ (another item's territory, costs latency) for an UNMEASURED discount, while accepting a MEASURED 9.6% loss rather than spend one breakpoint."
            resolution: "BOTH CONSERVATIVE. Flag both, edit neither. D01.2 builds markers; Parliament staggering belongs to whoever owns Parliament, and D03 pruning removes the 20-block exposure at its root."
          - conflict: "Duplication rejected for the marker writer ('one module owns every marker') but accepted for the reader, leaving an Anthropic-shaped cache_read_input_tokens probe inside openai_provider.py."
            resolution: "Keep the native reader — Anthropic's usage fields are first-class, so a direct read genuinely beats a shape-prober. File the misplaced openai_provider probe as its own tracked debt rather than silently leaving it."
          - conflict: "'Never place a dead marker' (invisible-change-averse) vs 'always convert the wire shape' (changes every Anthropic request including non-beneficiaries)."
            resolution: "Convert ONLY when marking. Blast radius matches benefit; unmarked requests stay byte-identical."
    changes: []
    notes: >
      The lesson that generalises: the handoff's premise, the map's own text, and
      my first recollection of the minimum-prefix threshold were EACH wrong in a
      different direction. The premise was disproved by reading the tree, the map
      by grepping it, and the threshold by loading the API reference instead of
      trusting memory. None of the three would have been caught by writing the
      design first and checking later.

