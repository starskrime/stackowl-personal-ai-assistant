# ---------------------------------------------------------------------------
# DOCUMENTATION — tracked for EVERY finding, no exceptions
# ---------------------------------------------------------------------------
documentation:
  rule: >
    Every one of the 111 items ships a document at docs/hermes-mapping/designs/<ID>.md
    meeting docs/hermes-mapping/DOC_STANDARD.md. No item reaches `done` without one.
    The document is OPENED in `architect`, kept current through `implement`, and CLOSED
    in `document`. It is never written after the fact.
  why: >
    Hermes' docs/session-lifecycle.md is why we adopted their whole session model in an
    afternoon instead of reverse-engineering gateway/session.py for a week. The document
    is not overhead — it is what makes the NEXT item cheaper. A subsystem legible only by
    reading its source gets rebuilt by the next person who touches it.
  our_style_vs_theirs: >
    We take their structure (audience, source files, field tables, flow diagrams, config
    appendix) and ADD four sections they had no need for: Invariants, Observability,
    Failure modes, Verification. Hermes has no trace propagation, no mandated logging
    contract, no acceptance authority and no self-heal ladder, so their docs never had to
    describe those. We have all four and they are the parts of StackOwl worth keeping.
  mandatory_sections:
    - "Why this exists"
    - Model
    - Lifecycle
    - "Invariants — numbered, each phrased so it could become an assertion"
    - Configuration
    - "Observability — exact log strings, span names, a copy-pasteable query"
    - "Failure modes — detected by / recovery / what the user sees"
    - "Verification — commands that pass, which the validate stage executes"
    - "Related — including WHERE WE DIVERGED FROM HERMES AND WHY"
  hard_rules:
    - "Never state anything you have not run. The first draft of D01.6.md cited a DB path, a CLI tool and a test file that did not exist — caught by running its own Verification section (see DEBT-2)."
    - "One document per subsystem. When several items land on one subsystem the later ones EXTEND it; they never add a second. Anti-duplication applied to prose."
    - "`Last verified` is a date AND a commit, never 'recently'. If you cannot re-verify, set status `stale` rather than leave a confident lie."
    - "Every Invariant must map to a real test. If it cannot be tested it is a wish — sharpen it or delete it."
  status:
    written: 4        # D01.1, D01.6, D01.6-baseline, D01.7
    closed: 1         # D01.6 (amended 2026-07-25 when D01.7 renamed a column it cited)
    outstanding: 107

# ---------------------------------------------------------------------------
# KNOWN DEBT — tracked, not ignored (feedback_no_skipping_preexisting_fails)
# ---------------------------------------------------------------------------
known_debt:
  - id: DEBT-31
    found: 2026-07-27
    what: "D01.3's premise — that context_budget varies the tools array every turn — has never been MEASURED."
    evidence: >
      The map states it as fact ("pipeline/context_budget.py runs a greedy
      relevance-ranked budgeter every turn ... the tools array therefore differs
      turn to turn"), and D01.3's whole resolution depends on it. But no
      measurement exists, exactly as D01.2's own "no-op" premise was asserted and
      turned out false.
    why_it_matters_for_D01_2: >
      Tools render at position 0, so a varying tools array invalidates EVERY
      breakpoint on every turn. D01.2's most valuable marker is worth nothing
      until this is resolved.
    decision: >
      D01.2 does not fix it, but its design ships a per-session tools-array hash
      that logs a WARNING when the array changes between turns. That converts
      D01.3's premise from an assumption into a measured fact before D01.3 is
      picked up. Marker still placed — it costs nothing extra and pays off the
      moment D01.3 lands.
    hand_to: D01.3
    status: open
  - id: DEBT-30
    found: 2026-07-27
    what: "The 20-block cache lookback is exceeded by 9.6% of our tool-using turns."
    evidence: >
      Anthropic documents that a cache breakpoint searches back at most 20
      CONTENT BLOCKS for a prior entry; beyond that it silently misses. Measured
      across all rotated logs: 666 tool-using traces, p50 3 tool calls, p90 10
      (~20 blocks — exactly the threshold), max 42 (~84 blocks). 64 traces
      (9.6%) exceed it.
    how_hermes_avoids_it: >
      They do not. Zero references to the lookback anywhere in their tree. They
      are protected only incidentally: the marker is re-placed on every request
      (so the gap stays small in MESSAGE terms), and context_engine
      prune_tool_results_only plus automatic compaction keeps block counts down.
    decision: >
      MATCH Hermes for now rather than spend one of only four breakpoints on an
      intermediate marker. D03's tool-result pruning removes the cause; a marker
      would only mask the symptom. Recorded with the measurement so D03 inherits
      evidence rather than a hunch.
    hand_to: D03
    status: open
  - id: DEBT-29
    found: 2026-07-27
    what: "Parliament's parallel fan-out forfeits the shared-prefix cache discount."
    evidence: >
      parliament/round_runner.py:73 uses asyncio.gather, and orchestrator.py:28
      documents "parallel fan-out via asyncio.gather". Anthropic's docs are
      explicit: N concurrent requests sharing a prefix ALL pay full price,
      because none can read a cache entry the others are still writing. Every
      owl in a Parliament round shares the tools prefix at position 0 — the
      largest shared span.
    the_documented_fix: "Send one request, await its first streamed token, then release the remaining N-1."
    decision: >
      FLAG ONLY, do not edit. Staggering trades latency for cost in a feature
      built specifically for parallelism — that is a product decision for
      whoever owns Parliament, not something D01.2 should make from inside an
      item about provider markers. Bakir initially chose to fix it here, then
      reversed when the inconsistency was put back to him (see D01.2 brainstorm
      contradiction 1): editing parliament/ for an UNMEASURED discount while
      accepting a MEASURED 9.6% loss elsewhere was incoherent.
    status: open
  - id: DEBT-28
    found: 2026-07-27
    what: "The Anthropic-shaped cached-token probe lives in the OpenAI provider; the Anthropic provider reads neither cache field."
    evidence: >
      openai_provider.py:138 probes for `cache_read_input_tokens` — an
      ANTHROPIC usage field name — inside its three-shape reader. Meanwhile
      `grep -in "cache" src/stackowl/providers/anthropic_provider.py` returns
      NOTHING: it reads input_tokens/output_tokens at
      _record_stream_usage_safe:163 and _record_usage_safe:675 and never
      populates cached_input_tokens, even though base.py:158 has accepted that
      parameter since D01.6.
    decision: >
      D01.2 writes a NATIVE Anthropic reader rather than extracting a shared one
      — Anthropic returns cache_read_input_tokens and
      cache_creation_input_tokens as first-class usage fields, so shape-probing
      there would be dishonest. The misplacement in openai_provider is tracked
      here rather than fixed in-flight, because it is a separate concern from
      making Anthropic report at all. Noted that this is duplication accepted
      for the READER while rejected for the WRITER — the asymmetry was put back
      to Bakir and confirmed deliberate (D01.2 brainstorm contradiction 2).
    status: open
  - id: DEBT-27
    found: 2026-07-27
    what: >
      D01.1's freeze engages ONLY for lanes that arrive through channel ingress.
      Every background and scheduled lane has an empty session_id, so it neither
      loads nor saves a SessionPrompt and cold-builds on every single call.
      Measured live: 1 cached vs 51 cold_build across the whole log.
    evidence: >
      assemble.py gates BOTH the cache read and the freeze write on
      `state.session_id` being truthy (`if _prompt_store is not None and
      state.session_id:`). session_id is minted by
      sessions/ingress.py::resolve_turn_session, which has exactly ONE caller in
