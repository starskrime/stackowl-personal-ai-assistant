    why_escalated: >-
      IT CONTRADICTS A RECORDED CLAIM, which the loop must surface rather than work around.
      progress.yml D08.2 states "the promoter''s last consumers ARE those callbacks" — the
      three channel approve/reject handlers. With all three now gone (seams 1 and 2), the
      promoter should have been free. It is not: src/stackowl/tui/widgets/memory_review_panel.py
      calls force_promote at line 175 behind an "approve" action. A FOURTH approve/reject
      surface that no inventory listed, and it is user-facing, so it is a hard stop.
    what_is_known: >-
      MEASURED, and the open question is now closed: THE PANEL IS NEVER CONSTRUCTED IN
      PRODUCTION. Nothing in src/ builds a MemoryReviewPanel, nothing in tui/ routes to it,
