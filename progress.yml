    decisions:
      - date: 2026-07-29
        stage: brainstorm
        round: "5 questions over 2 rounds; Hermes read FIRST per the standing rule. Brainstorm is IN PROGRESS, not complete — the remaining questions are named below rather than the count being padded."
        by: Bakir
        what_hermes_actually_does:
          toolsets: "Mandatory membership — 'All tools must be part of a toolset to be accessible'. enabled_toolsets (allowlist) or disabled_toolsets (denylist). Built ONCE at agent init (agent_init.py:1386); the conversation loop never rebuilds it."
          availability: "Per-tool check_fn predicate, TTL-cached, plus requires_env."
          dynamic_schema_overrides: "A zero-arg callable returning schema overrides applied at get_definitions() time, so e.g. delegate_task's description reflects the user's REAL limits. NOTE THE TENSION: this makes the schema config-dependent, which is a cache-stability risk they absorb via a config-mtime fingerprint in their memo key."
          progressive_disclosure: >
            THE KEY MECHANISM. tools/tool_search.py: when deferrable (MCP /
            non-core plugin) tools would consume more than threshold_pct
            (default 10%) of the model's CONTEXT WINDOW, they are REPLACED in the
            model-visible list by three bridge tools — tool_search /
            tool_describe / tool_call. Config is enabled: auto|on|off.
          memoization: "Cache key = enabled/disabled toolsets + registry generation + config mtime fingerprint + delegated-child context."
        CORRECTION_2026_07_29_I_WAS_WRONG: >
          THE CLAIM BELOW IS FALSE AND DROVE A DECISION. I told Bakir our
          budgeter "drops tools outright — they become unreachable", making it a
          CAPABILITY difference from Hermes. The tree says otherwise, and I found
          it while designing the seam:
            * tools/meta/tool_search.py:1 — "lexical, deterministic discovery
              over the FULL tool catalog"
            * tool_search.py:158 — hits are "promote[d] into the NEXT turn's
              presented schema"
            * presentation.rank_candidates — unmatched tools follow "in a
              deterministic by-name tail so none are dropped"
            * registry.to_provider_schema:417 — "overflow stays reachable
              through tool_search"
          StackOwl ALREADY defers-not-drops, exactly as Hermes does. The bridge,
          the toolsets and the promotion-into-next-turn all exist. "Port the
          bridge" was porting something we already have, and is MOOT.
          WHAT IS GENUINELY BROKEN is narrower: the discretionary set is ORDERED
          BY LEXICAL RELEVANCE TO request_text, so the presented set changes with
          every query. That is D01.3's measured instability — an ordering
          problem, not a capability loss.
          WHY IT MATTERS THAT THIS SURFACED: the learned per-owl core is not an
          addition on top of a port, it is the DIRECT REPLACEMENT for the
          request_text ranking. Same seam, a stable input instead of a per-query
          one. The design got smaller and better aimed by being wrong first.
        SUPERSEDED_the_capability_difference_that_decided_it: >
          HERMES NEVER DROPS A TOOL. Ours does: context_budget selects a subset
          per query, and the tools left out are simply not callable that turn —
          a silent capability loss on top of the cache instability D01.3
          measured. Hermes defers behind a bridge instead, so the array is stable
          AND nothing becomes unreachable. That is not a caching refinement, it
          is a strictly better answer to the same constraint.
        answers:
          overflow: "PORT THE BRIDGE — defer, never drop. Stable core toolset always present; overflow reachable via tool_search/describe/call."
          next_level: >
            LEARNED PER-OWL TOOLSETS, SESSION-BOUNDARY ONLY. Each owl's core set
            is derived from MEASURED usage and recomputed at rollover, never
            mid-session — so cache stability holds because it changes only where
            D01.1 already permits change, and D01.4's invalidation seam applies
            it. This is genuinely beyond the reference platform: they have ONE
            agent and static human-edited config, so they cannot do it.
          search_scope: >
            FILTER SEARCH RESULTS BY THE OWL'S ENVELOPE. Security does not
            require it — authz is enforced at dispatch and execute.py:430 states
            a tool can be 'visible but still DENIED' — but efficiency does: an
            unfiltered search advertises dead ends the model will call and get
            refused for, burning a 15-35s round-trip. Presentation and
            authorisation stay separate mechanisms; the search surface simply
            stops suggesting the impossible.
          cold_start: "THE OWL'S DECLARED CAPABILITY PRESET. owl_build already infers a capability from a plain-language goal (owl_build_infer.infer_capability) and manifests carry capability_profile — the declaration exists and is already the authz basis, so nothing new is invented."
          learning_signal: "FREQUENCY x SUCCESS, RECENCY-WEIGHTED. Promote what the owl calls often and succeeds with; demote what it has not called. Never DELETES — only moves a tool between core and bridge, so nothing becomes unreachable by learning either."
        SUPERSEDED_the_signal_source_DOES_NOT_EXIST_YET: >
          FALSE — corrected during architect, see
          CORRECTION_2026_08_01_NO_MIGRATION_IS_NEEDED below. The claim that
          "task_outcomes has owl_name and tool_call_count but NOT tool names" was
          asserted from the column list I remembered rather than the one the
          database has. It has tool_sequence. Kept here because it is the third
          time in this item that I described the tree instead of reading it, and
          the pattern is the finding.
        questions_still_to_ask:
          - "ANSWERED BY THE TREE during architect, no decision taken: membership lives at BOTH ends and neither wins. base.py:82-86 — the tool declares its toolset_group, the owl's capability_profile lists group names, and a tool joins the presented set when its group is in that profile. Presentation is the intersection. A manifest-side per-tool override would add a second expression of membership plus a precedence rule; nothing here needs one."
          - "Does the bridge itself count against the four D01.2 cache breakpoints, i.e. do the three bridge tools sit in the stable prefix?"
          - "What is the demotion threshold — N sessions unused? — and is it time-based or session-count based?"
          - "Does a learned promotion need to respect max_tools, or is the core set unbounded once it is stable?"
          - "ANSWERED: D05.4's bridge is merged INTO this item; its unrelated DEBT-25 inheritance is rehomed to D10.6."
        round_2_answers:
          what_D05_2_actually_IS: >
            SMALLER THAN THE MAP IMPLIES — and this was found by reading the tree,
            not the map. StackOwl ALREADY HAS TOOLSETS: Tool.toolset_group exists
            (base.py:86), 54 tools declare one, and base.py:83 states an owl's
            capability_profile selects groups (ADR-11 / E1-S4). The budgeter then
            runs ON TOP and re-selects per query, which is what breaks stability.
            So D05.2 is "make the existing toolsets AUTHORITATIVE and delete the
            per-query re-selection", not "build a toolset system". Wire and
            extend, never recreate.
          d05_4_merge: "MERGED. The bridge folds into this item — disclosure is what happens to whatever the stable toolset does not present, so splitting it would mean designing one mechanism twice."
          debt_25_rehomed: >
            CAUGHT BEFORE MERGING. D05.4 also carried DEBT-25 — ~700 lines of
            half-wired SKILL tiering that D01.1 deliberately kept — which is not
            about tools at all. Rehomed to D10.6 (Skill relevance scoring), whose
            subject it literally is. A straight merge would have buried a tracked
            obligation inside an item named Toolsets.
          bridge_tools_are_core: "The three bridge tools sit INSIDE D01.2's cached prefix, always present. Their schemas are fixed (a query, a name, a name plus args) so nothing is runtime-derived and position 0 never moves. Presenting them only when overflow exists would make the array vary with the overflow condition — reintroducing exactly the instability D01.3 measured."
          demotion: "Unused for N ROLLOVERS (session-boundary count, not wall-clock) so an owl that runs rarely is not punished for being idle. The learned core still respects max_tools; an unbounded core would grow back into the window pressure the bridge exists to relieve."
      - date: 2026-08-01
