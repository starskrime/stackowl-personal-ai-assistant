          - "Deliberately pure: no store, no gateway, no clock of its own. Every branch of I3 is unit-testable without a database or waiting until 4 AM — which is exactly Bakir's Q16 answer (clock injection for logic, live run for wiring)."
          - "resolve() takes has_active_work as a BOOLEAN. The module does not know what 'work' means; the caller composes Q12's four conditions (background process, durable task, active objective, pending clarify). Keeps the policy layer free of dependencies on the autonomy layer."
          - "SessionEntry is frozen with an evolve() method, so no caller can mutate shared state by accident and every transition is a greppable call."
        bug_caught_by_types: >
          mypy found a real defect before any test ran: expired_reason() called
          policy.idle_armed / policy.daily_armed, but those properties live on
          ResetMode, not ResetPolicy. Would have raised AttributeError on the first
          real rollover. Fixed to policy.mode.idle_armed.
        verified:
          tests: "31 passed in tests/sessions/ — one per invariant I1-I5 plus the priority order, isolation rules, 4 AM boundary, stuck-loop escape and config validation."
          lint: "ruff clean (StrEnum adopted per UP042)."
          types: "mypy strict clean on all 3 source files."
        remaining:
          - "Slice 2: SessionStore — SQLite table (migration 0092) + the derived write-only JSON mirror of the key->id map."
          - "Slice 3: gateway wiring — resolve on inbound, rollover event on EventBus with durable consumer tasks, the standard-tier summary, and the one-line notice."
          - "Then: live validation run, and fold the 24 brainstorm answers into designs/D01.7.md."
    brainstorm_summary: >
      COMPLETE — 24 questions across 6 rounds, 2026-07-25. Settled: owl-keyed lanes; daily 4 AM
      + 24h idle + /new + context-full as the four rollover triggers, all sharing ONE code path;
      threads shared / main channel private; silent mid-turn restart recovery via resume_pending;
      3-strike stuck-loop escape that says why; a one-line visible boundary notice; SQLite canonical
      with a derived write-only JSON mirror of the key->id map; every runner gets a lane; keep
      transcripts, prune records; four never-expire conditions; cheap-model rollover summary gated
      on notability, publishing on the EventBus with durable consumer tasks; clock-injected unit
      tests plus a live wiring run; straight cutover with automatic migration.
      ONE OPEN ACTION blocks architect: D01.7-OA1 (verify tier_selector can serve the summary call).
    notes: >
      at_hour RESOLVED 2026-07-25: 4 AM, signed off by Bakir, superseding his Q16 midnight
      answer. Configurable so midnight stays reachable. No open questions remain on this item —
      it is ready to implement once D01.6 lands its baseline.

