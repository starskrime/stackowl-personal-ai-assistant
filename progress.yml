        the_cheap_fix_was_considered_and_REJECTED: >
          Stabilising the budgeter within a session (select once per (lane, owl),
          reuse) would buy D01.2's markers immediately. Rejected because it is a
          THIRD mechanism — exactly what X2 exists to prevent — and would need
          unpicking the moment toolsets land. Recorded so the option is visibly
          declined rather than unconsidered.
        what_D05_2_must_honour:
          1: "The array must be STABLE for the life of a session — D01.2's position-0 marker is worthless otherwise."
          2: "WINDOW-AWARE SIZING must survive. Losing it to gain cache stability trades one defect for another."
          3: "A toolset change must INVALIDATE the frozen prompt. D01.4 already built that seam (invalidate_all) and the capabilities block is already a named trigger — wiring, not new machinery."
        questions_left_OPEN_for_D05_2: >
          Deliberately not pre-empted, because answering them here would decide
          D05.2 without its own brainstorm: are toolsets per-owl or global (their
          one-agent answer does not transfer); may the context window still SHRINK
          a configured toolset; and does a mid-session toolset change apply
          immediately (paying a rebuild) or defer to the next incarnation.
        hermes_read_first_as_always: >
          agent/agent_init.py:1386 builds agent.tools ONCE from
          enabled_toolsets/disabled_toolsets, and the conversation loop never
          rebuilds it — Law 2 stated literally, and precisely what makes their
          position-0 marker viable. The honest reading is that StackOwl is BEHIND
          here: we grew a per-query budgeter they never needed. This item is the
          decision to catch up, not a defence of the difference.
    changes: []
    THE_PREMISE_IS_NOW_MEASURED:
      date: 2026-07-28
      status: "CONFIRMED with valid data. This is the first hard evidence for D01.3 in the program, and it came from the instrument D01.2 shipped."
      how: >
        D01.2's owl-scoped audit_tools_stability, running on the live platform.
        The earlier window was inconclusive because every (lane, owl) pair had
        exactly ONE turn — no opportunity to change. This window has real
        repeats: goal-owl_lifecycle-sysfup/sysfup ran 7 turns, Brain 5, scout 5,
        headhunter 4 and 4. Same owl, same lane, so an owl-switch artifact is
        excluded by construction.
      measured:
        pairs_reporting_change: 5
        total_change_events: 15
        pairs_where_the_COUNT_changed: "4 of 5 — not merely reordering"
        sequences:
          sysfup: "5 -> 4 -> 5 -> 5 -> 5"
          Brain: "4 -> 4 -> 3 -> 4"
          scout: "4 -> 3 -> 4"
          headhunter: "5 -> 4"
          hypothesis: "30 (content changed, count did not)"
      cause: "pipeline/steps/execute.py builds the schemas via to_provider_schema(request_text=state.input_text, budget={window, fixed_cost_tokens, max_tools}), so the presented set is re-selected per query."
      consequence_for_D01_2: >
        On an Anthropic backend `tools` renders at position 0, so a tools array
        that changes per turn invalidates marker 1 AND every marker downstream of
        it — all four — on essentially every turn of these lanes. D01.2's design
        predicted exactly this ("the tools marker delivers little until
        D01.3/D05.4 land; flag it loudly, it is measured evidence FOR D01.3
        rather than a reason to skip the marker"). That call now has data.
      honest_limits:
        - "EVERY pair here is a BACKGROUND/scheduled lane (goal-*, incident-*). The INTERACTIVE path is still unmeasured — it needs 2+ Telegram turns to one owl."
        - "Tool counts differ hugely by lane type (3-5 on goal lanes, 30 on incident lanes) because the context budget sizes the presented set to the model window. A rate computed across both would be meaningless."
      what_this_changes_for_D01_3s_brainstorm: >
        The item no longer opens with an unmeasured assertion. It opens with a
        rate, a cause located at a specific call site, and a named consequence
        for an item that already shipped. The question shifts from "does the
        array vary?" to "should it, and what does it cost" — and the answer to
        the second half is now computable from cost_records.
    notes: null

  - id: D01.4
    title: "Deferred invalidation as a UX pattern"
    domain: D01
    verdict: MISSING
    track: adopt
    priority: P2
    wave: 1
    order: 5
    map_ref: "docs/reference-mapping/REFERENCE_MAP.md#d014"
    gap: "No vocabulary for 'this would cost you money right now'."
    depends_on: [D01.1]
    blocks: []
    dedup_target: null
    stages:
      brainstorm: done
      architect:  done
      implement:  done
      cleanup:    done
      test:       done
      validate:   done
      document:   done
    doc: "docs/reference-mapping/designs/D01.4.md"
    doc_last_verified: 2026-07-28  # against commit 7fd1ee84; 13 paths + 5 behavioural claims re-checked at close
    the_premise_was_INVERTED_before_the_first_question: >
      The map asks "Is deferred-by-default acceptable UX, or does StackOwl's
      proactive posture need immediate application?" That question is MOOT:
      StackOwl already defers, silently, and has since D01.1. Proven, not
      asserted — tests/pipeline/test_d011_frozen_prompt_gateway_integration.py
      MUTATES an owl's persona between turn 1 and turn 2 and asserts turn 2 does
      NOT see it (line 342, `assert _PERSONA_AFTER not in systems[1]`), while a
      new incarnation does (line 382). Three tests, run 2026-07-28, all passing.
      Structurally too: nothing outside sessions/prompt_store.py touches
      session_prompts, the store only INSERTs/UPSERTs and never deletes, and owl
      edits do not touch session_id. So the behaviour shipped without the
      vocabulary, and D01.4's real subject is the SILENCE plus the missing
      invalidation seam.
    the_map_is_wrong_again_third_time: >
      The map states "any command that would mutate system-prompt state (install
      a skill, enable a tool, change memory) takes effect next session by
      default, with --now for immediate. This is the canonical pattern,
      documented as such." Only half true. Hermes DOES have the contract, named
      and reused — hermes_cli/skills_hub.py carries "--now invalidates prompt
      cache immediately (costs more money). Default: defer to next session to
      preserve cache", and agent/coding_context.py:37 calls the /coding flip
      "the same contract as ``/skills install`` vs ``--now``". But it covers
      skills and /coding ONLY. Everywhere else the gateway calls
      _evict_cached_agent(session_key) at 56 call sites, applying the change at
      the NEXT MESSAGE with no deferral and no cost message. Hermes has two
      conflicting behaviours, not one canonical pattern, and no doc/ file
      describes the deferral at all.
    decisions:
      - date: 2026-07-28
        stage: brainstorm
        round: "21 questions over 6 rounds, Hermes source read BEFORE asking (the new standing rule)"
        by: Bakir
        answers:
          who_defers: >
            A1 — HUMAN-initiated changes apply IMMEDIATELY; MACHINE-initiated
            ones (nightly DNA evolution, background curator writes) defer. Bakir
            asked to discuss rather than pick an option, and the discussion
            changed my recommendation: silent deferral is probably the MOST
            expensive choice, not the cheapest. A cache miss on the ~2712-token
            frozen prompt is ~4c against the D01.6 baseline; a confused user
            re-editing costs ~57c per turn, ~13x more. And the retry loop is not
            hypothetical — assemble.py already documents the model retrying
            owl_build with name variants until the owls block stopped it.
            Silence causes retries; retries cost more than the miss.
          the_real_line: "Not deferred-vs-immediate but WHO IS SURPRISED. A change you just made at a keyboard expecting an effect — surprise is expensive. A change nobody asked for right now — nobody is watching, deferral is free."
          owl_self_change: "Next TURN boundary, never mid-turn. The turn finishes on its frozen prompt; the rebuild lands before the next turn. Autonomy stalls seconds rather than until 04:00, and Law 1 holds because nothing mutates PAST context."
          in_flight: "Finishes on the prompt it started with — the SAME rule as owl self-changes, so there is ONE rule for both actors."
          invalidation_mechanism: "DELETE the row. Reuses the existing cache-miss path exactly; assemble needs NO new code."
          granularity: "Whole prompt, always. Per-part would make the frozen prompt a composition rather than a string, and prompt_hash would stop identifying one stored artifact."
          blast_radius: "DELETE WHERE owl_name = ? — every lane that owl is on. You edited the OWL, not one conversation; anything narrower lets telegram-secretary and cli-secretary silently disagree about who they are."
          no_new_tables: >
            No pending-changes queue and no rollover notice. Bakir first chose to
            build the queue and then chose to drop its only reader; put back as a
            contradiction, he resolved it to DROP BOTH. Deferred machine changes
            need no queue at all — a rollover mints a new session_id, the stored
            row stops matching, and the next turn cold-builds. D01.1's
            self-enforcing design already does the work. Zero migrations.
          revoke_safety: >
            No conflict, and VERIFIED rather than assumed. authz_compose.py:61
            computes `owl.bounds(now) ∩ creation_ceiling` — live at dispatch —
            and its docstring states the fail-closed contract plus "task_envelope
            is intentionally excluded from enforcement (E2-S3) ... the hard
            boundary must not depend on an LLM-derived hint". So a mid-turn
            revoke is enforced immediately however stale the prompt is; the cost
            is one wasted tool attempt, never an unauthorised action.
          placement: "SessionPromptStore.invalidate(owl_name=...), beside load/save. No new module. The store stays the only thing touching session_prompts — which is what made the blast-radius question easy to answer. (Placement voted, per standing rule.)"
          trigger_sites: "All four: human owl persona/DNA edit, skill install/uninstall/enable, owl self-extension (at the next turn boundary), permission/authz changes."
          wording: "Nothing extra — the normal confirmation only. Under A1 the change IS live from the next turn, so there is nothing surprising left to explain, and explaining an implementation detail invites worry about it."
          background_lanes: "No-op today (they never freeze, per DEBT-27), and correct AUTOMATICALLY once DEBT-27's per-day identity lands — the same invalidate() call simply starts mattering. No special-casing, nothing to revisit."
          vs_D01_2: "No reconsideration. A settings edit is a few times a day, not per turn; the markers protect the 99% of turns where nothing changed."
          test_target: "\"An edit I just made is reflected in the next reply.\" Drive a turn, edit the persona, drive another, assert the NEW persona reached the provider. This assertion currently FAILS BY DESIGN — D01.1 proves it — so it is guaranteed to be able to fail."
        contradictions_put_back_and_resolved:
          - conflict: "\"Nothing should be deferred\" vs \"humans defer, owls apply immediately\" vs \"tell them at rollover\" — and vs the shipped behaviour, since deferral is already live and tested."
            resolution: "Bakir asked to discuss rather than choose. Outcome: A1 above. \"Nothing defers\" was read as \"add no NEW deferrals\", which is right — D01.1 already defers everything in the prompt, so D01.4 adds an INVALIDATION seam rather than more deferral."
          - conflict: "Build a pending-changes queue, but drop the rollover notice that was its only reader — a table, migration and writer with nothing consuming them."
            resolution: "DROP BOTH. If a reader is ever wanted the queue can be added then, with a consumer."
          - conflict: "\"In-flight turns finish on the old prompt\" (correct for Law 1) vs \"permission changes apply immediately\" (a revoke would then be ignored for the rest of a turn)."
            resolution: "Not a real conflict — enforcement is at dispatch on live bounds, and the prompt is presentation only. VERIFIED in authz_compose.py before accepting it."
        load_bearing_condition_for_the_document: >
          The revoke-safety answer holds ONLY while the owl registry stays live.
          If anyone ever caches the registry per session to match the prompt
          freeze, enforcement silently becomes as stale as the prompt. This must
          be written into the design doc as a stated invariant, not left implicit.
        no_migration_needed: "DELETE requires no schema change. D01.4 is the first item in this wave with zero migrations."
    architect_result:
      date: 2026-07-28
      round: "11 architect questions over 3 rounds (32 total with brainstorm), Hermes and the StackOwl call sites read BEFORE asking"
      ladder_rung: "1 — extend existing code. No new module, no new table, no new core tool, and NO MIGRATION: a DELETE needs no schema change. First item in this wave with zero migrations."
      law_1: >
        Invalidation never touches a turn in flight — it changes only what the
        NEXT turn builds, so nothing mutates past context. Stated plainly in the
        doc: this makes invalidation the SECOND sanctioned way a frozen prompt's
        life can end early, alongside compression. A reader who assumes rollover
        is the only release will be wrong.
      law_2: "Nothing added to the model's tool surface. One method pair on an existing store, one line in an existing set_services call, call sites that already exist."
      files_to_change:
        - "sessions/prompt_store.py — invalidate_owl(*, owl_name, cause) and invalidate_all(*, cause), beside load/save. Two explicit names so the dangerous case is never the default; both return a row count for the log line."
        - "commands/owls_command.py — await invalidation in _edit; and ADD session_prompt_store to the StepServices built at line 1077."
        - "skills/store.py — invalidate_all at set_enabled (line 305) and the install path, bound to the WRITE not the caller."
        - "pipeline/cache_audit.py — accept a `cause` so an explained change logs info instead of warning."
        - "tests/pipeline/test_d014_prompt_invalidation_gateway_integration.py (new) — the business requirement."
      the_seam_problem_and_its_answer: >
        THE CENTRAL ARCHITECTURAL FINDING. The trigger sites have no shared route
        to the store. OwlsCommand takes a DbPool, but every dependency defaults to
        None and owl_build.py constructs `OwlsCommand()` BARE at four sites (829,
        1047, 1158, 1214) — so the self-extension path has db=None and cannot
        invalidate. get_services() is the one seam all four can see, and
        owls_command.py:1077 already establishes the pattern, calling
        set_services(StepServices(owl_registry=..., db_pool=...)) with a comment
        explaining that "slash-command dispatch never runs the LLM pipeline
        backend, which is the ONLY other place that populates get_services()".
        But that StepServices is PARTIAL — no session_prompt_store — so an
        invalidation reading it would get None and silently no-op. The fix is one
        line filling that gap, using the codebase's own established pattern.
      my_brainstorm_reasoning_was_wrong_on_the_facts: >
        I rejected the EventBus during brainstorm because it "makes a synchronous
        action asynchronous". EventBus.emit actually runs SYNC handlers INLINE on
        the caller's thread, so that reason was false. The conclusion survives for
        a different reason: invalidation must await a DB write, only ASYNC
        handlers may await, and those are "scheduled on the running loop" —
        scheduled is not ordered. Right answer, wrong reason, corrected here
        rather than left as a plausible-sounding justification.
      cross_item_clash_caught_at_design_time: >
        D01.2's audit_prompt_parts warns whenever a prompt part changes between
        cold builds — so after D01.4 EVERY deliberate edit would emit a warning
        about a change the user just asked for. That is the same cry-wolf failure
        D01.2's validate stage caught, arriving from the other direction.
        Resolved by threading `cause` through: an explained change logs info as
        "changed as requested", an UNexplained one stays a warning, so the audit
        keeps doing the one job it exists for.
      the_load_bearing_condition: >
        I5 (enforcement never depends on prompt freshness) holds ONLY while the
        owl registry stays live. Verified in authz_compose.py: bounds are
        `owl.bounds(now) ∩ creation_ceiling`, resolved at dispatch, fail-closed,
        with task_envelope explicitly excluded from enforcement (E2-S3). Written
        into the doc as a named fragile condition because if anyone ever caches
        the registry per session to mirror the prompt freeze, enforcement becomes
        as stale as the prompt and I5 fails with no test to catch it.
      decided_at_architect:
        seam: "Fill the session_prompt_store gap in the existing set_services call."
        missing_store: "Log at ERROR and continue — the edit persisted and must never be rolled back over a cache concern. Mirrors D01.2's I3."
        dead_event: "owls_command.py:379 emits owl_edited with ZERO subscribers. Left alone — not D01.4's to fix, and recorded as debt rather than quietly deleted."
        signature: "Two explicit methods, not one with an optional owl. The destructive case must not be the default."
        multi_principal: "invalidate_all is global across principals, deliberately. The skills catalogue and capabilities block are machine-wide facts, and migration 0102 says NO owner_id DELIBERATELY."
        observability: "INFO with cause + scope + owl + rows. The missing half of D01.2's audit: that one names WHICH PART changed, this names WHAT CAUSED the rebuild."
        ordering: "Guaranteed by the call stack — the command awaits invalidation before returning its confirmation, and the next turn cannot start until the user has that reply. No race to test for."
        permissions: "No grant/revoke seam exists in authz/ or commands/permissions.py. Ship the other three triggers; locate it during implement — if permissions are only ever changed via owl bounds it is already covered by invalidate_owl."
        skills_hook: "At the STORE, next to the write, so a future non-command writer still invalidates. Same reasoning that put marking at one chokepoint in D01.2 — and the exact gap the D01.2 cleanup stage found in the stream path."
      every_claim_verified_against_the_tree: >
        5 paths present; owls_command.py:379 does emit owl_edited;
        skills/store.py:305 is set_enabled; coding_context.py:37 does name the
        --now contract; _evict_cached_agent really is 56 call sites (counted, not
        estimated); test_d011 line 342 is the `not in` assertion; migration 0102
        does say "NO owner_id, DELIBERATELY".
    changes:
      - date: 2026-07-28
        stage: implement
        commits: [2a13b172, 5afa1915, 3cf0c2c2, a3ec2273]
        slices:
          1: "sessions/prompt_store.py — invalidate_owl / invalidate_all, two explicit methods so the destructive case is never the default. 5/5 mutations killed."
          2: "owls_command._edit awaits invalidate_owl; the PARTIAL StepServices at the owl_build dispatch now carries session_prompt_store; skills/store.py set_enabled invalidates, bound to the WRITE not the caller."
          3: "infra/prompt_invalidation.py — cause carrier, so D01.2's audit logs an explained change at info instead of warning about a change the user asked for. Consumed once."
          4: "tests/pipeline/test_d014_prompt_invalidation_gateway_integration.py — the business requirement, mutation-proven to be able to fail."
        three_mistakes_of_mine_worth_keeping:
          assumed_an_api: >
            Wrote `cleared = await self._db.execute(...)` expecting a rowcount.
            execute() returns None, and the pool ALREADY had
            execute_returning_rowcount(). Caught by three failing count
            assertions — which is the argument for asserting the COUNT rather
            than just "the row is gone".
          destroyed_uncommitted_work: >
            The mutation harness timed out mid-battery leaving a mutation in the
            tree; I "restored" with `git checkout --` on UNCOMMITTED work, which
            deleted the implementation and kept nothing. Recovered from the
            snapshot the harness itself takes. NEW RULE, now followed: COMMIT
            BEFORE MUTATING — then git checkout is a real restore and the worst
            case is losing a mutation, not a feature.
          scripted_edit_broke_a_decorator: >
            An insertion script placed a new method between `@staticmethod` and
            `def _yaml_snapshot`, so the decorator attached to the wrong
            function. mypy went 78 -> 88 and a test failed with "_yaml_snapshot()
            takes 0 positional arguments". Reverted and re-applied as an explicit
            edit. THE PATTERN across three such mishaps this session: text
            scripts are fine for repeated mechanical substitution and wrong for
            STRUCTURAL insertion, where an anchor can land inside a construct I
            did not think to check.
        two_bugs_in_my_own_test_probes_not_the_code:
          - "Probed the gateway test with `--role`. DNAPromptInjector emits manifest.system_prompt; `role` appears only in the OWLS BLOCK, which lists the OTHER owls. Editing --role changes nothing in that owl's own prompt, so the assertion would have failed forever while the code was correct. Localised because the row-cleared and re-frozen assertions passed FIRST."
          - "The skills fixture invented a `body` column; the real table has body_text/source/path. Read the schema instead of guessing."
        the_live_path_streams_AGAIN: >
          The gateway test's create()-only fake blew up with "'async for'
          requires __aiter__" — in the OPENAI provider this time. D01.2's test
          stage made the identical discovery about the Anthropic provider. Twice
          in two items is a pattern, not a coincidence: a provider-level test
          that drives create() proves a path production does not take.
    cleanup_record:
      date: 2026-07-28
      dedup_target: "null for this item."
      THE_GAP_IT_FOUND: >
        owl_build — the SELF-EXTENSION path Bakir explicitly selected as a
        trigger — never invalidated. Slice 2 had filled the session_prompt_store
        gap so it COULD reach the store, and then nothing called it: the seam
        existed and was unreachable. That is "registered but never wired", one
        item after D01.2's cleanup found the same shape in the stream path. It
        matters more here than for the slash command: an owl that rewrites its
        own specialty mid-task and does not invalidate keeps reasoning under the
        persona it started the session with, so the autonomy loop silently
        ignores its own change until 04:00. Now wired at all three rebuild sites
        via one _invalidate_prompt helper, with the in-flight turn still
        finishing on its original prompt so Law 1 holds.
      dead_event_left_alone: "owls_command.py:379 still emits owl_edited with ZERO subscribers. Left deliberately, per the architect decision — not D01.4's to fix, and deleting a hook someone may have planned around is not cleanup."
      permissions_trigger: "Still unlocated — there is no grant/revoke seam in authz/ or commands/permissions.py. Per Bakir's architect decision the other three triggers ship; if permissions are only ever changed via owl bounds, invalidate_owl already covers them."
      test_run_discipline_relearned: >
        `tests/tools/` exceeded 600s and was killed (exit 143). That is the
        standing rule about full-suite runs on this box, which I should have
        scoped in the first place. Re-run against the owl_build-covering paths
        only.
      verified:
        tests: "157 passed across tests/tools/meta/ plus the owl_build presentation and D01.4 files. The 2 failures are PRE-EXISTING (DEBT-33, DEBT-34) — provenance established by swapping the modified file out and re-running at HEAD, where both still fail."
        gates: "ruff src/ 46 = DEBT-1 baseline; mypy src/ 78 = DEBT-8 baseline. Zero added, after fixing the 10 a bad scripted insertion briefly introduced."
        no_capability_removed: "Checked. Every change adds an invalidation call, a helper or a log line. Nothing disabled or stubbed."
      the_near_miss_worth_recording: >
        DEBT-33 initially read as an AUTHORISATION BYPASS — a test named
        "cannot_edit_human_owl" failing with the edit succeeding. Reporting that
        as a security hole would have been wrong and alarming. Reading the code
        first showed the edit path deliberately calls `can_edit`, not
        `can_modify`, and can_edit returns None for human/builtin owls with a
        documented rationale. The test encodes a superseded policy, not a hole.
        Verify before reporting — and especially before reporting something
        frightening.
    test_result:
      date: 2026-07-28
      total: "43 passed across six files, all targeted paths."
      coverage:
        store: "tests/sessions/test_prompt_store.py (15) — invalidate_owl clears one owl on every lane, invalidate_all clears everything, both idempotent, both return a count, both fail-open, and the store RECORDS the explanation."
        command: "tests/commands/test_d014_owl_edit_invalidates.py (4) — driven through the real command, because the store tests prove the mechanism and NOTHING about whether anything calls it."
        skills: "tests/skills/test_d014_skill_change_invalidates.py (2) — bound to the write."
        self_extension: "tests/tools/test_d014_owl_build_invalidates.py (2) — the gap cleanup found, plus its I3 fail-open."
        audit: "tests/pipeline/test_cache_audit.py (18) — an explained change is info, an unexplained one still warns, and the explanation is consumed once."
        business_requirement: "tests/pipeline/test_d014_prompt_invalidation_gateway_integration.py (2) — gateway-driven, only the AI provider faked."
      two_gaps_closed_in_this_stage:
        - "I3 on the SELF-EXTENSION path — an owl edit must survive a missing store and must LOG when it cannot invalidate. That is the path with no human watching, so a silent failure there is indistinguishable from a bug."
        - "That invalidate_owl itself records the explanation, tested AT THE STORE rather than only at the audit's unit level. That is the seam carrying the behaviour: if the store stopped noting, the audit would warn on every deliberate edit and nothing in cache_audit's own tests would notice."
      mutation_proven: "The gateway test dies when the invalidation call is removed (both cases). The store's 5 mutations all die. Restores verified with git status after the harness failures earlier in the item."
      verified:
        tests: "43 passed. tests/pipeline/ 1089 earlier in the item, reconciling exactly against the 1080 D01.2 baseline."
        gates: "ruff src/ 46 = DEBT-1; mypy src/ 78 = DEBT-8. Zero added."
      known_reds_untouched: "DEBT-33 and DEBT-34 remain red and were NOT patched — both proven pre-existing at HEAD."
    validate_result:
      date: 2026-07-28
      status: "PASS — and unlike D01.2, this item's live half IS provable here: it needs no Anthropic backend."
      restart: "1192 new log lines, ZERO ERROR/CRITICAL."
      the_live_proof:
        method: >
          Bakir approved a throwaway-owl probe rather than editing one of his own
          owls. stackowl.yaml was SNAPSHOT first (the edit path writes to it), a
          probe owl was registered, a prompt frozen through the real
          SessionPromptStore against the LIVE database, then the REAL
          OwlsCommand._edit was driven against it.
        evidence: |
          [prompt] invalidate: exit  cause=owl_edit          scope=owl owl=d014probe rows=1
          [prompt] invalidate: exit  cause=validate_cleanup  scope=owl owl=d014probe rows=0
        what_that_proves: >
          The real command reached the real store, cleared a real row in the live
          database, and emitted the INFO line with cause/scope/owl/rows. The
          second line proves IDEMPOTENCE live for free — the same call against an
          already-cleared owl reports rows=0 rather than failing.
        cleanup_verified: "stackowl.yaml restored IDENTICAL to the snapshot (diff empty); zero d014probe rows remain; the live table is back to Brain(2) + secretary(2), exactly as before."
      the_first_attempt_looked_like_a_defect_and_was_not: >
        Run one cleared the row but produced NO log line in the JSONL, which
        reads exactly like a missing-logging bug. Diagnosed before recording
        anything: setup_logging() is called ONLY from cli/app.py, so a standalone
        script has no JSONL handler at all — ZERO of its lines reached the log,
        not just the invalidation one. Re-ran with setup_logging() called and the
