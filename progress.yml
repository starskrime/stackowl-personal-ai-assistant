  - id: D01.7
    title: "Session lifecycle — session_key / session_id split"
    domain: D01
    verdict: MISSING
    track: adopt
    priority: P0
    wave: 1
    order: 2
    discovered: "2026-07-25 during D01.1 brainstorm — NOT in the original 110-item map."
    map_ref: "docs/hermes-mapping/HERMES_STACKOWL_MAP.md#d017"
    gap: >
      StackOwl has exactly one session identifier and it never changes, so a session can
      never start or end. "Build the prompt once per session" is meaningless without this.
      Prerequisite for D01.1, and the natural home for D09.1 / D09.3 / D03.3.
    depends_on: [D01.6]
    blocks: [D01.1, D01.4, D03.3, D09.1, D09.3]
    dedup_target: null
    hermes_reference:
      doc: "do_not_push_to_git_research_only/hermes-agent/docs/session-lifecycle.md (637 lines)"
      source: "gateway/session.py (~1444 lines), gateway/run.py, gateway/config.py"
      model:
        session_key: "The conversation LANE. Deterministic, never changes. Format: agent:main:{platform}:{chat_type}[:{chat_id}][:{thread_id}][:{participant_id}]"
        session_id: "This INCARNATION of the lane. Format YYYYMMDD_HHMMSS_<8hex>. A reset keeps the key and mints a new id."
      reset_policy:
        modes: [none, idle, daily, both]
        default_mode: both
        at_hour: 4
        idle_minutes: 1440
        notify: true
        per_platform_override: true
        exclusion: "A session with an active background process is NEVER expired or reset."
      state_flags:
        suspended: "Hard wipe. Set by /stop or 3+ consecutive restart failures. Forces a new id."
        resume_pending: "Soft recovery. PRESERVES the id so the transcript continues. Cleared after the next successful turn."
        was_auto_reset: "Consumed once to inject a visible 'session expired' notice, with auto_reset_reason = idle|daily."
        is_fresh_reset: "Explicit /new or /reset. Kept distinct from was_auto_reset so the user never sees a misleading 'expired' message."
        expiry_finalized: "Set by the background watcher after hooks ran and the cached agent was evicted."
      priority_order: ["suspended -> force reset", "resume_pending -> preserve id", "policy expiry -> auto reset", "otherwise -> return existing, bump updated_at"]
      isolation:
        group_sessions_per_user: "true — group/channel sessions isolated per user"
        thread_sessions_per_user: "false — threads SHARED by default"
        multi_user: "Shared sessions prefix the sender name onto each USER MESSAGE, never into the system prompt. Explicitly done to preserve prompt caching."
      caching_mechanism: >
        The gateway holds an LRU cache of live AIAgent objects keyed by session_key (max 128,
        1h idle TTL). The doc states its purpose verbatim: "to preserve prompt caching across
        turns." Freezing the prompt and caching the agent are the SAME feature — this is the
        mechanism that makes Law 1 real rather than aspirational.
      crash_recovery: >
        A .clean_shutdown marker is written on graceful exit. If missing at boot, sessions
        touched within 120s are marked resume_pending and the gateway SYNTHESISES message
        events to auto-continue them. Three consecutive restarts on one session -> suspended.
      background_watcher: "Runs every 300s: finalize expired sessions, evict idle cached agents (1h TTL), prune stale entries."
    does_not_transfer:
      - "StackOwl's core exec-replaces itself on every code change. An in-memory prompt cache would be discarded constantly during development — the SessionPrompt must be PERSISTED, not just cached in memory. Their resume_pending + .clean_shutdown machinery is the analogue, and StackOwl already has drain + durable recovery to build on."
      - "Hermes has one agent; StackOwl has owls. Our cache key must be session_key + owl_name — switching owls mid-lane means a different persona and therefore a different prompt."
      - "Their SessionContext block goes INTO the system prompt (platform, connected channels, delivery targets) with optional PII redaction. Stable per session for them; for us it must be checked against the D01.1 decision that job output lands in its own conversation with a note in main."
    stages:
      brainstorm: not_started
      architect:  done
      implement:  not_started
      cleanup:    not_started
      test:       not_started
      validate:   not_started
      document:   not_started
    doc: "docs/hermes-mapping/designs/D01.7.md"
    doc_last_verified: 2026-07-25
    decisions:
      - date: 2026-07-25
        stage: architect
        by: Bakir
        question: "session.at_hour — midnight (his Q16 answer) or 4 AM (Hermes default)?"
        answer: "4 AM. SIGNED OFF."
        rationale: >
          Hermes' reasoning accepted: a session running at 1 AM is mid-thought and midnight
          guillotines it; at 4 AM nobody is talking. Ships configurable (reset_mode + at_hour)
          so midnight remains reachable, with 4 as the default. Supersedes the Q16 answer.
        blocks_cleared: ["D01.7 implement"]
    changes: []
    notes: >
      at_hour RESOLVED 2026-07-25: 4 AM, signed off by Bakir, superseding his Q16 midnight
      answer. Configurable so midnight stays reachable. No open questions remain on this item —
      it is ready to implement once D01.6 lands its baseline.

