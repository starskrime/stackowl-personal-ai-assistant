  - id: INCIDENT-2026-08-10-conversational-turns-died
    found: 2026-08-10
    fixed: 2026-08-10
    commit: f17b7c66
    map_check: "no mapped item matches — evidence-led, recorded here per PROCESS.md"
    what: >
      SIMPLE QUESTIONS FROM TELEGRAM RETURNED NOTHING. "Hey" answered fine;
      "What is happening in world ?" died twice and "Why?" died once, inside
      twenty minutes. Reported by the operator mid-session, not by any alarm.
    what_happened: >
      The router classified the question as `conversational`. execute.run()'s
      `_use_tools` gate excludes conversational turns from tools BY DESIGN — the
      comment there is load-bearing, it exists so a small/weak model cannot spiral
      in a tool loop. The model tried to search anyway and emitted the call as
      plain text; the leak guard correctly refused to show the user raw ACTION:
      text; and then the turn simply ended. persist_turn logged "floored turn —
      persisting user utterance only (no draft)" and the user got an apology.
      Four turns, three of them the same question.
    root_cause: >
      Not the guard, which is right, and not the router alone. The defect is that
      a tool-call leak — the single most precise signal available that the router
      misjudged the turn, since the model has just said it needs a tool — was
      discarded rather than acted on. A turn we knew how to answer was killed.
    fix: >
      The leak now escalates ONCE onto the tool path instead of flooring, with
      intent_class moved to "standard" (otherwise _turn_context_prefix tells the
      model it has no capabilities while tools are passed). The anti-spiral gate
      is untouched — one evidence-driven re-run, not a standing grant. A failed
      escalation falls back to flooring. 77 tests green; ruff 39 and mypy baselines
      held.
    the_thing_worth_remembering: >
      STICKY ROUTING NEEDED NO CHANGE, and believing otherwise nearly produced a
      second fix for a working actuator. turn_persist.py ALREADY evicts the sticky
      route on a floored turn, and the log proved it fires — "Why?" called the
      router immediately after the floor. But the fix REMOVED the floor, and the
      eviction was reached only BY flooring, so a successful escalation would have
      left the stale conversational entry alive for its full 5-minute TTL and every
      short follow-up would have leaked and escalated again. Right answers, a
      wasted stream every turn. This is failure mode 4 one layer along: when you
      remove a writer, ask what was BOUNDING the thing it wrote to — here, what was
      TRIGGERING the actuator. The escalation path now evicts too.
    live_status: >
      The QUESTION works again: 04:01:36 UTC, "What is hapaning in the wolrd ?"
      returned a real answer with both a user AND an assistant row, which is exactly
      what was missing before. Zero leaks and zero floors since the restart.
      BUT BE PRECISE ABOUT WHAT THAT PROVES: the router classified it `standard`
      that time, so the turn went straight to the tool path and the escalation never
      fired — "escalating to the tool path" has 0 occurrences. The fix is a deployed
      but UNEXERCISED safety net. That the same question routed `conversational`
      three times and `standard` once is itself the finding: the classifier is
      non-deterministic here, which is precisely why the net is worth having.
    still_open: >
      The router calling a world-news question "conversational" is untouched. The
      escalation makes it non-fatal, not rare. Worth a measurement pass once a day
      of traffic has accumulated: count "escalating to the tool path" against total
      turns and decide whether the classifier needs work or the gate is simply too
      blunt. Until that line appears at least once in production, the escalation
      path has NOT been proven live — only in tests.

  - id: INCIDENT-2026-08-03-skills-migration
    found: 2026-08-03
    what: "MY OWN D05.1 MIGRATION DELETED 419 OF 420 SKILLS. Fully recovered from the DB; nothing lost."
    what_happened: >
      migrate_legacy_skills() was written to relocate the skills tree out of the
      model-writable workspace. It ran against LIVE DATA and destroyed it.
      ensure_exists() mkdirs skills/{builtin,installed,user,learned} BEFORE
      calling the migration. The first version SKIPPED any entry whose
      destination already existed — treating those four freshly-created EMPTY
      directories as "already migrated" — and then VERIFIED only that each NAME
      existed at the target. Four empty dirs satisfied that check, verify passed,
      and shutil.rmtree deleted the source tree.
    why_it_was_not_caught: >
      The design doc for this very item said "COPY, VERIFY, THEN REMOVE" and
      listed "migration interrupted half-way" as a failure mode. The verify I
      then wrote was the kind that PASSES WHEN NOTHING HAPPENED — it asked
      whether a path with the right name existed, which an empty directory
      satisfies. Writing the right principle in the doc did not stop me
      implementing a check too weak to enforce it.
    recovery: >
      COMPLETE. The skills table stores body_text and manifest_json — the full
      SKILL.md content — because the SQLite index is a cache of files that are
      the source of truth, and the cache happened to hold everything. All 421
      rows were rewritten to disk; 422/422 parse with the real frontmatter
      regex. Verified live: 421 loaded at the next boot, 0 ERROR/CRITICAL, and
      the DB self-healed its stale path column (0 rows on the old path, 421 on
      the new) because upsert is keyed on (owner_id, source, name) with
      path = excluded.path.
    the_fix: >
      Two corrections, both load-bearing:
        1. copytree(dirs_exist_ok=True) — an existing destination means PARTIALLY
           migrated, NEVER "done".
        2. Verify by COUNTING FILES under both trees, not by testing that a name
           exists. Nothing is deleted unless the target holds at least as many
           files as the source.
      Regression test: tests/paths/test_skills_relocation.py::
      test_migration_survives_ensure_exists_having_precreated_the_subdirs
      reproduces the REAL precondition (the four pre-created empty dirs) rather
      than a synthetic one. Mutation M5 restores the destructive logic and fails
      exactly that one test.
    lessons:
      - "I ran a destructive migration against live data without snapshotting first. A ~/.stackowl/backups snapshot existed only because an unrelated DB migration made one in July."
      - "A verification that cannot distinguish success from no-op is not a verification. 'Does a path with this name exist' passed on empty directories."
      - "The data survived because a CACHE happened to hold the source of truth. That was luck, not design."
    status: resolved

