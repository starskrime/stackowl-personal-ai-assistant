          - "Delivery used to recover the recipient with int(session_key), which worked ONLY because the lane happened to BE the Telegram chat id. A composite lane is not int()-able, so every proactive send would have fallen through to the adapter's shared _last_chat_id — the cross-delivery bug this codebase already fixed once. That is why the lane switch could not ship without this."
          - "Store FIRST, heuristic as fallback: nothing that resolved before stops resolving, and lanes the heuristic could never handle (a Telegram group, whose chat_id is not the user id; a Slack lane, which was never a chat id) now resolve for the first time."
          - "resolve_recipient takes the store as `object` and duck-types it, so notifications does not import the sessions package just to address a message."
          - "None still means 'unresolved — fall back and say so loudly'. Neither source may guess: a fabricated recipient IS the bug."
        verified:
          tests: "108 passed in tests/notifications, including 7 new. The headline case — a composite lane resolving through the store — is a direct regression test."
          lint: "ruff clean on all touched files; src/ at the 46 pre-existing baseline."
          types: "mypy src/ -> 78, byte-identical to baseline. Zero new."
      - date: 2026-07-25
        slice: "3a.2 part 4 — durable knowledge scopes by owner, not by lane"
        files:
          - "src/stackowl/pipeline/services.py — owner_scope_key(state), one definition"
          - "src/stackowl/pipeline/turn_persist.py — bridge.store now files under the owner (was the raw lane)"
          - "src/stackowl/pipeline/steps/classify.py — retrieve + history + preferences"
          - "src/stackowl/pipeline/steps/feedback.py, deliver.py — inline copies replaced"
        design_notes:
          - "The expression existed inline in four places and was MISSING in a fifth. That drift is why the lane could not be re-keyed: four sites would have followed the identity, one would have followed the lane, and only the odd one out held the 109380 existing rows. One function now, so the next person cannot re-introduce the split."
          - "This unblocks the composite-lane switch without a migration, a backfill or a compatibility read."
      - date: 2026-07-25
        slice: "3a.2 part 1 — the lane carries its own send target"
        commit: 7b145f15
        files:
          - "src/stackowl/sessions/models.py — SessionSource.chat_target, SessionEntry.chat_id"
          - "src/stackowl/sessions/store.py — resolve_send_target(), COALESCE on save"
          - "src/stackowl/db/migrations/0094_session_send_target.sql (new)"
          - "tests/sessions/test_session_store.py — 6 new tests, written FIRST and red"
        design_notes:
          - "chat_target (how to ADDRESS a message) is kept separate from chat_id (how to KEY a conversation). They coincide in a Telegram DM and diverge everywhere else — a Telegram group's chat id is not the asking user's, and a Slack lane is a hash that was never a channel id. Collapsing them is what made delivery fragile in the first place."
          - "Newest message wins on the target (a group upgraded to a supergroup re-keys the chat while staying the same lane), but a message with NO target never erases a known one — otherwise one CLI turn would silently unaddress the Telegram lane. Both directions are pinned by a test, and the same rule is enforced twice: in resolve_for for the returned object, and by COALESCE in the upsert for any direct save() caller."
          - "An unknown lane resolves to None, never a guess. A fabricated recipient IS the cross-delivery bug this codebase already fixed once."
        verified:
          tests: "49 passed in tests/sessions/ (43 existing + 6 new). The 6 were red before the implementation."
          lint: "ruff clean on src/stackowl/sessions/ and tests/sessions/."
          types: "mypy strict — no issues in 4 source files."
          migration: "0094 applied; second run reports already-applied; sessions.chat_id present. Schema at 0094."
      - date: 2026-07-25
        slice: "3a.1 of 3 — the identity rename: session_id -> session_key, code and schema together"
        commit: c82ea736
        files:
          - "571 files rewritten mechanically (2829 lane occurrences) across src/ and tests/"
          - "src/stackowl/db/migrations/0093_session_key_rename.sql (new) — 7 tables"
          - "src/stackowl/commands/parliament_command.py — 8 sites restored to the DEBATE id by hand"
          - "src/stackowl/parliament/round_runner.py, staged_rca.py — PipelineState(session_key=...)"
          - "src/stackowl/commands/parliament_helpers.py — ParliamentSession keeps session_id"
          - "CLAUDE.md — the JSONL top-level key is now session_key"
          - "docs/hermes-mapping/designs/D01.6.md, D01.6-baseline.md — amended, see below"
        why_code_and_schema_are_ONE_commit: >
          The approved plan had the code rename as commit 1 and the migration as commit 2. That
          ordering does not survive contact: renaming the column first breaks the running code,
          and renaming the code first leaves SQL strings pointing at a column that no longer
          matches. Either intermediate is red. They are one atomic unit, and the plan was wrong
          to split them. Stated here rather than quietly re-ordered.
        classification_not_find_replace: >
          session_id names three unrelated things. The rename excluded src/stackowl/parliament/
          (debate ids), src/stackowl/tools/browser/ (page sessions) and src/stackowl/sessions/
          (already post-rename), and five mixed-domain files were done by hand. The regex used a
          negative lookahead so `session_idle_timeout_minutes` and `session_idle` could not be
          corrupted, and it aborted on any file still referencing new_session_id().
        mypy_found_the_seam: >
          After the mechanical pass mypy reported exactly 4 errors and every one sat on a
          parliament/lane boundary — ParliamentSession had no session_key, and PipelineState no
          longer took session_id. Both would have been runtime AttributeErrors in the debate
          path. This is the argument for renaming under a strict type checker rather than by eye.
        verified:
          compile: "`uv run python -m compileall src tests` — clean."
          migration: "0093 applied; second run reports already-applied; schema at 0093. All 7 columns renamed, parliament_sessions and sessions untouched, indexes followed the column, 61864 cost_records rows preserved with values intact (sampled: '72055773', a bare Telegram chat id — which is the evidence that this column always held the LANE)."
          types: "mypy src/ -> 78 errors, byte-identical to the pre-rename baseline signature set. Zero new, zero fixed."
          lint: "ruff src/ -> 46 (DEBT-1 baseline, zero added). ruff tests/ -> 285 baseline, briefly 287; both new errors were E501 caused by session_key being one character longer than session_id, and both were fixed. Back to 285."
          tests: "1251 passed in tests/sessions + tests/pipeline + tests/gateway. 1511 passed in tests/channels + tests/memory + tests/providers + tests/interaction, with 3 failures PROVEN pre-existing by re-running them in a clean HEAD worktree — see DEBT-9."
          doc_amended: >
            D01.6.md is a CLOSED document whose Verification section cited
            cost_records.session_id, a column this migration removed. It was amended rather than
            left to rot, and its main query was re-run against the live DB to confirm it still
            passes. A closed document that no longer runs is the exact failure DOC_STANDARD
            rule 3 exists to prevent.
        live_consequence: >
          The migration was applied while the platform was RUNNING, so the live core briefly ran
          old code against renamed columns and logged '[cost_tracker] record: SQLite insert
          failed' and '[scheduler] retry_sweep: get_due failed'. Self-inflicted and fixed by the
          restart that follows this commit. Recorded because the next person to run a rename
          migration against a live box needs to know to restart FIRST.
        remaining:
          - "3a.2: ingress wiring — resolve_for on inbound, TraceContext carries the incarnation, the one-line notice."
          - "3a.3: the turn-end transcript writer (conversations/messages), which is what makes I6 testable."
          - "3b: session.rollover on the EventBus, durable consumer tasks, standard-tier summary."
        open_question_found: >
          `/new` IS ALREADY TAKEN. gateway/turn_router.py:149 treats it as an in-flight routing
          signal meaning 'abandon steering into the running turn, start a fresh turn' — a
          concurrency verb. Bakir's Q8 answer assigns /new the session meaning 'archive the
          conversation and summarise it into memory'. Repurposing the token would silently
          change an existing feature. MUST be resolved before 3a.2 wires it.
      - date: 2026-07-25
        slice: "2 of 3 — SessionStore + migration 0092 + the derived mirror"
        files:
          - "src/stackowl/db/migrations/0092_sessions.sql (new) — sessions table, 2 indexes"
          - "src/stackowl/sessions/store.py (new) — SessionStore: resolve_for, save, prune, mirror projection"
          - "tests/sessions/test_session_store.py (new) — 12 tests against a REAL DbPool + real migrations, no mocks"
        design_notes:
          - "SQLite is the SINGLE source of truth; the JSON file is a DERIVED, WRITE-ONLY projection refreshed after each commit and never read back. That asymmetry is what makes Bakir's Q4 'both' choice safe: two stores that are both TRUSTED is a bug class, but a one-way projection cannot drift into disagreement because nothing consults it. Two tests pin the property — a corrupted mirror cannot affect behaviour, and a deleted mirror regenerates."
          - "Mirror failure is logged and swallowed. Nothing reads the file, so letting it raise would make a debugging aid capable of breaking a conversation — exactly backwards."
          - "prune() drops lane RECORDS but never a lane with suspended/resume_pending set: dropping those would lose the fact that a turn needs resuming. Transcripts are never touched (Q11, invariant I6)."
          - "resolve_for() returns the BRANCH rather than letting the caller infer it, so the DECISION point is logged from one place and a caller can never disagree with what actually happened."
        verified:
          migration: "0092 applied; second run reports already-applied. Schema at 0092."
          tests: "43 passed in tests/sessions/ (31 policy + 12 store). Store tests use a real DbPool and real migrations against a temp HOME — no mocks, because a mock here would hide column drift and boolean round-trip bugs."
          lint: "ruff clean."
          types: "mypy strict clean on all 4 source files."
        remaining:
          - "Slice 3: gateway wiring — call resolve_for on inbound, publish session.rollover with durable consumer tasks, the standard-tier summary, and surface the one-line notice. TOUCHES THE LIVE MESSAGE PATH."
      - date: 2026-07-25
        slice: "1 of 3 — identity + policy core (pure logic, no I/O)"
        files:
          - "src/stackowl/sessions/models.py (new) — SessionSource, SessionEntry, build_session_key, new_session_id, is_shared_lane"
          - "src/stackowl/sessions/policy.py (new) — ResetMode, ResetPolicy, resolve() priority order, reset_notice"
          - "src/stackowl/sessions/__init__.py (new) — package surface"
          - "tests/sessions/test_session_invariants.py (new) — 31 tests"
        design_notes:
          - "Deliberately pure: no store, no gateway, no clock of its own. Every branch of I3 is unit-testable without a database or waiting until 4 AM — which is exactly Bakir's Q16 answer (clock injection for logic, live run for wiring)."
          - "resolve() takes has_active_work as a BOOLEAN. The module does not know what 'work' means; the caller composes Q12's four conditions (background process, durable task, active objective, pending clarify). Keeps the policy layer free of dependencies on the autonomy layer."
          - "SessionEntry is frozen with an evolve() method, so no caller can mutate shared state by accident and every transition is a greppable call."
        bug_caught_by_types: >
          mypy found a real defect before any test ran: expired_reason() called
          policy.idle_armed / policy.daily_armed, but those properties live on
          ResetMode, not ResetPolicy. Would have raised AttributeError on the first
          real rollover. Fixed to policy.mode.idle_armed.
        verified:
          tests: "31 passed in tests/sessions/ — one per invariant I1-I5 plus the priority order, isolation rules, 4 AM boundary, stuck-loop escape and config validation."
          lint: "ruff clean (StrEnum adopted per UP042)."
          types: "mypy strict clean on all 3 source files."
        remaining:
          - "Slice 2: SessionStore — SQLite table (migration 0092) + the derived write-only JSON mirror of the key->id map."
          - "Slice 3: gateway wiring — resolve on inbound, rollover event on EventBus with durable consumer tasks, the standard-tier summary, and the one-line notice."
          - "Then: live validation run, and fold the 24 brainstorm answers into designs/D01.7.md."
    brainstorm_summary: >
      COMPLETE — 24 questions across 6 rounds, 2026-07-25. Settled: owl-keyed lanes; daily 4 AM
      + 24h idle + /new + context-full as the four rollover triggers, all sharing ONE code path;
      threads shared / main channel private; silent mid-turn restart recovery via resume_pending;
      3-strike stuck-loop escape that says why; a one-line visible boundary notice; SQLite canonical
      with a derived write-only JSON mirror of the key->id map; every runner gets a lane; keep
      transcripts, prune records; four never-expire conditions; cheap-model rollover summary gated
      on notability, publishing on the EventBus with durable consumer tasks; clock-injected unit
      tests plus a live wiring run; straight cutover with automatic migration.
      ONE OPEN ACTION blocks architect: D01.7-OA1 (verify tier_selector can serve the summary call).
    notes: >
      at_hour RESOLVED 2026-07-25: 4 AM, signed off by Bakir, superseding his Q16 midnight
      answer. Configurable so midnight stays reachable. No open questions remain on this item —
      it is ready to implement once D01.6 lands its baseline.

