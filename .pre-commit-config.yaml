repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy strict (src/stackowl)
        # The v2->root migration (c72a1704, 2026-06-17) moved the project to the
        # repo root; this hook still ran `cd v2 &&` afterwards and so failed every
        # time, taking the whole pre-commit run — and the B1-B9 boundary checks in
        # ci-v2.yml behind it — down with it.
        entry: bash -c 'uv run mypy --strict src/stackowl/'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: check-file-length
        name: check file length (300-line limit)
        entry: bash scripts/boundaries/check_file_length.sh
        language: system
        pass_filenames: false
        always_run: true
